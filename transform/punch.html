<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>每日进步 · Transform</title>
<style>
  :root {
    --bg: #F8F7F3;
    --surface: #FFFFFF;
    --surface-2: #F2F1EC;
    --ink: #151B19;
    --ink-2: #3D4A45;
    --ink-3: #7A8A83;
    --line: #E6E9E7;
    --line-2: #DDE2DF;
    --green: #0E6B50;
    --green-2: #158A68;
    --green-3: #1D9E75;
    --green-soft: #E8F4EE;
    --green-light: #C8EBD9;
    --green-50: #F0F9F4;
    --amber: #C87A2A;
    --amber-soft: #FDF3E6;
    --amber-2: #EAA052;
    --coral: #C05B3C;
    --coral-soft: #F9EBE5;
    --violet: #5B4AA8;
    --violet-soft: #EEECFA;
    --radius-xl: 32px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow-1: 0 1px 2px rgba(21,27,25,.04);
    --shadow-2: 0 4px 12px rgba(21,27,25,.06), 0 16px 40px rgba(21,27,25,.08);
    --shadow-3: 0 8px 24px rgba(21,27,25,.08), 0 32px 64px rgba(21,27,25,.12);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"] {
    --bg: #0C100F;
    --surface: #161C1A;
    --surface-2: #1E2523;
    --ink: #EEF4F1;
    --ink-2: #A7B6B0;
    --ink-3: #6A7A74;
    --line: #252E2C;
    --line-2: #2F3A37;
    --green: #34D29E;
    --green-2: #2BBB8A;
    --green-3: #1D9E75;
    --green-soft: #132A24;
    --green-light: #1E4A3E;
    --green-50: #0F1F1B;
    --amber: #EAA052;
    --amber-soft: #2E2417;
    --coral: #D9714F;
    --coral-soft: #2E1E18;
    --violet: #A99BE8;
    --violet-soft: #23203A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh;
  }
  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 20px 110px; }

  /* 完整版伴我改变入口（底部小链接） */
  .full-link-bar {
    text-align: center; margin-top: 24px; padding: 16px 0 0;
    border-top: 1px dashed var(--line);
  }
  .full-link-bar a {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--amber);
    text-decoration: none; padding: 8px 16px; border-radius: 999px;
    transition: all .2s;
  }
  .full-link-bar a:hover { background: var(--amber-soft); }

  /* ===== 顶栏 ===== */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 16px 0; }
  .back {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none;
    font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 999px; transition: all .2s;
  }
  .back:hover { background: var(--surface-2); color: var(--ink); }
  .topbar .spacer { flex: 1; }
  .topbar button {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13.5px;
    padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .topbar button:hover { color: var(--ink); border-color: var(--line-2); }

  /* ===== 每日进步主屏 ===== */
  .punch-hero {
    background: linear-gradient(135deg, var(--green-deep, #0A5A42), var(--green-3));
    border-radius: var(--radius-lg); padding: 26px 26px 20px; color: #fff;
    margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .punch-hero .ph-eyebrow { font-size: 12.5px; opacity: .85; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .punch-hero .ph-title { font-size: 25px; font-weight: 800; line-height: 1.35; margin-bottom: 10px; }
  .punch-hero .ph-desc { font-size: 14.5px; opacity: .92; line-height: 1.7; margin-bottom: 14px; }
  .punch-hero .ph-stats { display: flex; gap: 20px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.22); }
  .punch-hero .ph-stat { font-size: 13px; opacity: .95; }
  .punch-hero .ph-stat b { font-size: 17px; font-weight: 800; margin-right: 3px; }

  .punch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .p-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 16px 18px;
  }
  .p-card .pc-label {
    font-size: 11.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 8px; display: flex; align-items: center; gap: 6px;
  }
  .p-card .pc-label svg { width: 14px; height: 14px; }
  .p-card .pc-main { font-size: 15.5px; font-weight: 700; line-height: 1.6; color: var(--ink); }
  .p-card .pc-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.6; }

  .card-anchor { background: var(--amber-soft); border-color: rgba(200,122,42,.35); }
  .card-anchor .pc-label { color: var(--amber); }
  .card-anchor .pc-main { color: var(--ink); }
  .card-micro { background: var(--green-50); border-color: var(--green-light); }
  .card-micro .pc-label { color: var(--green); }
  .card-scene { background: var(--coral-soft); border-color: rgba(192,91,60,.3); }
  .card-scene .pc-label { color: var(--coral); }
  .card-moti { background: var(--violet-soft); border-color: rgba(91,74,168,.3); }
  .card-moti .pc-label { color: var(--violet); }

  /* 微行动步骤 */
  .micro-steps { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .micro-step {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line); cursor: pointer; transition: all .2s;
    font-size: 13.5px; color: var(--ink-2);
  }
  .micro-step .box {
    width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line-2);
    display: inline-flex; align-items: center; justify-content: center; font-size: 13px; color: transparent;
    flex-shrink: 0; transition: all .2s;
  }
  .micro-step.checked { background: var(--green-soft); border-color: var(--green-light); color: var(--green-deep, var(--green)); }
  .micro-step.checked .box { background: var(--green); border-color: var(--green); color: #fff; }

  /* 主 CTA */
  .cta-done {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 18px; border: none; border-radius: var(--radius-md);
    background: var(--green-3); color: #fff; font-size: 18px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease); box-shadow: 0 8px 24px rgba(29,158,117,.28);
  }
  .cta-done:hover { transform: translateY(-2px); background: var(--green-2); box-shadow: 0 12px 32px rgba(29,158,117,.36); }
  .cta-done:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .cta-miss {
    display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: var(--radius-sm);
    background: transparent; border: 1.5px dashed var(--line-2); color: var(--ink-3); font-size: 14px;
    cursor: pointer; font-family: inherit; transition: all .2s;
  }
  .cta-miss:hover { border-color: var(--amber); color: var(--amber); }

  /* ===== 今日反馈卡 ===== */
  .today-feedback { margin-top: 14px; }
  .today-feedback.hidden { display: none; }
  .tf-card {
    background: linear-gradient(135deg, var(--green-soft) 0%, var(--green-50) 100%);
    border: 1.5px solid var(--green-light); border-radius: var(--radius-lg);
    padding: 24px 22px 16px; text-align: center;
    box-shadow: 0 8px 28px rgba(29,158,117,.14);
    animation: tf-slide .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes tf-slide { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .tf-crown { font-size: 40px; line-height: 1; margin-bottom: 6px; animation: tf-bounce 1.4s ease infinite; }
  @keyframes tf-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .tf-title { font-size: 21px; font-weight: 800; color: var(--green); margin-bottom: 8px; }
  .tf-body { font-size: 15px; color: var(--ink); line-height: 1.7; margin-bottom: 14px; }
  .tf-stats { display: flex; justify-content: center; gap: 22px; padding: 12px 0; border-top: 1px dashed var(--green-light); border-bottom: 1px dashed var(--green-light); }
  .tf-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tf-stat span { font-size: 11px; color: var(--ink-3); }
  .tf-stat b { font-size: 24px; font-weight: 800; color: var(--green); line-height: 1; }
  .tf-stat em { font-size: 10px; color: var(--ink-3); font-style: normal; }
  .tf-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }
  .tf-actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; border: none; transition: all .25s var(--ease);
  }
  .btn-ghost { background: var(--surface); color: var(--green); border: 1.5px solid var(--green-light); }
  .btn-ghost:hover { border-color: var(--green); background: var(--green-50); }
  .btn-primary { background: var(--green-3); color: #fff; }
  .btn-primary:hover { background: var(--green-2); }
  .btn-amber { background: var(--amber); color: #fff; }
  .btn-amber:hover { filter: brightness(1.06); }

  /* ===== 没做到 ===== */
  .block-box { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px; display: none; }
  .block-box h3 { font-size: 15px; font-weight: 800; margin-bottom: 12px; }
  .reason-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reason {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 12px; font-size: 13.5px; color: var(--ink); cursor: pointer; font-family: inherit;
    text-align: left; line-height: 1.5; transition: all .2s;
  }
  .reason b { display: block; font-size: 15px; }
  .reason:hover { border-color: var(--amber); background: var(--amber-soft); }
  .ai-result { margin-top: 12px; background: var(--green-soft); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13.5px; line-height: 1.7; }

  /* ===== 计划全景 ===== */
  .plan-mini { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 18px; }
  .plan-mini .pm-title { font-size: 14px; font-weight: 800; margin-bottom: 4px; }
  .plan-mini .pm-hint { font-size: 12px; color: var(--ink-3); margin-bottom: 10px; }
  .plan-mini .pm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; max-height: 220px; overflow-y: auto; padding-right: 4px; }
  .pm-cell {
    text-align: center; padding: 8px 4px; border-radius: 10px; background: var(--surface-2);
    border: 1px solid var(--line); cursor: pointer; transition: all .15s;
    display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  .pm-cell:hover { border-color: var(--green); transform: translateY(-2px); }
  .pm-cell .pm-day { font-size: 14px; font-weight: 800; color: var(--ink-2); }
  .pm-cell .pm-micro { font-size: 11px; font-weight: 500; color: var(--ink-3); line-height: 1.2; word-break: break-all; }
  .pm-cell.done { background: var(--green-soft); border-color: var(--green-light); }
  .pm-cell.done .pm-day { color: var(--green); }
  .pm-cell.today { background: var(--green); border-color: var(--green); box-shadow: 0 0 0 4px rgba(29,158,117,.18); }
  .pm-cell.today .pm-day, .pm-cell.today .pm-micro { color: #fff; }

  /* ===== 社会支持 ===== */
  .support-box { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 18px; }
  .support-box label { font-size: 13px; font-weight: 700; color: var(--ink-2); display: block; margin-bottom: 8px; }
  .support-box input {
    width: 100%; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--line-2);
    background: var(--surface); font-size: 14px; font-family: inherit; color: var(--ink); outline: none;
  }
  .support-box input:focus { border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(29,158,117,.12); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .tag {
    display: inline-flex; align-items: center; gap: 6px; background: var(--green-soft); color: var(--green);
    border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600;
  }
  .tag button { background: none; border: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0; }

  /* ===== 空状态 ===== */
  .empty-state { text-align: center; padding: 70px 20px; }
  .empty-state .big { font-size: 46px; margin-bottom: 16px; }
  .empty-state h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
  .empty-state p { font-size: 14.5px; color: var(--ink-2); line-height: 1.7; margin-bottom: 22px; }

  /* 毕业态 */
  .grad-card {
    background: linear-gradient(135deg, var(--amber-soft), var(--coral-soft));
    border: 1.5px solid rgba(200,122,42,.4); border-radius: var(--radius-lg);
    padding: 26px 22px; text-align: center; margin-bottom: 16px;
  }
  .grad-card .crown { font-size: 46px; margin-bottom: 6px; }
  .grad-card h3 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
  .grad-card p { font-size: 14.5px; color: var(--ink-2); line-height: 1.7; margin-bottom: 10px; }
  .grad-card .id-tag { display: inline-block; background: #fff; color: var(--amber); font-size: 13.5px; font-weight: 700; padding: 7px 16px; border-radius: 999px; }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--surface); padding: 12px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .3s var(--ease);
    z-index: 100; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 创建态（think 同款风格） ===== */
  .create-hero {
    background: linear-gradient(135deg, #0A5A42, var(--green-3));
    border-radius: var(--radius-lg); padding: 30px 26px; color: #fff; margin-top: 8px;
  }
  .create-hero .ch-eyebrow { font-size: 12.5px; opacity: .85; letter-spacing: .5px; margin-bottom: 10px; }
  .create-hero h1 { font-size: 24px; font-weight: 800; line-height: 1.4; margin-bottom: 8px; }
  .create-hero p { font-size: 14px; opacity: .92; line-height: 1.7; margin-bottom: 18px; }
  .create-input {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: none; font-size: 15px;
    font-family: inherit; color: var(--ink); outline: none; background: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  .create-input::placeholder { color: var(--ink-3); }
  .cta-start {
    display: block; width: 100%; margin-top: 12px; padding: 15px; border: none; border-radius: 12px;
    background: #fff; color: #0A5A42; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease);
  }
  .cta-start:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.18); }
  .cta-start:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .ctx-card {
    background: var(--amber-soft); border: 1.5px solid rgba(200,122,42,.3); border-radius: var(--radius-md);
    padding: 14px 16px; margin-bottom: 14px;
  }
  .ctx-card .ctx-label { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--amber); margin-bottom: 6px; text-transform: uppercase; }
  .ctx-card .ctx-row { font-size: 13.5px; color: var(--ink); line-height: 1.7; }
  .ctx-card .ctx-row b { color: var(--amber); font-weight: 800; }

  .suggest-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 24px; margin-top: 16px;
  }
  .suggest-card .sc-tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800;
    letter-spacing: 1px; color: var(--green); margin-bottom: 12px; text-transform: uppercase;
  }
  .suggest-card .sc-title { font-size: 19px; font-weight: 800; line-height: 1.5; margin-bottom: 10px; color: var(--ink); }
  .suggest-card .sc-desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; margin-bottom: 16px; }
  .sc-field { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin: 14px 0 8px; }
  .sc-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .sc-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
    border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink-2);
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .sc-chip:hover { border-color: var(--green); color: var(--green); background: var(--green-50); }
  .sc-chip.sel { background: var(--green); border-color: var(--green); color: #fff; }
  .sc-input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line-2);
    background: var(--surface); font-size: 14px; font-family: inherit; color: var(--ink); outline: none;
  }
  .sc-input:focus { border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(29,158,117,.1); }
  .cta-confirm {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    margin-top: 16px; padding: 16px; border: none; border-radius: var(--radius-md);
    background: var(--green-3); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease);
  }
  .cta-confirm:hover { transform: translateY(-2px); background: var(--green-2); }
  .cta-confirm:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .cta-confirm.loading { opacity: .6; pointer-events: none; }
  .ai-out-box {
    margin-top: 12px; padding: 12px 14px; background: var(--green-soft); border-radius: 12px;
    font-size: 13.5px; line-height: 1.7; display: none;
  }
  .ai-out-box.show { display: block; animation: fade-in .3s ease; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  @media (max-width: 640px) {
    .punch-grid { grid-template-columns: 1fr; }
    .wrap { padding: 0 14px 90px; }
    .punch-hero { padding: 20px 18px 16px; }
    .punch-hero .ph-title { font-size: 21px; }
    .create-hero { padding: 22px 18px 18px; }
    .create-hero h1 { font-size: 21px; }
  }
</style>
<script>
  (function(){
    try { if (localStorage.getItem('trf_theme') === 'dark') document.documentElement.setAttribute('data-theme','dark'); }
    catch(e){}
  })();
</script>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      首页
    </a>
    <div class="spacer"></div>
    <button onclick="toggleTheme()" aria-label="切换深色模式">☾ 深色</button>
    <button onclick="location.href='growth.html#experiments'" aria-label="行为档案">📁 行为档案</button>
  </div>

  <!-- 每日进步主屏 -->
  <div id="punchArea"></div>
  <div class="full-link-bar">
    <a href="act.html">完整伴我改变 →</a>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ===================== 数据层（与 act.html 完全互通） ===================== */
const LS_ACTIONS = 'trf_actions';
const LS_PROFILE = 'trf_profile';
const LS_AI = 'trf_ai_config_v1';
const BRAND_PROFILES = {
  'DeepSeek': { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
  'OpenAI':   { baseUrl: 'https://api.openai.com/v1',  model: 'gpt-4o-mini' },
  'Gemini':   { baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai/', model: 'gemini-2.0-flash' }
};

let current = null; // 当前 Action

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('trf_theme', next); } catch(e){}
}
function getAI(){
  let cfg; try { cfg = JSON.parse(localStorage.getItem(LS_AI)) || {}; } catch(e){ cfg = {}; }
  const brand = cfg.brand || 'DeepSeek';
  const profile = BRAND_PROFILES[brand] || BRAND_PROFILES['DeepSeek'];
  return { brand, apiKey: cfg.apiKey || '', baseUrl: cfg.baseUrl || profile.baseUrl, model: cfg.model || profile.model };
}
function loadActions(){ try { return JSON.parse(localStorage.getItem(LS_ACTIONS)) || []; } catch(e){ return []; } }
function saveActions(list){ localStorage.setItem(LS_ACTIONS, JSON.stringify(list)); }
function loadProfile(){ try { return JSON.parse(localStorage.getItem(LS_PROFILE)) || { identityStatements: [] }; } catch(e){ return { identityStatements: [] }; } }
function saveProfile(p){ localStorage.setItem(LS_PROFILE, JSON.stringify(p)); }
function persistAction(){ const list = loadActions(); const i = list.findIndex(a => a.id === current.id); if (i >= 0) list[i] = current; else list.push(current); saveActions(list); }

async function aiCall(prompt, attempt = 1){
  const cfg = getAI();
  if (!cfg.apiKey) return null;
  const url = cfg.baseUrl.replace(/\/$/, '') + '/chat/completions';
  const maxAttempts = 4;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: cfg.model, messages: [{ role:'user', content: prompt }], temperature: 0.6, max_tokens: 400 })
    });
    if (!res.ok){
      if (attempt < maxAttempts && [503,502,500,429].includes(res.status)){
        await new Promise(r => setTimeout(r, 250 * Math.pow(2, attempt)));
        return aiCall(prompt, attempt + 1);
      }
      return null;
    }
    return (await res.json()).choices[0].message.content;
  } catch(e){ return null; }
}
function parseJSON(text){
  if (!text) return null;
  try { const m = text.match(/\{[\s\S]*\}/); if (!m) return null; return JSON.parse(m[0]); } catch(e){ return null; }
}

/* ===================== 每日进步核心 ===================== */
function logCompletion(done, day, difficulty, note){
  const today = new Date(); today.setHours(0,0,0,0);
  const lastDone = (current.logs || []).filter(l => l.done).slice(-1)[0];
  if (done){
    current.logs.push({ day, date: new Date().toISOString(), done: true, difficulty: difficulty||null, note: note||'' });
    current.totalDone = (current.totalDone || 0) + 1;
    if (lastDone){
      const ld = new Date(lastDone.date); ld.setHours(0,0,0,0);
      const diff = Math.round((today - ld) / 86400000);
      if (diff === 1) current.streak = (current.streak || 0) + 1;
      else if (diff > 1) current.streak = 1;
    } else {
      current.streak = 1;
    }
    current.bestStreak = Math.max(current.bestStreak || 0, current.streak);
    current.currentDay = day + 1;
    if (current.currentDay > current.targetDays){
      current.status = 'graduated'; current.graduatedAt = new Date().toISOString();
    } else current.status = 'active';
    if (current.identity){
      const profile = loadProfile();
      profile.identityStatements = profile.identityStatements || [];
      const ex = profile.identityStatements.find(s => s.text === current.identity);
      if (ex){ ex.votes = (ex.votes||0) + 1; ex.date = new Date().toISOString(); ex.source = 'action'; }
      else profile.identityStatements.push({ text: current.identity, votes: 1, date: new Date().toISOString(), source: 'action' });
      saveProfile(profile);
    }
  } else {
    current.logs.push({ day, date: new Date().toISOString(), done: false, difficulty: difficulty||null, note: note||'' });
    current.streak = 0;
  }
  persistAction();
}

function countVotes(){
  const profile = loadProfile();
  if (!current || !current.identity) return 0;
  const stmt = (profile.identityStatements || []).filter(s => s.source === 'action' && s.text === current.identity)[0];
  return stmt ? stmt.votes : 0;
}

function toggleSubStep(day, i){
  const d = current.plan.find(p => p.day === day); if (!d) return;
  d.subDone[i] = !d.subDone[i];
  persistAction();
  const steps = document.querySelectorAll('.micro-step');
  const idx = current.plan.findIndex(p => p.day === day);
  if (idx === current.plan.findIndex(p => p.day === current.currentDay)) updateDoneBtn();
  renderPunchMicro();
}
function renderPunchMicro(){
  const today = current.plan.find(p => p.day === current.currentDay);
  if (!today || !today.sub) return;
  const steps = document.querySelectorAll('.micro-step');
  steps.forEach((el, i) => {
    el.classList.toggle('checked', !!today.subDone[i]);
  });
}
function updateDoneBtn(){
  const btn = $('doneBtn'); if (!btn) return;
  const today = current.plan.find(p => p.day === current.currentDay);
  if (today && today.sub && today.sub.length){
    const allChecked = today.subDone.every(Boolean);
    btn.disabled = !allChecked;
    btn.style.opacity = allChecked ? '1' : '.5';
  } else { btn.disabled = false; btn.style.opacity = '1'; }
}

function renderPlanMini(){
  const box = $('planMini'); if (!box || !current) return;
  const doneDays = new Set((current.logs || []).filter(l => l.done).map(l => l.day));
  box.innerHTML = (current.plan || []).map(p => {
    const cls = doneDays.has(p.day) ? 'done' : (p.day === current.currentDay && current.status !== 'graduated' ? 'today' : '');
    const microShort = (p.micro || '').slice(0, 8) || '—';
    return `<div class="pm-cell ${cls}" title="第 ${p.day} 天 · ${escapeHtml(p.micro || '微行动待定')}" onclick="jumpToDay(${p.day})">
      <span class="pm-day">${p.day}</span>
      <span class="pm-micro">${escapeHtml(microShort)}</span>
    </div>`;
  }).join('');
}
function jumpToDay(day){
  if (!current || current.status === 'graduated') return;
  if (day === current.currentDay) return;
  current.currentDay = day;
  persistAction();
  renderPunch();
  toast('已切换到第 ' + day + ' 天');
}

/* ===================== 做完了 / 没做到 ===================== */
function markDone(){
  const today = current.plan.find(p => p.day === current.currentDay);
  if (today && today.sub && today.sub.length && !today.subDone.every(Boolean)){ toast('先把今天的几步都勾上'); return; }
  logCompletion(true, current.currentDay, null, '');
  if (current.status === 'graduated'){
    renderPunch();
    toast('全部完成！新的习惯和角色已生根 🎓');
    return;
  }
  renderPunch();
  showTodayFeedback();
}

function hideTodayFeedback(){
  const w = $('todayFeedbackWrap'); if (w) w.classList.add('hidden');
}

async function showTodayFeedback(){
  if (!current) return;
  const w = $('todayFeedbackWrap'); if (!w) return;
  const day = current.currentDay - 1;
  const streak = current.streak || 0;
  const total = current.totalDone || 0;
  const todayPlan = current.plan[current.currentDay - 2] || current.plan[current.currentDay - 1];
  const micro = (todayPlan && todayPlan.micro) || current.input;
  const votes = countVotes();
  const isFirst = day <= 0;
  const LOCAL_MSGS = isFirst
    ? [
      '今天的行为实验开始了：「' + micro + '」。',
      '这是「' + (current.identity || '期待的身份') + '」的第一票。',
      '锚点已就位，30 秒后开始今天的小事。',
      '第 1 天，先把「' + micro + '」做完。'
    ]
    : [
      '「' + micro + '」已经从「想做」走到「做到了」。',
      '连续 ' + streak + ' 天，是行为在替你提醒自己。',
      '给「' + (current.identity || '期待的身份') + '」投上第 ' + (votes + 1) + ' 票。',
      '明天的小事会自动出现，再 +1 天，更接近「' + (current.identity || '期望的自己') + '」。'
    ];
  $('tfCrown').textContent = isFirst ? '🚀' : ((day > 0 && day % 7 === 0) ? '🏆' : '🎉');
  $('tfTitle').textContent = isFirst ? '今天的行为实验开始了' : ('第 ' + day + ' 天做到了！');
  $('tfBody').textContent = LOCAL_MSGS[Math.abs((day - 1)) % LOCAL_MSGS.length];
  $('tfStreak').textContent = streak;
  $('tfTotal').textContent = total;
  $('tfVotes').textContent = '+1';
  $('tfSub').textContent = isFirst ? '你今天的目标已记录。做完它，再回来点「做完了」。' : '今天的事已记录在计划全景里，明天的小事已就位。';
  w.classList.remove('hidden');
  w.scrollIntoView({ behavior: 'smooth', block: 'center' });
  try {
    if (getAI().apiKey && micro && !isFirst) {
      const aiText = await aiCall(
        '用户刚完成了一个持续多天的「行为实验」中第 ' + day + ' 天：' + micro + '。\n' +
        '今天状态：连续 ' + streak + ' 天，累计 ' + total + ' 天，目标身份「' + (current.identity || '待定') + '」。\n' +
        '请用 1 句话（≤ 30 字）肯定这次完成，强调"具体行为"而非"坚持"。禁用"坚持"这种词。'
      );
      if (aiText) $('tfBody').textContent = aiText.trim().slice(0, 120);
    }
  } catch(e){}
}

function showBlock(){ const b = $('blockBox'); if (b) b.style.display = 'block'; }
function hideBlock(){ const b = $('blockBox'); if (b) b.style.display = 'none'; }

async function pickReason(reason){
  const day = current.currentDay;
  logCompletion(false, day, reason, '');
  const block = $('blockBox'); if (block) block.style.display = 'none';
  renderPunch();
  const today = current.plan.find(p => p.day === day);
  const text = await aiCall('用户因为「' + reason + '」没能做到今天的行动：「' + ((today && today.micro) || current.input) + '」。\n请给 1 个不靠意志力的调整建议，让下一次更容易发生。不要说加油、坚持之类的话。最多 2 句。');
  if (text){
    const box = $('aiBlockResult');
    if (box) box.innerHTML = `<div class="ai-result">${escapeHtml(text).replace(/\n/g,'<br>')}</div>`;
  }
  toast('没关系，没做到不是失败。调整一次，再试一次。');
}

/* ===================== 社会支持 ===================== */
function bindSupport(){
  const input = $('supportInput');
  if (!input || !current) return;
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      const v = input.value.trim(); if (!v) return;
      current.support = current.support || { people:[], tools:[], info:[] };
      current.support.people.push(v);
      persistAction();
      input.value = '';
      renderSupport();
    }
  });
}
function renderSupport(){
  const box = $('supportChips'); if (!box || !current) return;
  const s = current.support || {};
  const all = [
    ...(s.people||[]).map(v => ({ v, t:'people' })),
    ...(s.tools||[]).map(v => ({ v, t:'tools' })),
    ...(s.info||[]).map(v => ({ v, t:'info' }))
  ];
  box.innerHTML = all.map((it, i) => `<span class="tag">${escapeHtml(it.v)}<button onclick="removeSupport(${i})">×</button></span>`).join('');
}
function removeSupport(i){
  const s = current.support || {};
  const all = [
    ...(s.people||[]).map(v => ({ v, t:'people' })),
    ...(s.tools||[]).map(v => ({ v, t:'tools' })),
    ...(s.info||[]).map(v => ({ v, t:'info' }))
  ];
  const removed = all[i];
  if (!removed) return;
  current.support[removed.t] = (current.support[removed.t] || []).filter(v => v !== removed.v);
  persistAction();
  renderSupport();
}

          ${handoffInsight ? `<div class="ctx-row"><b>洞察：</b>${escapeHtml(handoffInsight)}</div>` : ''}
        </div>` : ''}
      <input class="create-input" id="changeInput" placeholder="${handoffScenario ? escapeHtml('围绕「' + handoffScenario + '」，你想改变点什么？') : '你想改变或实践什么？（例如：每天早震喝一杯温水）'}" maxlength="60">
      <button class="cta-start" id="startChangeBtn" onclick="startChange()">开始改变 →</button>
    </div>`;
  const input = $('changeInput');
  if (handoffScenario) input.value = handoffScenario;
  input.addEventListener('input', e => {
    $('startChangeBtn').disabled = e.target.value.trim().length < 4;
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') startChange(); });
  $('startChangeBtn').disabled = (input.value || '').trim().length < 4;
  input.focus();
}

async function startChange(){
  const goal = ($('changeInput').value || '').trim();
  if (goal.length < 4) { toast('再多写几个字'); return; }
  const cfg = getAI();
  if (!cfg.apiKey) { toast('请先在设置里配置 API Key 再开始'); return; }
  const btn = $('startChangeBtn');
  btn.disabled = true; btn.textContent = '知行正在建议今天的改变…';
  let sug = null;
  for (let attempt = 0; attempt < 3 && !sug; attempt++){
    const r = await aiCall(
      `用户的改变目标：「${goal}」\n认知起点：本质「${handoffNature || '未提供'}」洞察「${handoffInsight || '未提供'}」\n\n任务：基于以上，建议 1 个「今天就能完成的最小改变」——一个微行动。\n严格要求：\n1. 微行动一句话（10-25 字），小到不可能失败，30 秒内可完成\n2. 拆成 2-3 个更小步骤（每个 ≤10 字）\n3. 给 3 个稳定锚点时刻（在___之后）\n4. 严格按 JSON 输出：\n{"micro":"...","steps":["...","..."],"anchors":["在早震拿起手机之后","在午饭后","在晚上睡前"]}`
    );
    const d = parseJSON(r);
    if (d && d.micro && d.micro.trim()){
      sug = {
        micro: d.micro.trim().slice(0, 60),
        steps: Array.isArray(d.steps) ? d.steps.map(s => String(s).trim().slice(0, 20)).filter(Boolean).slice(0, 3) : [],
        anchors: Array.isArray(d.anchors) ? d.anchors.map(s => String(s).trim().slice(0, 30)).filter(Boolean).slice(0, 3) : []
      };
    }
  }
  if (!sug){
    btn.disabled = false; btn.textContent = '开始改变 →';
    toast('知行暂时没建议出来，请稍后再试');
    return;
  }
  draft.goal = goal;
  draft.micro = sug.micro;
  draft.steps = sug.steps.length ? sug.steps : ['完成这一小步'];
  draft.seconds = 30;
  renderSuggest(sug.anchors.length ? sug.anchors : ['在我早震拿起手机之后', '在我吃完午饭后', '在我晚上睡前']);
}

function renderSuggest(anchors){
  const area = $('punchArea');
  area.innerHTML = `
    <div class="suggest-card">
      <div class="sc-tag">知行建议 · 今天的改变</div>
      <div class="sc-title" id="sugTitle">${escapeHtml(draft.micro)}</div>
      <div class="sc-desc">小到不可能失败，30 秒内完成。先把它拆成更小的一步：</div>
      <div class="sc-field">小步骤（可点击完成）</div>
      <div class="sc-chips" id="stepChips">
        ${draft.steps.map((s, i) => `<span class="sc-chip" style="cursor:default;">${i+1}. ${escapeHtml(s)}</span>`).join('')}
      </div>
      <div class="sc-field">什么时候做？选一个锚点（点击选择）</div>
      <div class="sc-chips" id="anchorChips">
        ${anchors.map((a, i) => `<button class="sc-chip ${i === 0 ? 'sel' : ''}" onclick="pickAnchorChip(${i})" data-a="${escapeHtml(a)}">${escapeHtml(a)} 之后</button>`).join('')}
      </div>
      <div class="sc-field">你期待自己成为什么样的人？（身份票会投给它）</div>
      <input class="sc-input" id="identityInput" placeholder="例如：一个照顾自己身体的人" maxlength="30">
      <button class="cta-confirm" id="confirmBtn" onclick="confirmChange()">确认 · 今天就开始 →</button>
      <div class="ai-out-box" id="aiOut"></div>
    </div>`;
  draft.anchor = anchors[0] || '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pickAnchorChip(i){
  const chips = document.querySelectorAll('#anchorChips .sc-chip');
  chips.forEach((c, j) => c.classList.toggle('sel', j === i));
  const sel = chips[i];
  if (sel) draft.anchor = (sel.getAttribute('data-a') || '');
}

async function confirmChange(){
  const identity = ($('identityInput').value || '').trim();
  if (!draft.micro) { toast('先让知行建议今天的改变'); return; }
  if (!draft.anchor) { toast('选一个锚点时刻'); return; }
  if (!identity) { toast('写下你期待成为的人（身份票要投给它）'); return; }
  const btn = $('confirmBtn');
  btn.classList.add('loading'); btn.disabled = true;
  // 生成未来 7 天轻量计划（AI 一次生成，不做大拆解）
  let plan = null;
  for (let attempt = 0; attempt < 2 && !plan; attempt++){
    const r = await aiCall(
      `用户的改变目标：「${($('changeInput') ? '' : '')}」今日微行动：「${draft.micro}」\n\n任务：围绕这个目标生成未来 7 天每天的微行动（每天 1 句，≤20 字，小到不可能失败，第 1 天就是「${draft.micro}」）。\n严格按 JSON：\n{"days":[{"day":1,"micro":"${draft.micro}"},{"day":2,"micro":"..."},...,{"day":7,"micro":"..."}]}`
    );
    const d = parseJSON(r);
    if (d && Array.isArray(d.days) && d.days.length >= 3){
      plan = d.days.slice(0, 7).map(x => ({
        day: parseInt(x.day) || 0,
        micro: String(x.micro || '').trim().slice(0, 30),
        sub: [], subDone: []
      })).filter(x => x.day > 0 && x.micro);
    }
  }
  if (!plan){
    plan = [{day:1, micro:draft.micro, sub:[], subDone:[]}];
    for (let d = 2; d <= 7; d++){
      plan.push({ day:d, micro: ('继续完成「' + draft.micro + '」'), sub:[], subDone:[] });
    }
  }
  // 创建 action（轻量 7 天）
  const goal = draft.goal || handoffScenario || '行为改变';
  current = {
    id: 'a_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    input: (goal || '').trim() || draft.micro,
    createdAt: new Date().toISOString(),
    targetDays: 7,
    currentDay: 1,
    plan,
    logs: [],
    status: 'active',
    streak: 0, totalDone: 0, bestStreak: 0,
    anchor: { after: draft.anchor },
    reminder: '',
    identity: identity,
    celebration: '',
    support: { people:[], tools:[], info:[] },
    source: 'punch',
    insight: handoffInsight || '',
    scenario: handoffScenario || ''
  };
  persistAction();
  draft = { goal:'', micro:'', steps:[], seconds:30, anchor:'', identity:'' };
  renderPunch();
  // 第一次：引导完成今天的改变
  showTodayFeedback();
}

/* ===================== 初始化 ===================== */
(function init(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  // 从 think.html 跳转：携带洞察
  handoffInsight = (params.get('insight') || '').trim();
  handoffNature = (params.get('nature') || '').trim();
  handoffScenario = (params.get('scenario') || '').trim();
  if (id){
    current = loadActions().find(a => a.id === id) || null;
  } else {
    const list = loadActions();
    current = list.find(a => a.status === 'active') ||
              list.filter(a => a.status === 'graduated').sort((a,b) => new Date(b.graduatedAt||0) - new Date(a.graduatedAt||0))[0] ||
              list[0] || null;
  }
  if (current && current.status === 'active') renderPunch();
  else renderCreate();
})();
</script>
