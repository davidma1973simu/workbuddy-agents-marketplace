<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>我的成长资产 · Transform</title>
<style>
  :root {
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #1E2A26;
    --ink-2: #5A6B64;
    --ink-3: #93A09A;
    --line: #E4E8E3;
    --green: #1D9E75;
    --green-deep: #0E6B50;
    --green-soft: #E3F3EC;
    --green-50: #ECF8F3;
    --green-light: #BFE9D8;
    --amber: #D97B29;
    --amber-soft: #FBF0E2;
    --coral: #C05B3C;
    --coral-soft: #F9EBE5;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow: 0 2px 8px rgba(30,42,38,.05), 0 12px 32px rgba(30,42,38,.07);
    --shadow-hover: 0 6px 16px rgba(30,42,38,.09), 0 26px 60px rgba(30,42,38,.14);
    --touch: 44px;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"] {
    --bg: #13171A;
    --surface: #1E2422;
    --ink: #E8EFEB;
    --ink-2: #A9B8B2;
    --ink-3: #6E7E78;
    --line: #2C3633;
    --green: #2BBB8A;
    --green-deep: #34D29E;
    --green-soft: #16302A;
    --green-50: #10221D;
    --green-light: #1E4A3E;
    --amber: #E8943F;
    --amber-soft: #2E2417;
    --coral: #D9714F;
    --coral-soft: #2E1E18;
    --shadow: 0 2px 8px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.55);
    --shadow-hover: 0 6px 16px rgba(0,0,0,.4), 0 26px 60px rgba(0,0,0,.6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background:
      radial-gradient(900px 420px at 100% -8%, rgba(29,158,117,.10), transparent 60%),
      radial-gradient(720px 380px at -10% 4%, rgba(217,123,41,.08), transparent 55%),
      var(--bg);
    color: var(--ink); line-height: 1.62; min-height: 100vh;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 22px 20px 110px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 8px; }
  .nav-link {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--ink-2); font-size: 14px;
    padding: 9px 15px; border-radius: 999px; background: var(--surface);
    border: 1px solid var(--line); transition: all .2s;
  }
  .nav-link:hover { color: var(--green-deep); border-color: var(--green); }
  .nav-link.primary { color: var(--green-deep); border-color: var(--green); background: var(--green-soft); }
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); font-family: inherit;
    transition: all .2s; margin-left: auto;
  }
  .theme-toggle:hover { color: var(--green-deep); border-color: var(--green); }
  .theme-toggle .t-dark { display: none; }
  [data-theme="dark"] .theme-toggle .t-light { display: none; }
  [data-theme="dark"] .theme-toggle .t-dark { display: inline; }

  .page-head { margin: 14px 0 18px; }
  h1 { font-size: 27px; font-weight: 800; letter-spacing: -.5px; }
  .page-sub { font-size: 14px; color: var(--ink-2); margin-top: 6px; }

  .toolbar { display: flex; gap: 10px; margin: 16px 0 18px; flex-wrap: wrap; }
  .toolbar .act {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600;
    padding: 10px 16px; border-radius: 999px; cursor: pointer; transition: all .2s; font-family: inherit;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); text-decoration: none;
  }
  .toolbar .act:hover { color: var(--green-deep); border-color: var(--green); background: var(--green-soft); }
  .toolbar .act.solid { background: var(--green-deep); color: #fff; border-color: var(--green-deep); }
  .toolbar .act.solid:hover { background: var(--green); }

  /* 档案区域 */
  .archive-section { margin-top: 32px; }
  .archive-head {
    display: flex; align-items: center; gap: 16px;
    padding: 0 4px 18px;
  }
  .archive-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
  }
  .archive-section.cog .archive-icon {
    background: linear-gradient(135deg, var(--green-soft), #D6EFE2); color: var(--green-deep);
    box-shadow: 0 4px 14px rgba(29,158,117,.18);
  }
  .archive-section.beh .archive-icon {
    background: linear-gradient(135deg, var(--amber-soft), #F8E4C5); color: var(--amber);
    box-shadow: 0 4px 14px rgba(217,123,41,.18);
  }
  .archive-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; line-height: 1.3; }
  .archive-head p { font-size: 13px; color: var(--ink-3); margin-top: 3px; line-height: 1.5; }

  /* 紧凑统计条 */
  .stat-strip {
    display: flex; flex-wrap: wrap; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin: 18px 0 6px;
    box-shadow: 0 1px 2px rgba(30,42,38,.03);
  }
  .stat-strip .item {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--ink-2); font-weight: 600;
  }
  .stat-strip .num { font-size: 16px; font-weight: 800; color: var(--green-deep); }
  .stat-strip .sep { color: var(--line); margin: 0 2px; }

  /* 可展开卡（accordion） */
  .expand-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    margin-bottom: 12px; overflow: hidden;
    transition: border-color .25s, box-shadow .25s;
  }
  .expand-card.open { box-shadow: 0 4px 16px rgba(30,42,38,.06); }
  .expand-card.open.cog { border-color: rgba(29,158,117,.25); }
  .expand-card.open.beh { border-color: rgba(217,123,41,.25); }
  .expand-head {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 16px 20px;
    background: transparent; border: none; cursor: pointer;
    text-align: left; font-family: inherit; color: inherit;
    transition: background .2s;
  }
  .expand-head:hover { background: var(--bg); }
  .expand-icon {
    width: 40px; height: 40px; border-radius: 11px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0;
    background: var(--green-soft); color: var(--green-deep);
  }
  .expand-card.beh .expand-icon { background: var(--amber-soft); color: var(--amber); }
  .expand-card.open.cog .expand-icon { background: var(--green); color: #fff; }
  .expand-card.open.beh .expand-icon { background: var(--amber); color: #fff; }
  .expand-title { flex: 1; min-width: 0; }
  .expand-name { font-size: 15.5px; font-weight: 700; color: var(--ink); }
  .expand-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.4; }
  .expand-count {
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); flex-shrink: 0;
  }
  .expand-card.open.cog .expand-count { background: var(--green-soft); color: var(--green-deep); border-color: rgba(29,158,117,.2); }
  .expand-card.open.beh .expand-count { background: var(--amber-soft); color: #8B5A1B; border-color: rgba(217,123,41,.2); }
  .expand-chevron { color: var(--ink-3); flex-shrink: 0; transition: transform .3s var(--ease); }
  .expand-card.open .expand-chevron { transform: rotate(180deg); color: var(--green-deep); }
  .expand-card.beh.open .expand-chevron { color: var(--amber); }
  /* body 网格 0fr→1fr 平滑展开 */
  .expand-body {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .35s cubic-bezier(.16,1,.3,1);
  }
  .expand-card.open .expand-body { grid-template-rows: 1fr; }
  .expand-body > .inner { overflow: hidden; }
  .expand-card.open .expand-body > .inner { padding: 4px 20px 20px; }
  .expand-empty {
    padding: 28px 20px; text-align: center; color: var(--ink-3); font-size: 13.5px;
  }
  .expand-empty a { color: var(--green); text-decoration: none; font-weight: 700; }

  /* 身份英雄卡 */
  .identity-card {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #0E6B50 0%, #1D9E75 55%, #2BBB8A 100%);
    border-radius: var(--radius-lg); padding: 24px 22px; color: #fff;
    box-shadow: 0 12px 34px rgba(14,107,80,.32); margin-bottom: 14px;
    animation: rise .5s cubic-bezier(.16,1,.3,1);
  }
  .identity-card::after { content:""; position:absolute; right:-50px; top:-50px; width:180px; height:180px; border-radius:50%; background: rgba(255,255,255,.10); }
  .identity-card .k { font-size: 12px; opacity: .8; font-weight: 700; letter-spacing: 1.2px; }
  .identity-card .v { font-size: 18px; font-weight: 800; margin-top: 8px; line-height: 1.5; position: relative; }
  .identity-card .v em { font-style: normal; border-bottom: 2px solid rgba(255,255,255,.55); padding-bottom: 2px; }
  .identity-card .count {
    font-size: 12px; opacity: .85; margin-top: 12px; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.14); padding: 6px 12px; border-radius: 999px;
  }
  .identity-empty {
    background: var(--green-soft); color: var(--green-deep); padding: 20px 22px;
    border-radius: var(--radius-md); font-size: 14px; margin-bottom: 14px;
    display: flex; gap: 12px; align-items: flex-start; line-height: 1.7; border: 1px solid #CFE9DC;
  }

  /* 统计 */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0 6px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 10px; text-align: center; box-shadow: var(--shadow); }
  .stat .num { font-size: 22px; font-weight: 800; color: var(--green-deep); letter-spacing: -.5px; }
  .stat .lbl { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }

  .section-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; margin: 30px 0 14px; scroll-margin-top: 16px; }
  .section-title svg { color: var(--green); flex-shrink: 0; }
  .section-title .sec-sub { font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: auto; }

  /* 认知模型卡 */
  .model { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 20px 16px; margin-bottom: 14px; box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.16,1,.3,1); }
  .model .m-scenario { font-size: 13px; font-weight: 700; color: var(--green-deep); }
  .model .m-framework {
    position: relative; font-size: 16px; font-weight: 800; color: var(--ink); line-height: 1.7;
    background: var(--green-50); border-left: 4px solid var(--green);
    padding: 14px 16px 14px 18px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-top: 10px;
  }
  .model .m-changed { font-size: 13.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.6; }
  .model .m-date { font-size: 12px; color: var(--ink-3); margin-top: 12px; }

  /* 洞察卡 */
  .insight { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.16,1,.3,1); }
  .insight .i-scenario { font-size: 14px; font-weight: 700; color: var(--ink); }
  .insight .i-row { margin-top: 10px; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
  .insight .i-row b { color: var(--green-deep); font-size: 12px; display: inline-block; min-width: 44px; }
  .insight .i-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag-chip { font-size: 11.5px; font-weight: 700; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
  .insight .i-date { font-size: 12px; color: var(--ink-3); margin-top: 12px; }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-chip { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; transition: all .18s; }
  .filter-chip.on { color: var(--green-deep); background: var(--green-soft); border-color: var(--green); }

  /* 行为实验卡 */
  .action {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 20px 20px 14px; margin-bottom: 14px; box-shadow: var(--shadow);
    transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, border-color .25s;
    animation: rise .5s cubic-bezier(.16,1,.3,1);
    display: flex; flex-direction: column; min-width: 0;
  }
  .action:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: #CDE6DA; }
  .action .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .action .date { font-size: 12.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .status-chip { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .status-chip.active { color: var(--green-deep); background: var(--green-soft); }
  .status-chip.graduated { color: #7A5E16; background: var(--amber-soft); }
  .status-chip.paused { color: var(--ink-3); background: var(--bg); }
  .action .input { font-size: 15px; font-weight: 700; color: var(--ink-2); line-height: 1.5; }
  .action .plan-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    color: var(--green-deep); background: var(--green-soft); border: 1px solid #CFE9DC;
    padding: 4px 11px; border-radius: 999px; margin-top: 8px; align-self: flex-start;
  }
  .action .tiny {
    position: relative; font-size: 15px; font-weight: 800; color: var(--green-deep);
    background: linear-gradient(180deg, var(--green-soft), #F1FAF5); border-left: 4px solid var(--green);
    padding: 12px 14px 12px 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; line-height: 1.6; margin-top: 10px;
  }
  .action .a-source { font-size: 12px; color: var(--ink-3); margin-top: 10px; line-height: 1.6; }
  .action .a-source b { color: var(--green-deep); }
  .action .a-reflect { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink-2); line-height: 1.6; }
  .action .a-reflect b { color: var(--amber); font-size: 12px; }
  .action .anchor { font-size: 13px; color: var(--ink-2); margin-top: 10px; line-height: 1.6; }
  .action .meta { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); margin-top: 12px; flex-wrap: wrap; }
  .action .foot { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; }
  .mini {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line);
    padding: 9px 8px; min-height: var(--touch); border-radius: 10px; cursor: pointer; transition: all .18s; font-family: inherit; text-decoration: none;
  }
  .mini:hover { color: var(--green-deep); border-color: var(--green); background: var(--green-soft); }
  .mini.solid { background: var(--green-deep); color: #fff; border-color: var(--green-deep); }
  .mini.solid:hover { background: var(--green); }

  /* 模式识别 */
  .pattern-cta {
    background: linear-gradient(120deg, rgba(29,158,117,.10), rgba(29,158,117,.04));
    border: 1.5px solid var(--green); border-radius: var(--radius-lg); padding: 22px;
    margin-bottom: 14px;
  }
  .pattern-cta h3 { font-size: 16px; font-weight: 800; }
  .pattern-cta p { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; line-height: 1.7; }
  .pattern-cta .btn-row { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .btn-ai { background: var(--green-soft); color: var(--green-deep); padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; border: 1px solid rgba(29,158,117,.25); cursor: pointer; font-family: inherit; transition: all .2s; }
  .btn-ai:hover { background: var(--green-light); }
  .btn-ghost { background: var(--bg); color: var(--ink-2); padding: 11px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; border: 1px solid var(--line); cursor: pointer; font-family: inherit; transition: all .2s; }
  .btn-ghost:hover { color: var(--green-deep); border-color: var(--green); }
  .pattern { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px; margin-bottom: 12px; box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.16,1,.3,1); }
  .pattern .p-title { font-size: 15px; font-weight: 800; color: var(--ink); }
  .pattern .p-title .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--green-deep); background: var(--green-soft); padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 2px; }
  .pattern .p-evidence { font-size: 13px; color: var(--ink-2); margin-top: 8px; line-height: 1.7; }
  .pattern .p-insight { font-size: 13.5px; color: var(--green-deep); margin-top: 10px; line-height: 1.7; font-weight: 700; }
  .pattern-meta { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

  .empty { text-align: center; color: var(--ink-3); padding: 50px 20px; font-size: 14px; }
  .empty .big { width: 60px; height: 60px; margin: 0 auto 14px; border-radius: 20px; background: var(--green-soft); display: flex; align-items: center; justify-content: center; }
  .empty a { color: var(--green); text-decoration: none; font-weight: 700; }

  /* 设置弹窗 + toast */
  .modal-mask { position: fixed; inset: 0; background: rgba(20,28,25,.45); z-index: 90; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-mask.show { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 24px; width: 100%; max-width: 420px; box-shadow: var(--shadow-hover); }
  .modal h3 { font-size: 18px; font-weight: 800; margin-bottom: 14px; }
  .modal label { display: block; font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 14px 0 8px; }
  .modal select, .modal input {
    width: 100%; padding: 12px 14px; font-family: inherit; font-size: 15px; color: var(--ink);
    background: var(--bg); border: 1.5px solid var(--line); border-radius: var(--radius-md);
  }
  .modal .row { display: flex; gap: 10px; margin-top: 20px; }
  /* ===== 资产编辑（通用：编辑/归类/删除） ===== */
  .asset-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .asset-btn {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 12px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--line);
    color: var(--ink-2); font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .18s;
  }
  .asset-btn:hover { background: var(--green-soft); color: var(--green-deep); border-color: var(--green); }
  .asset-btn.del:hover { background: var(--red-soft, #fdecea); color: #c0392b; border-color: #c0392b; }
  .asset-btn.tag:hover { background: var(--amber-soft); color: #8B5A1B; border-color: var(--amber); }
  .modal textarea {
    width: 100%; min-height: 76px; padding: 12px 14px; font-family: inherit; font-size: 14.5px;
    color: var(--ink); background: var(--bg); border: 1.5px solid var(--line);
    border-radius: var(--radius-md); resize: vertical; line-height: 1.6;
  }
  .modal .tag-input-row { display: flex; gap: 8px; align-items: center; }
  .modal .tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .modal .tag-item {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--amber-soft); color: #8B5A1B;
    border: 1px solid rgba(217,123,41,.3); border-radius: 999px;
    padding: 4px 11px; font-size: 12.5px; font-weight: 600;
  }
  .modal .tag-item .x { cursor: pointer; opacity: .7; font-weight: 800; }
  .modal .tag-item .x:hover { opacity: 1; color: #c0392b; }
  .modal .btn-ghost, .modal .btn-ok {
    padding: 11px 20px; border-radius: 999px; font-size: 14px; font-weight: 700;
    border: none; cursor: pointer; font-family: inherit; transition: all .18s;
  }
  .modal .btn-ghost { background: var(--bg); color: var(--ink-2); border: 1.5px solid var(--line-2); }
  .modal .btn-ghost:hover { border-color: var(--green); color: var(--green-deep); }
  .modal .btn-ok { background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(14,107,80,.3); }

<script>
/* ===================== 数据层 ===================== */
const LS_ARCHIVE = 'trf_archive';
const LS_ACTIONS = 'trf_actions';
const LS_PROFILE = 'trf_profile';
const LS_AI = 'trf_ai_config_v1';
const LS_PATTERNS = 'trf_patterns';
const BRAND_PROFILES = {
  'DeepSeek': { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
  'OpenAI':   { baseUrl: 'https://api.openai.com/v1',  model: 'gpt-4o-mini' },
  'Gemini':   { baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai/', model: 'gemini-2.0-flash' }
};

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 2200); }
function fmtDate(iso){ try { return new Date(iso).toLocaleDateString('zh-CN', {year:'numeric', month:'numeric', day:'numeric'}); } catch(e){ return ''; } }
function loadArchive(){ try { return JSON.parse(localStorage.getItem(LS_ARCHIVE)) || []; } catch(e){ return []; } }
function loadActions(){ try { return JSON.parse(localStorage.getItem(LS_ACTIONS)) || []; } catch(e){ return []; } }
function loadProfile(){ try { return JSON.parse(localStorage.getItem(LS_PROFILE)) || { identityStatements: [] }; } catch(e){ return { identityStatements: [] }; } }
function getAI(){
  let cfg; try { cfg = JSON.parse(localStorage.getItem(LS_AI)) || {}; } catch(e){ cfg = {}; }
  const brand = cfg.brand || 'DeepSeek';
  const profile = BRAND_PROFILES[brand] || BRAND_PROFILES['DeepSeek'];
  return { brand, apiKey: cfg.apiKey || '', baseUrl: cfg.baseUrl || profile.baseUrl, model: cfg.model || profile.model };
}
async function aiCall(prompt, attempt = 1){
  const cfg = getAI();
  if (!cfg.apiKey){ toast('配置 API Key 后，Transform AI 才能帮你跨时间发现模式'); return null; }
  const url = cfg.baseUrl.replace(/\/$/, '') + '/chat/completions';
  const maxAttempts = 5;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: cfg.model, messages: [{ role:'user', content: prompt }], temperature: 0.5, max_tokens: 1200 })
    });
    if (!res.ok){
      if (attempt < maxAttempts && [503,502,500,429].includes(res.status)){
        await new Promise(r => setTimeout(r, 250 * Math.pow(2, attempt)));
        return aiCall(prompt, attempt + 1);
      }
      throw new Error('AI 请求失败：' + res.status);
    }
    return (await res.json()).choices[0].message.content;
  } catch(e){
    if (attempt < maxAttempts && ((e.message||'').includes('Failed to fetch') || (e.message||'').includes('aborted'))){
      await new Promise(r => setTimeout(r, 250 * Math.pow(2, attempt)));
      return aiCall(prompt, attempt + 1);
    }
    toast('AI 暂时不可用，请稍后重试');
    return null;
  }
}

/* ===================== 身份 ===================== */
function renderIdentity(){
  const profile = loadProfile();
  const votes = (profile.identityStatements || []).slice();
  const area = $('identityArea');
  if (!votes.length){
    area.innerHTML = `<div class="identity-empty">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#1D9E75" stroke-width="2"/><path d="M12 8v4l2.6 2.6" stroke="#1D9E75" stroke-width="2" stroke-linecap="round"/></svg>
      还没有身份票。每完成一次「伴我洞察」或「伴我改变」，都会给「我想成为的人」投一票，票数在这里累积。
    </div>`;
    return;
  }
  const map = new Map();
  votes.forEach(s => {
    const it = map.get(s.text) || { text: s.text, votes: 0, date: s.date };
    it.votes += (s.votes || 1);
    if (new Date(s.date) > new Date(it.date)) it.date = s.date;
    map.set(s.text, it);
  });
  const list = Array.from(map.values()).sort((a,b) => (b.votes - a.votes) || (new Date(b.date) - new Date(a.date)));
  const top = list[0];
  const rest = list.slice(1);
  area.innerHTML = `
    <div class="identity-card">
      <div class="k">我正在成为</div>
      <div class="v">「<em>${escapeHtml(top.text)}</em>」的人</div>
      <div class="count">已投 ${top.votes} 票${rest.length ? ' · 还有 ' + rest.length + ' 个身份在累积中' : ' · 你正在成为这个人'}</div>
    </div>`;
}

/* ===================== 统计 ===================== */
function renderStats(){
  const archive = loadArchive();
  const actions = loadActions();
  const graduated = actions.filter(a => a.status === 'graduated').length;
  const totalDone = actions.reduce((a,b) => a + (b.totalDone || 0), 0);
  const bestStreak = Math.max(...actions.map(a => a.bestStreak || 0), 0);
  const active = actions.filter(a => a.status === 'active').length;
  $('statsArea').innerHTML = `
    <span class="item"><span class="num">${archive.length}</span>认知洞察</span>
    <span class="sep">·</span>
    <span class="item"><span class="num">${actions.length}</span>行为实验</span>
    <span class="sep">·</span>
    <span class="item"><span class="num">${graduated}</span>已毕业</span>
    <span class="sep">·</span>
    <span class="item"><span class="num">${active}</span>进行中</span>
    <span class="sep">·</span>
    <span class="item"><span class="num">${bestStreak}</span>最长连续</span>
    <span class="sep">·</span>
    <span class="item"><span class="num">${totalDone}</span>累计做到</span>
  `;
  // 设置四个展开卡的计数徽章
  const m = archive.filter(s => (s.mentalModel && s.mentalModel.trim()) || (s.reflection && s.reflection.changed && s.reflection.changed.trim())).length;
  $('modelsCount').textContent = m;
  $('insightsCount').textContent = archive.length;
  $('experimentsCount').textContent = actions.length;
  let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_PATTERNS)); } catch(e){}
  $('patternsCount').textContent = (saved && saved.patterns) ? saved.patterns.length : 0;
}

/* ===================== 展开 / 收起 ===================== */
function toggleExpand(head){
  const card = head.closest('.expand-card');
  card.classList.toggle('open');
}

/* ===================== 认知模型（复盘产出） ===================== */
function renderModels(){
  const archive = loadArchive();
  const models = archive.filter(s => (s.mentalModel && s.mentalModel.trim()) || (s.reflection && s.reflection.changed && s.reflection.changed.trim()));
  const box = $('modelList');
  if (!models.length){
    box.innerHTML = `<div class="expand-empty">还没有沉淀的认知模型。<br>完成一次「伴我洞察」并复盘后，你的新认知框架会出现在这里。<br><a href="app.html">去想清楚一件事 →</a></div>`;
    return;
  }
  box.innerHTML = models.map((s, i) => {
    const fw = (s.mentalModel || '').trim();
    const changed = (s.reflection && s.reflection.changed || '').trim();
    return `<div class="model">
      <div class="m-scenario">${escapeHtml(s.scenario || '一次认知梳理')}</div>
      ${fw ? `<div class="m-framework">${escapeHtml(fw)}</div>` : ''}
      ${changed ? `<div class="m-changed"><b>改变了什么：</b>${escapeHtml(changed)}</div>` : ''}
      <div class="m-date">复盘于 ${fmtDate(s.reflectedAt || s.completedAt || s.createdAt)}</div>
      ${assetActions('model', s.id || i)}
    </div>`;
  }).join('');
}

/* ===================== 洞察库（含标签过滤） ===================== */
let insightFilter = '';
function renderTagFilters(){
  const archive = loadArchive();
  const tags = [];
  archive.forEach(s => (s.tags || []).forEach(t => { if (t && !tags.includes(t)) tags.push(t); }));
  const box = $('tagFilters');
  if (!tags.length){ box.innerHTML = ''; return; }
  box.innerHTML = '<button class="filter-chip' + (insightFilter ? '' : ' on') + '" onclick="setTagFilter(\'\')">全部</button>' +
    tags.map(t => `<button class="filter-chip${insightFilter === t ? ' on' : ''}" onclick="setTagFilter('${String(t).replace(/'/g, "\\'")}')">${escapeHtml(t)}</button>`).join('');
}
function setTagFilter(t){ insightFilter = t; renderTagFilters(); renderInsights(); }
function renderInsights(){
  let archive = loadArchive();
  const box = $('insightList');
  if (!archive.length){
    box.innerHTML = `<div class="expand-empty">还没有洞察。<br>每一次「伴我洞察」的核心认知都会沉淀在这里。<br><a href="app.html">去产出你的第一个洞察 →</a></div>`;
    return;
  }
  if (insightFilter) archive = archive.filter(s => (s.tags || []).includes(insightFilter));
  if (!archive.length){ box.innerHTML = '<div class="expand-empty">该标签下还没有洞察。</div>'; return; }
  box.innerHTML = archive.map(s => {
    const e = s.essence || {};
    const nature = (e.nature || '').trim();
    const insight = (e.insight || '').trim();
    const learned = (s.reflection && s.reflection.learned || '').trim();
    return `<div class="insight">
      <div class="i-scenario">${escapeHtml(s.scenario || '一次梳理')}</div>
      ${nature ? `<div class="i-row"><b>本质</b>${escapeHtml(nature)}</div>` : ''}
      ${insight ? `<div class="i-row"><b>洞察</b>${escapeHtml(insight)}</div>` : ''}
      ${learned ? `<div class="i-row"><b>学到</b>${escapeHtml(learned)}</div>` : ''}
      ${(s.tags || []).length ? `<div class="i-tags">${s.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="i-date">${fmtDate(s.completedAt || s.createdAt)}${s.reflectedAt ? ' · 已复盘' : ''}</div>
      ${assetActions('insight', s.id)}
    </div>`;
  }).join('');
}

/* ===================== 行为实验 ===================== */
function renderActions(){
  const actions = loadActions();
  const box = $('actionList');
  if (!actions.length){
    box.innerHTML = `<div class="expand-empty">还没有行为实验。<br>每一次「伴我改变」都是一个人生实验——从认知到行动，在这里留下完整记录。<br><a href="act.html">开始第一个实验 →</a></div>`;
    return;
  }
  box.innerHTML = actions.map(a => {
    const status = a.status || 'active';
    const statusText = { active: '进行中', graduated: '已毕业', paused: '已暂停' }[status] || status;
    const statusClass = { active: 'active', graduated: 'graduated', paused: 'paused' }[status] || 'paused';
    const lastLog = (a.logs || []).slice(-1)[0];
    const lastDate = lastLog ? fmtDate(lastLog.date) : fmtDate(a.createdAt);
    const N = a.targetDays || 0;
    const totalDone = a.totalDone || 0;
    const plan = a.plan || [];
    const curDay = a.currentDay || 1;
    const curMicro = (plan.length && plan[Math.min(curDay, plan.length) - 1]) ? plan[Math.min(curDay, plan.length) - 1].micro : ((a.tiny && a.tiny.text) || '');
    const microText = status === 'graduated' ? '已完成全部 ' + N + ' 天计划' : (curMicro || '');
    return `<div class="action">
      <div class="row1">
        <span class="date">${lastDate}</span>
        <span class="status-chip ${statusClass}">${statusText}</span>
      </div>
      <div class="input">${escapeHtml(a.input || a.goal || '')}</div>
      ${N ? `<span class="plan-pill">📅 ${N} 天实验 · 已完成 ${totalDone}/${N}</span>` : ''}
      ${microText ? `<div class="tiny">${escapeHtml(microText)}</div>` : ''}
      ${a.insight ? `<div class="a-source"><b>源于洞察：</b>${escapeHtml(a.insight.replace(/\n+/g, ' · '))}</div>` : ''}
      ${a.anchor && a.anchor.after ? `<div class="anchor">锚点：在我 ${escapeHtml(a.anchor.after)} 之后</div>` : ''}
      ${(a.result || a.habit || (a.reflection && (a.reflection.changed || ''))) ? `<div class="a-reflect">
        ${a.result ? `<div><b>结果</b> ${escapeHtml(a.result)}</div>` : ''}
        ${a.habit ? `<div><b>新习惯</b> ${escapeHtml(a.habit)}</div>` : ''}
        ${a.reflection && a.reflection.changed ? `<div><b>改变</b> ${escapeHtml(a.reflection.changed)}</div>` : ''}
      </div>` : ''}
      <div class="meta">
        <span>连续 ${a.streak || 0} 天</span>
        <span>累计 ${totalDone} 天</span>
        <span>身份票 ${a.totalDone || 0} 张</span>
      </div>
      <div class="foot">
        <a class="mini solid" href="act.html?id=${a.id}">去做 / 续接</a>
        <button class="mini" onclick="exportOne('${a.id}')">导出</button>
      </div>
      ${assetActions('action', a.id)}
    </div>`;
  }).join('');
}

/* ===================== 模式识别 ===================== */
function renderPatterns(){
  const area = $('patternArea');
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(LS_PATTERNS)); } catch(e){}
  const archive = loadArchive(); const actions = loadActions();
  const hasData = archive.length || actions.length;
  if (saved && saved.patterns && saved.patterns.length){
    area.innerHTML = `<div class="pattern-cta">
      <h3>Transform 发现的跨时间模式</h3>
      <p>基于你 ${archive.length} 次认知梳理 + ${actions.length} 个行为实验，识别到 ${saved.patterns.length} 个重复模式。分析于 ${fmtDate(saved.generatedAt)}。</p>
      <div class="btn-row"><button class="btn-ai" onclick="aiDiscoverPatterns(true)">重新分析</button><button class="btn-ghost" onclick="clearPatterns()">清除</button></div>
    </div>` +
    saved.patterns.map((p, i) => `<div class="pattern">
      <div class="p-title">${escapeHtml(p.title)}<span class="tag">模式 ${i+1}</span></div>
      <div class="p-evidence">${escapeHtml(p.evidence || '')}</div>
      <div class="p-insight">${escapeHtml(p.insight || '')}</div>
      ${assetActions('pattern', i)}
    </div>`).join('') + `<div class="pattern-meta">Transform · Growth Memory Agent</div>`;
    return;
  }
  if (!hasData){
    area.innerHTML = `<div class="expand-empty">还没有足够的数据发现模式。<br>先完成几次「伴我洞察」或「伴我改变」，Transform才能跨时间看到你反复出现的问题、角色与阻力。</div>`;
    return;
  }
  area.innerHTML = `<div class="pattern-cta">
    <h3>Transform 帮你跨时间发现模式</h3>
    <p>AI 会阅读你全部 ${archive.length} 次认知梳理与 ${actions.length} 个行为实验，找出「你反复出现的问题」「一直想成为的角色」「重复踩过的阻力」——这才是成长资产的长期价值。</p>
    <div class="btn-row"><button class="btn-ai" onclick="aiDiscoverPatterns(false)">Transform帮我发现模式</button></div>
  </div>
  <div class="pattern-meta" id="patternHint" style="margin-top:2px;"></div>`;
  // 无 API Key 时给出基础素材提示
  const cfg = getAI();
  if (!cfg.apiKey) $('patternHint').innerHTML = '（未配置 API Key：可先看「身份」与「洞察库」里的标签，作为基础素材）';
}
function buildPatternSource(){
  const archive = loadArchive(); const actions = loadActions();
  const parts = [];
  archive.slice(0, 30).forEach(s => {
    const e = s.essence || {};
    parts.push('认知[' + (s.scenario || '?') + '] 本质:' + (e.nature || '').slice(0, 50) + ' 洞察:' + (e.insight || '').slice(0, 60) + (s.mentalModel ? ' 框架:' + s.mentalModel.slice(0, 60) : '') + (s.tags && s.tags.length ? ' 标签:' + s.tags.join('/') : ''));
  });
  actions.slice(0, 30).forEach(a => {
    parts.push('行为[' + (a.input || '?') + '] 状态:' + (a.status || '') + (a.result ? ' 结果:' + a.result.slice(0, 50) : '') + (a.habit ? ' 习惯:' + a.habit.slice(0, 50) : '') + (a.reflection && a.reflection.changed ? ' 改变:' + a.reflection.changed.slice(0, 50) : ''));
  });
  return parts.join('\n').slice(0, 3200);
}
async function aiDiscoverPatterns(regen){
  const src = buildPatternSource();
  const prompt = '你是用户的「成长记录员 Growth Memory Agent」。请跨时间阅读以下成长记录，识别 2-4 个最值得用户注意的重复模式：反复出现的问题、一直想成为的角色、重复踩过的阻力、或正在形成的优势。\n成长记录：\n' + src + '\n严格返回 JSON：{"patterns":[{"title":"一句话标题","evidence":"支撑证据（引用具体记录，40字内）","insight":"对用户的洞察与建议（40字内）"}]}';
  toast(regen ? '正在重新分析…' : '正在跨时间扫描你的成长记录…');
  const text = await aiCall(prompt);
  if (!text) return;
  try {
    const j = JSON.parse(text.replace(/```json|```/g, '').trim());
    if (!j.patterns || !j.patterns.length) throw new Error('no patterns');
    // 去重（按 title）+ 限制最多 4 个
    const seen = new Set();
    const uniquePatterns = j.patterns.filter(p => {
      const t = (p && p.title || '').trim();
      if (!t || seen.has(t)) return false;
      seen.add(t);
      return true;
    }).slice(0, 4);
    localStorage.setItem(LS_PATTERNS, JSON.stringify({ patterns: uniquePatterns, generatedAt: new Date().toISOString() }));
    renderPatterns();
    $('patterns').scrollIntoView({ behavior: 'smooth' });
  } catch(err){
    const area = $('patternArea');
    area.innerHTML += `<div class="pattern" style="white-space:pre-wrap;">${escapeHtml(text)}</div>`;
  }
}
function clearPatterns(){ localStorage.removeItem(LS_PATTERNS); renderPatterns(); }

/* ===================== 资产编辑（通用：编辑 / 归类 / 删除） ===================== */
let assetModalCtx = null; // { type, id, tagOnly }

function assetActions(type, id){
  return `<div class="asset-actions">
    <button class="asset-btn" onclick="openAssetEdit('${type}','${id}')">✏️ 编辑</button>
    <button class="asset-btn tag" onclick="openAssetTag('${type}','${id}')">🏷 归类</button>
    <button class="asset-btn del" onclick="openAssetDelete('${type}','${id}')">🗑 删除</button>
  </div>`;
}

// 定位资产对象 + 保存
function assetFind(type, id){
  if (type === 'insight' || type === 'model'){
    return loadArchive().find(s => String(s.id) === String(id));
  }
  if (type === 'action') return loadActions().find(a => String(a.id) === String(id));
  if (type === 'pattern'){
    let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_PATTERNS)); } catch(e){}
    if (saved && saved.patterns) return saved.patterns[parseInt(id)];
  }
  return null;
}
function assetSave(type, id, mutate){
  if (type === 'insight' || type === 'model'){
    const list = loadArchive();
    const i = list.findIndex(s => String(s.id) === String(id));
    if (i >= 0){ mutate(list[i]); localStorage.setItem(LS_ARCHIVE, JSON.stringify(list)); }
  } else if (type === 'action'){
    const list = loadActions();
    const i = list.findIndex(a => String(a.id) === String(id));
    if (i >= 0){ mutate(list[i]); localStorage.setItem(LS_ACTIONS, JSON.stringify(list)); }
  } else if (type === 'pattern'){
    let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_PATTERNS)); } catch(e){}
    if (saved && saved.patterns && saved.patterns[parseInt(id)]){ mutate(saved.patterns[parseInt(id)]); localStorage.setItem(LS_PATTERNS, JSON.stringify(saved)); }
  }
  renderAll();
}
function renderAll(){ renderModels(); renderTagFilters(); renderInsights(); renderActions(); renderPatterns(); }

function openAssetModal(html){
  const mask = $('assetModalMask'); const box = $('assetModalBox');
  if (!mask || !box) return;
  box.innerHTML = html;
  mask.classList.add('show');
}
function closeAssetModal(){
  const mask = $('assetModalMask');
  if (mask) mask.classList.remove('show');
  assetModalCtx = null;
}

// 编辑
function openAssetEdit(type, id){
  const obj = assetFind(type, id);
  if (!obj){ toast('找不到这条资产'); return; }
  assetModalCtx = { type, id };
  const e = obj.essence || {};
  const r = obj.reflection || {};
  let fields = '';
  if (type === 'model'){
    fields = `
      <label>场景</label><input id="ae1" value="${escapeHtml(obj.scenario || '')}">
      <label>认知框架</label><textarea id="ae2">${escapeHtml(obj.mentalModel || '')}</textarea>
      <label>改变了什么</label><textarea id="ae3">${escapeHtml(r.changed || '')}</textarea>`;
  } else if (type === 'insight'){
    fields = `
      <label>场景</label><input id="ae1" value="${escapeHtml(obj.scenario || '')}">
      <label>本质</label><textarea id="ae2">${escapeHtml(e.nature || '')}</textarea>
      <label>洞察</label><textarea id="ae3">${escapeHtml(e.insight || '')}</textarea>
      <label>学到</label><textarea id="ae4">${escapeHtml(r.learned || '')}</textarea>`;
  } else if (type === 'action'){
    fields = `
      <label>目标 / 输入</label><textarea id="ae1">${escapeHtml(obj.input || obj.goal || '')}</textarea>
      <label>结果</label><textarea id="ae2">${escapeHtml(obj.result || '')}</textarea>
      <label>新习惯</label><textarea id="ae3">${escapeHtml(obj.habit || '')}</textarea>
      <label>改变</label><textarea id="ae4">${escapeHtml(r.changed || '')}</textarea>`;
  } else if (type === 'pattern'){
    fields = `
      <label>模式标题</label><input id="ae1" value="${escapeHtml(obj.title || '')}">
      <label>支撑证据</label><textarea id="ae2">${escapeHtml(obj.evidence || '')}</textarea>
      <label>洞察与建议</label><textarea id="ae3">${escapeHtml(obj.insight || '')}</textarea>`;
  }
  openAssetModal(`
    <h3>✏️ 编辑${assetTypeName(type)}</h3>
    ${fields}
    <div class="row">
      <button class="btn-ok" style="flex:1;" onclick="saveAssetEdit()">保存</button>
      <button class="btn-ghost" onclick="closeAssetModal()">取消</button>
    </div>`);
}
function saveAssetEdit(){
  const ctx = assetModalCtx; if (!ctx) return;
  const v = i => { const el = document.getElementById(i); return el ? el.value.trim() : ''; };
  assetSave(ctx.type, ctx.id, obj => {
    const e = obj.essence || (obj.essence = {});
    const r = obj.reflection || (obj.reflection = {});
    if (ctx.type === 'model'){
      obj.scenario = v('ae1'); obj.mentalModel = v('ae2'); r.changed = v('ae3');
    } else if (ctx.type === 'insight'){
      obj.scenario = v('ae1'); e.nature = v('ae2'); e.insight = v('ae3'); r.learned = v('ae4');
    } else if (ctx.type === 'action'){
      obj.input = v('ae1'); obj.result = v('ae2'); obj.habit = v('ae3'); r.changed = v('ae4');
    } else if (ctx.type === 'pattern'){
      obj.title = v('ae1'); obj.evidence = v('ae2'); obj.insight = v('ae3');
    }
  });
  closeAssetModal();
  toast('已保存');
}

// 归类（标签）
function openAssetTag(type, id){
  const obj = assetFind(type, id);
  if (!obj){ toast('找不到这条资产'); return; }
  assetModalCtx = { type, id };
  const tags = obj.tags || [];
  renderTagModal(tags);
}
function renderTagModal(tags){
  const ctx = assetModalCtx; if (!ctx) return;
  openAssetModal(`
    <h3>🏷 归类${assetTypeName(ctx.type)}</h3>
    <p style="font-size:13px;color:var(--ink-2);margin-bottom:8px;">给这条资产打标签，便于日后按主题查找。</p>
    <div class="tag-list" id="tagList">${tags.map(t => `<span class="tag-item">${escapeHtml(t)}<span class="x" onclick="removeAssetTag('${escapeHtml(t)}')">×</span></span>`).join('')}</div>
    <div class="tag-input-row" style="margin-top:10px;">
      <input id="newTagInput" placeholder="新标签" style="flex:1;" maxlength="20" onkeydown="if(event.key==='Enter')addAssetTag()">
      <button class="btn-ok" onclick="addAssetTag()">添加</button>
    </div>
    <div class="row">
      <button class="btn-ok" style="flex:1;" onclick="closeAssetModal()">完成</button>
      <button class="btn-ghost" onclick="closeAssetModal()">取消</button>
    </div>`);
}
function addAssetTag(){
  const ctx = assetModalCtx; if (!ctx) return;
  const inp = $('newTagInput'); if (!inp) return;
  const t = (inp.value || '').trim(); if (!t) return;
  assetSave(ctx.type, ctx.id, obj => {
    obj.tags = obj.tags || [];
    if (!obj.tags.includes(t)) obj.tags.push(t);
  });
  const obj = assetFind(ctx.type, ctx.id);
  renderTagModal((obj && obj.tags) || []);
  inp.value = '';
}
function removeAssetTag(t){
  const ctx = assetModalCtx; if (!ctx) return;
  assetSave(ctx.type, ctx.id, obj => {
    obj.tags = (obj.tags || []).filter(x => x !== t);
  });
  const obj = assetFind(ctx.type, ctx.id);
  renderTagModal((obj && obj.tags) || []);
}

// 删除
function openAssetDelete(type, id){
  const obj = assetFind(type, id);
  if (!obj){ toast('找不到这条资产'); return; }
  assetModalCtx = { type, id };
  const preview = (type === 'pattern') ? obj.title : (obj.scenario || obj.input || obj.goal || obj.title || '这条资产');
  openAssetModal(`
    <h3>🗑 删除${assetTypeName(type)}</h3>
    <p style="font-size:14px;color:var(--ink);line-height:1.7;">确定删除「<b>${escapeHtml(String(preview).slice(0, 30))}</b>」吗？此操作不可撤销。</p>
    <div class="row">
      <button class="btn-danger" style="flex:1;" onclick="confirmDeleteAsset()">确认删除</button>
      <button class="btn-ghost" onclick="closeAssetModal()">取消</button>
    </div>`);
}
function confirmDeleteAsset(){
  const ctx = assetModalCtx; if (!ctx) return;
  if (ctx.type === 'insight' || ctx.type === 'model'){
    const list = loadArchive().filter(s => String(s.id) !== String(ctx.id));
    localStorage.setItem(LS_ARCHIVE, JSON.stringify(list));
  } else if (ctx.type === 'action'){
    const list = loadActions().filter(a => String(a.id) !== String(ctx.id));
    localStorage.setItem(LS_ACTIONS, JSON.stringify(list));
  } else if (ctx.type === 'pattern'){
    let saved = null; try { saved = JSON.parse(localStorage.getItem(LS_PATTERNS)); } catch(e){}
    if (saved && saved.patterns){ saved.patterns.splice(parseInt(ctx.id), 1); localStorage.setItem(LS_PATTERNS, JSON.stringify(saved)); }
  }
  closeAssetModal();
  renderAll();
  toast('已删除');
}
function assetTypeName(type){
  return { model: '认知模型', insight: '洞察', action: '行为实验', pattern: '模式' }[type] || '';
}

/* ===================== 导出 ===================== */
function exportOne(id){
  const a = loadActions().find(x => x.id === id);
  if (!a) return;
  const blob = new Blob([JSON.stringify(a, null, 2)], { type: 'application/json' });
  const u = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href = u; el.download = 'transform-action-' + a.id + '.json';
  el.click(); URL.revokeObjectURL(u);
}
function downloadAll(){
  const data = { archive: loadArchive(), actions: loadActions(), profile: loadProfile(), patterns: (() => { try { return JSON.parse(localStorage.getItem(LS_PATTERNS)); } catch(e){ return null; } })() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const u = URL.createObjectURL(blob);
  const el = document.createElement('a');
  el.href = u; el.download = 'transform-growth-assets.json';
  el.click(); URL.revokeObjectURL(u);
}

/* ===================== 设置 + 主题 ===================== */
function toggleTheme(){
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem('trf_theme', dark ? 'light' : 'dark'); } catch(e){}
}
function openSettings(){
  const cfg = getAI();
  $('cfgBrand').value = cfg.brand;
  $('cfgApiKey').value = cfg.apiKey || '';
  $('settingsMask').classList.add('show');
}
function closeSettings(){ $('settingsMask').classList.remove('show'); }
function saveSettings(){
  const brand = $('cfgBrand').value;
  const apiKey = $('cfgApiKey').value.trim();
  const profile = BRAND_PROFILES[brand] || BRAND_PROFILES['DeepSeek'];
  localStorage.setItem(LS_AI, JSON.stringify({ brand, apiKey, baseUrl: profile.baseUrl, model: profile.model }));
  closeSettings();
  toast('AI 设置已保存');
  renderPatterns();
}

/* ===================== 启动 ===================== */
renderIdentity();
renderStats();
renderModels();
renderTagFilters();
renderInsights();
renderActions();
renderPatterns();
(function(){
  const h = location.hash;
  if (h && document.querySelector(h)){
    setTimeout(() => document.querySelector(h).scrollIntoView({ behavior: 'smooth' }), 120);
  }
})();
</script>
