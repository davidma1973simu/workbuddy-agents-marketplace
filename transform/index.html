<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Transform · 想清楚，做得到</title>
<style>
  :root {
    --bg: #F8F7F3;
    --surface: #FFFFFF;
    --surface-2: #F2F1EC;
    --ink: #151B19;
    --ink-2: #3D4A45;
    --ink-3: #7A8A83;
    --line: #E6E9E7;
    --line-2: #DDE2DF;
    --green: #0E6B50;
    --green-2: #158A68;
    --green-3: #1D9E75;
    --green-soft: #E8F4EE;
    --green-light: #C8EBD9;
    --green-50: #F0F9F4;
    --amber: #C87A2A;
    --amber-soft: #FDF3E6;
    --coral: #C05B3C;
    --coral-soft: #F9EBE5;
    --violet: #5B4AA8;
    --violet-soft: #EEECFA;
    --radius-xl: 32px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow-2: 0 4px 12px rgba(21,27,25,.06), 0 16px 40px rgba(21,27,25,.08);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"] {
    --bg: #0C100F;
    --surface: #161C1A;
    --surface-2: #1E2523;
    --ink: #EEF4F1;
    --ink-2: #A7B6B0;
    --ink-3: #6A7A74;
    --line: #252E2C;
    --line-2: #2F3A37;
    --green: #34D29E;
    --green-2: #2BBB8A;
    --green-3: #1D9E75;
    --green-soft: #132A24;
    --green-light: #1E4A3E;
    --green-50: #0F1F1B;
    --amber: #EAA052;
    --amber-soft: #2E2417;
    --coral: #D9714F;
    --coral-soft: #2E1E18;
    --violet: #A99BE8;
    --violet-soft: #23203A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh;
  }

  /* 背景氛围（轻量） */
  .bg-atmo { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .atmo-blob { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .4; }
  .atmo-blob.a { width: 520px; height: 520px; background: radial-gradient(circle, var(--green-soft), transparent 68%); top: -160px; right: -140px; }
  .atmo-blob.b { width: 360px; height: 360px; background: radial-gradient(circle, var(--green-light), transparent 68%); bottom: 6%; left: -120px; opacity: .28; }

  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 0 20px 110px; }

  /* 顶部导航 */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 18px 0 6px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 11px;
    background: linear-gradient(145deg, var(--green-2), var(--green));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(14,107,80,.28);
  }
  .brand-name { font-size: 16px; font-weight: 800; letter-spacing: -.2px; }
  .brand-slogan { font-size: 11.5px; color: var(--ink-3); font-weight: 500; margin-top: -2px; }
  .topbar .spacer { flex: 1; }
  .topbar button {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px;
    padding: 8px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .topbar button:hover { color: var(--ink); border-color: var(--line-2); }

  /* 品牌区 */
  .motto { padding: 14px 2px 18px; }
  .motto h1 { font-size: 26px; font-weight: 800; letter-spacing: -.3px; }
  .motto h1 em { font-style: normal; color: var(--green); }
  .motto p { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.7; }

  /* ===== 今日卡片（动态主区） ===== */
  .today-card { border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-2); margin-bottom: 14px; }
  .tc-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 20px; font-size: 12px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .tc-head .dot { width: 7px; height: 7px; border-radius: 50%; }
  .tc-body { padding: 20px 22px 24px; }
  .tc-eyebrow { font-size: 12.5px; opacity: .88; letter-spacing: .5px; margin-bottom: 8px; }
  .tc-title { font-size: 24px; font-weight: 800; line-height: 1.4; margin-bottom: 10px; }
  .tc-desc { font-size: 14px; opacity: .92; line-height: 1.7; margin-bottom: 18px; }
  .tc-stats { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 16px; font-size: 13px; opacity: .95; }
  .tc-stats b { font-size: 16px; font-weight: 800; margin-right: 3px; }

  .tc-input {
    width: 100%; padding: 14px 16px; border-radius: 13px; border: none;
    font-size: 15px; font-family: inherit; color: var(--ink); background: #fff; outline: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  .tc-input::placeholder { color: var(--ink-3); }

  .tc-cta {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 16px; margin-top: 12px; border: none; border-radius: 14px;
    font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
    transition: all .25s var(--ease);
  }
  .tc-cta:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .tc-cta:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .tc-link {
    display: inline-block; margin-top: 12px; font-size: 13.5px; font-weight: 700;
    opacity: .92; text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 1px;
  }
  .tc-link:hover { opacity: 1; }

  /* 今日改变（绿色系） */
  .tc-change .tc-head { background: var(--green-deep, var(--green)); color: #fff; }
  .tc-change .tc-head .dot { background: #fff; }
  .tc-change .tc-body { background: linear-gradient(160deg, var(--green-50), var(--green-soft)); }
  .tc-change .tc-eyebrow, .tc-change .tc-stats { color: var(--green); }
  .tc-change .tc-title { color: var(--green-deep, var(--green)); }
  .tc-change .tc-desc { color: var(--ink-2); }
  .tc-change .tc-cta { background: var(--green-3); color: #fff; box-shadow: 0 8px 22px rgba(29,158,117,.28); }
  .tc-change .tc-link { color: var(--green); }

  /* 今日洞察（紫色系） */
  .tc-think .tc-head { background: var(--violet); color: #fff; }
  .tc-think .tc-head .dot { background: #fff; }
  .tc-think .tc-body { background: linear-gradient(160deg, var(--violet-soft), #FBF9FF); }
  .tc-think .tc-eyebrow { color: var(--violet); }
  .tc-think .tc-title { color: #26215C; }
  .tc-think .tc-desc { color: var(--ink-2); }
  .tc-think .tc-cta { background: var(--violet); color: #fff; box-shadow: 0 8px 22px rgba(91,74,168,.3); }
  .tc-think .tc-link { color: var(--violet); }

  /* 今日完成（绿色浅） */
  .tc-done .tc-head { background: var(--green-2); color: #fff; }
  .tc-done .tc-head .dot { background: #fff; }
  .tc-done .tc-body { background: linear-gradient(160deg, var(--green-soft), var(--green-50)); text-align: center; }
  .tc-done .tc-crown { font-size: 34px; line-height: 1; margin-bottom: 6px; }
  .tc-done .tc-title { color: var(--green-deep, var(--green)); }
  .tc-done .tc-stats { justify-content: center; color: var(--green); }
  .tc-done .tc-cta { background: #fff; color: var(--green); border: 1.5px solid var(--green-light); }
  .tc-done .tc-cta:hover { border-color: var(--green); background: var(--green-50); }

  /* ===== 次级快捷 ===== */
  .quick-row { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 16px; }
  .quick-link {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700;
    color: var(--ink-2); text-decoration: none; transition: color .2s;
  }
  .quick-link:hover { color: var(--violet); }

  /* ===== 深度入口区 ===== */
  .deep-sec { padding-top: 16px; border-top: 1px dashed var(--line-2); }
  .deep-label {
    font-size: 11.5px; font-weight: 800; letter-spacing: 1.5px; color: var(--ink-3);
    text-transform: uppercase; margin-bottom: 12px;
  }
  .deep-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .deep-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 16px 16px 14px; text-decoration: none; display: block;
    transition: all .2s var(--ease); position: relative;
  }
  .deep-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); border-color: var(--line-2); }
  .deep-card .dc-icon {
    width: 38px; height: 38px; border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center; margin-bottom: 10px;
  }
  .deep-card h3 { font-size: 15px; font-weight: 800; color: var(--ink); margin-bottom: 3px; }
  .deep-card p { font-size: 12px; color: var(--ink-3); line-height: 1.6; }
  .deep-card .dc-badge {
    position: absolute; top: 14px; right: 14px; font-size: 10.5px; font-weight: 800;
    padding: 3px 9px; border-radius: 999px;
  }
  .dc-insight { background: var(--violet-soft); }
  .dc-insight .dc-icon { background: var(--violet-soft); color: var(--violet); }
  .dc-insight .dc-badge { background: var(--violet-soft); color: var(--violet); }
  .dc-change { background: var(--amber-soft); }
  .dc-change .dc-icon { background: var(--amber-soft); color: var(--amber); }
  .dc-change .dc-badge { background: var(--amber-soft); color: var(--amber); }

  /* 成长资产 fab */
  .fab-archive {
    position: fixed; right: 20px; bottom: 20px; z-index: 40;
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--green); color: #fff;
    padding: 13px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 700; text-decoration: none;
    box-shadow: 0 10px 28px rgba(14,107,80,.36); transition: all .25s var(--ease); font-family: inherit;
  }
  .fab-archive:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(14,107,80,.46); background: var(--green-2); }

  @media (max-width: 480px) {
    .wrap { padding: 0 14px 100px; }
    .motto h1 { font-size: 23px; }
    .deep-grid { grid-template-columns: 1fr; }
    .tc-title { font-size: 21px; }
  }
</style>
<script>
  (function(){
    try { if (localStorage.getItem('trf_theme') === 'dark') document.documentElement.setAttribute('data-theme','dark'); }
    catch(e){}
  })();
</script>
</head>
<body>
<div class="bg-atmo" aria-hidden="true">
  <div class="atmo-blob a"></div>
  <div class="atmo-blob b"></div>
</div>

<div class="wrap">
  <!-- 顶部导航 -->
  <div class="topbar">
    <a class="brand" href="index.html">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-5-5m5 5l5-5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="19.5" r="1.6" fill="#fff"/></svg>
      </div>
      <div>
        <div class="brand-name">Transform</div>
        <div class="brand-slogan">想清楚，做得到</div>
      </div>
    </a>
    <div class="spacer"></div>
    <button onclick="toggleTheme()" aria-label="切换深色模式">☾</button>
  </div>

  <!-- 品牌 motto -->
  <div class="motto">
    <h1>今天，<em>进步</em>一点点</h1>
    <p>一个困惑想理清楚，或一件小事今天做到。知行为你出题、陪你做完，把想法沉淀成成长。</p>
  </div>

  <!-- 今日卡片（动态主区） -->
  <div id="todayArea"></div>

  <!-- 次级快捷：每日洞察 -->
  <div class="quick-row">
    <a class="quick-link" href="think.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-5-5m5 5l5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      随时想清楚一件事 → 每日洞察
    </a>
  </div>

  <!-- 深度入口 -->
  <div class="deep-sec">
    <div class="deep-label">需要认真对待的大事？</div>
    <div class="deep-grid">
      <a class="deep-card dc-insight" href="app.html">
        <div class="dc-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2"/><path d="M12 8v4l2.6 2.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <span class="dc-badge">完整仪式</span>
        <h3>伴我洞察</h3>
        <p>职业转型、人生决策这类大事，归类 → 洞察 → 应用，一次想透。</p>
      </a>
      <a class="deep-card dc-change" href="act.html">
        <div class="dc-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </div>
        <span class="dc-badge">N 天实验</span>
        <h3>伴我改变</h3>
        <p>想要真正养成习惯或推动改变，设计一个 N 天行为实验，一天天做。</p>
      </a>
    </div>
  </div>
</div>

<a class="fab-archive" href="growth.html" title="随时查看我的成长资产">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 10h16M9 5v4M15 5v4" stroke="currentColor" stroke-width="1.8"/></svg>
  成长资产
</a>

<script>
/* ===================== 今日导向单屏（v2） ===================== */
function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('trf_theme', next); } catch(e){}
}

function loadData(){
  let actions = [], archive = [];
  try { actions = JSON.parse(localStorage.getItem('trf_actions') || '[]'); } catch(e){}
  try { archive = JSON.parse(localStorage.getItem('trf_archive') || '[]'); } catch(e){}
  return { actions, archive };
}

function isTodayDone(action){
  const today = new Date(); today.setHours(0,0,0,0);
  return (action.logs || []).some(l => {
    if (!l.done) return false;
    const ld = new Date(l.date); ld.setHours(0,0,0,0);
    return ld.getTime() === today.getTime();
  });
}

function renderToday(){
  const { actions } = loadData();
  const active = actions.find(a => a && a.status === 'active');
  const area = $('todayArea');
  if (active){
    if (isTodayDone(active)) renderDone(active);
    else renderChange(active);
  } else {
    renderThink();
  }
}

/* 状态 1：今日改变（有 active 实验，今天还没做） */
function renderChange(a){
  const today = (a.plan || []).find(p => p.day === a.currentDay);
  const micro = (today && today.micro) || a.input;
  $('todayArea').innerHTML = `
    <div class="today-card tc-change">
      <div class="tc-head"><span class="dot"></span>今日改变 · 第 ${a.currentDay} / ${a.targetDays} 天</div>
      <div class="tc-body">
        <div class="tc-eyebrow">今天的最小一步</div>
        <div class="tc-title">${escapeHtml(micro)}</div>
        <div class="tc-desc">${a.anchor && a.anchor.after ? ('在我 <b>' + escapeHtml(a.anchor.after) + '</b> 之后，就做这一步。') : '到了锚点时刻，就做这一步。'}</div>
        <div class="tc-stats">
          <span>连续 <b>${a.streak || 0}</b> 天</span>
          <span>累计 <b>${a.totalDone || 0}</b> 天</span>
          <span>目标 <b>${a.identity ? escapeHtml(a.identity) : '新的自己'}</b></span>
        </div>
        <a class="tc-cta" href="punch.html" style="text-decoration:none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          做完了 →
        </a>
        <div style="text-align:center;"><a class="tc-link" href="growth.html#experiments">查看行为档案</a></div>
      </div>
    </div>`;
}

/* 状态 2：今日已完成 */
function renderDone(a){
  $('todayArea').innerHTML = `
    <div class="today-card tc-done">
      <div class="tc-head"><span class="dot"></span>今日 · 已完成</div>
      <div class="tc-body">
        <div class="tc-crown">🎉</div>
        <div class="tc-title">今天做到了！</div>
        <div class="tc-desc">「${escapeHtml(a.input)}」又前进了一天，连续 ${a.streak || 0} 天。</div>
        <div class="tc-stats">
          <span>连续 <b>${a.streak || 0}</b> 天</span>
          <span>累计 <b>${a.totalDone || 0}</b> 天</span>
        </div>
        <a class="tc-cta" href="growth.html#experiments" style="text-decoration:none;">看行为档案 →</a>
      </div>
    </div>`;
}

/* 状态 3：今日洞察（无 active 实验时） */
function renderThink(){
  $('todayArea').innerHTML = `
    <div class="today-card tc-think">
      <div class="tc-head"><span class="dot"></span>今日洞察 · 30 秒开始</div>
      <div class="tc-body">
        <div class="tc-eyebrow">有一个困惑卡住了你</div>
        <div class="tc-title">写下来，知行帮你想清楚</div>
        <div class="tc-desc">知行基于它出 1 题，你回答、被理清、被质疑，最后整合成一条属于你的洞察。</div>
        <input class="tc-input" id="thinkTopic" placeholder="例如：我到底要不要跳槽去创业？" maxlength="60">
        <button class="tc-cta" id="thinkBtn" onclick="startThink()" disabled>开始想清楚 →</button>
        <div style="text-align:center;"><a class="tc-link" href="think.html">直接进入每日洞察</a></div>
      </div>
    </div>`;
  const input = $('thinkTopic');
  input.addEventListener('input', e => {
    $('thinkBtn').disabled = e.target.value.trim().length < 4;
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') startThink(); });
  input.focus();
}

function startThink(){
  const topic = ($('thinkTopic').value || '').trim();
  if (topic.length < 4) return;
  location.href = 'think.html?topic=' + encodeURIComponent(topic);
}

/* ===================== 初始化 ===================== */
(function init(){
  // 归档计数
  try {
    const { archive, actions } = loadData();
    const insightEl = document.getElementById('insightCount');
    const behaviorEl = document.getElementById('behaviorCount');
    if (insightEl) insightEl.textContent = archive.length || 0;
    if (behaviorEl) behaviorEl.textContent = actions.filter(a => a && (a.status === 'graduated' || a.totalDone > 0)).length || 0;
  } catch(e){}
  renderToday();
})();
</script>
</body>
</html>
