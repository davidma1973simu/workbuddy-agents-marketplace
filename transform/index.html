<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transform · 想清楚，做得到</title>
<style>
  :root {
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #1E2A26;
    --ink-2: #5A6B64;
    --ink-3: #93A09A;
    --line: #E4E8E3;
    --green: #1D9E75;
    --green-deep: #0E6B50;
    --green-soft: #E3F3EC;
    --amber: #D97B29;
    --amber-soft: #FBF0E2;
    --radius-lg: 24px;
    --radius-md: 16px;
    --shadow: 0 2px 8px rgba(30,42,38,.05), 0 12px 32px rgba(30,42,38,.07);
    --shadow-hover: 0 4px 12px rgba(30,42,38,.08), 0 20px 48px rgba(30,42,38,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 520px; margin: 0 auto; padding: 40px 24px 60px; }

  /* 品牌 */
  .brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--green), var(--green-deep));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(29,158,117,.35);
  }
  .brand-name { font-size: 26px; font-weight: 700; letter-spacing: .5px; }

  .hero { text-align: center; margin: 36px 0 40px; }
  .hero h1 { font-size: 34px; font-weight: 700; letter-spacing: -.5px; line-height: 1.25; }
  .hero h1 .grad {
    background: linear-gradient(120deg, var(--green-deep), var(--green));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { margin-top: 14px; font-size: 16px; color: var(--ink-2); max-width: 400px; margin-left: auto; margin-right: auto; }

  /* 入口卡片 */
  .entrance { display: grid; gap: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 28px 26px; display: block; text-decoration: none; color: inherit;
    transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, border-color .25s;
    position: relative; overflow: hidden;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .card:active { transform: translateY(0) scale(.99); }
  .card-a { border-top: 4px solid var(--green); }
  .card-b { border-top: 4px solid var(--amber); opacity: .78; }
  .card-b:hover { opacity: 1; }

  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-icon {
    width: 46px; height: 46px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .card-a .card-icon { background: var(--green-soft); }
  .card-b .card-icon { background: var(--amber-soft); }
  .card h2 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  .card .desc { font-size: 14.5px; color: var(--ink-2); margin-top: 2px; }
  .card .meta { display: flex; gap: 18px; margin-top: 18px; }
  .meta-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-3); }
  .meta-item svg { flex-shrink: 0; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
  }
  .badge-live { background: var(--green-soft); color: var(--green-deep); }
  .badge-soon { background: var(--amber-soft); color: var(--amber); }
  .card-arrow {
    position: absolute; right: 22px; bottom: 22px; width: 34px; height: 34px;
    border-radius: 50%; background: var(--bg); display: flex; align-items: center; justify-content: center;
    transition: transform .25s;
  }
  .card:hover .card-arrow { transform: translateX(3px); }

  /* 底部 */
  .foot { margin-top: 44px; display: flex; justify-content: center; gap: 8px; }
  .foot a {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--ink-2); text-decoration: none;
    padding: 10px 18px; border-radius: 999px; background: var(--surface);
    border: 1px solid var(--line); transition: all .2s;
  }
  .foot a:hover { color: var(--green-deep); border-color: var(--green); background: var(--green-soft); }

  @media (max-width: 480px) {
    .wrap { padding: 28px 16px 48px; }
    .hero h1 { font-size: 29px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M12 3v12m0 0l-5-5m5 5l5-5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="19.5" r="1.8" fill="#fff"/>
      </svg>
    </div>
    <span class="brand-name">Transform</span>
  </div>

  <div class="hero">
    <h1>想清楚，<br><span class="grad">做得到</span></h1>
    <p>AI 时代，把一件事想通，再做出来，并验证改变真的发生。</p>
  </div>

  <div class="entrance">
    <a class="card card-a" href="app.html">
      <div class="card-top">
        <div class="card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="8.5" stroke="#1D9E75" stroke-width="2"/>
            <path d="M12 8v4l2.6 2.6" stroke="#1D9E75" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="badge badge-live">现在就可用</span>
      </div>
      <h2>帮我清楚</h2>
      <p class="desc">花 5 分钟，把一件事想通。归类、洞察、应用，产出属于你的洞察，并在真实场景里验证它。</p>
      <div class="meta">
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#93A09A" stroke-width="2"/><path d="M12 7v5l3 3" stroke="#93A09A" stroke-width="2" stroke-linecap="round"/></svg>
          5 分钟
        </span>
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M8.5 14.5a5 5 0 117 0c-1.5 1.2-2 2.4-2 3.5h-3c0-1.1-.5-2.3-2-3.5z" stroke="#93A09A" stroke-width="1.8" stroke-linejoin="round"/></svg>
          1 个洞察
        </span>
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#93A09A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          应用验证
        </span>
      </div>
      <span class="card-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6l6 6-6 6" stroke="#5A6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>

    <a class="card card-b" href="#" onclick="alert('入口 B 即将上线：花 30 秒，做成一件事。'); return false;">
      <div class="card-top">
        <div class="card-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12L13 2z" stroke="#D97B29" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="badge badge-soon">即将上线</span>
      </div>
      <h2>帮我改变</h2>
      <p class="desc">花 30 秒，做成一件事。目标拆成不可能失败的小行动，绑定习惯，做，然后被肯定。</p>
      <div class="meta">
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#93A09A" stroke-width="2"/><path d="M12 7v5l3 3" stroke="#93A09A" stroke-width="2" stroke-linecap="round"/></svg>
          30 秒
        </span>
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-5-5m5 5l5-5" stroke="#93A09A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          微行动
        </span>
        <span class="meta-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.4-6.3-4.6-6.3 4.6L8 13.6 2 9.2h7.6L12 2z" stroke="#93A09A" stroke-width="1.8" stroke-linejoin="round"/></svg>
          即时反馈
        </span>
      </div>
      <span class="card-arrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6l6 6-6 6" stroke="#5A6B64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </a>
  </div>

  <div class="foot">
    <a href="archive.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 10h16M9 5v4M15 5v4" stroke="currentColor" stroke-width="1.8"/></svg>
      我的认知档案
    </a>
    <a href="app.html?settings=1">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      设置
    </a>
  </div>
</div>
</body>
</html>
