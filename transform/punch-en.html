<script>

const LS_ACTIONS = 'trf_actions';
const LS_PROFILE = 'trf_profile';
const LS_AI = 'trf_ai_config_v1';
const BRAND_PROFILES = {
  'DeepSeek': { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
  'OpenAI':   { baseUrl: 'https://api.openai.com/v1',  model: 'gpt-4o-mini' },
  'Gemini':   { baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai/', model: 'gemini-2.0-flash' }
};

let current = null;

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('trf_theme', next); } catch(e){}
}
function getAI(){
  let cfg; try { cfg = JSON.parse(localStorage.getItem(LS_AI)) || {}; } catch(e){ cfg = {}; }
  const brand = cfg.brand || 'DeepSeek';
  const profile = BRAND_PROFILES[brand] || BRAND_PROFILES['DeepSeek'];
  return { brand, apiKey: cfg.apiKey || '', baseUrl: cfg.baseUrl || profile.baseUrl, model: cfg.model || profile.model };
}
function loadActions(){ try { return JSON.parse(localStorage.getItem(LS_ACTIONS)) || []; } catch(e){ return []; } }
function saveActions(list){ localStorage.setItem(LS_ACTIONS, JSON.stringify(list)); }
function loadProfile(){ try { return JSON.parse(localStorage.getItem(LS_PROFILE)) || { identityStatements: [] }; } catch(e){ return { identityStatements: [] }; } }
function saveProfile(p){ localStorage.setItem(LS_PROFILE, JSON.stringify(p)); }
function persistAction(){ const list = loadActions(); const i = list.findIndex(a => a.id === current.id); if (i >= 0) list[i] = current; else list.push(current); saveActions(list); }

async function aiCall(prompt, attempt = 1){
  const cfg = getAI();
  if (!cfg.apiKey) return null;
  const url = cfg.baseUrl.replace(/\/$/, '') + '/chat/completions';
  const maxAttempts = 4;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: cfg.model, messages: [{ role:'user', content: prompt }], temperature: 0.6, max_tokens: 400 })
    });
    if (!res.ok){
      if (attempt < maxAttempts && [503,502,500,429].includes(res.status)){
        await new Promise(r => setTimeout(r, 250 * Math.pow(2, attempt)));
        return aiCall(prompt, attempt + 1);
      }
      return null;
    }
    return (await res.json()).choices[0].message.content;
  } catch(e){ return null; }
}
function parseJSON(text){
  if (!text) return null;
  try { const m = text.match(/\{[\s\S]*\}/); if (!m) return null; return JSON.parse(m[0]); } catch(e){ return null; }
}


function logCompletion(done, day, difficulty, note){
  const today = new Date(); today.setHours(0,0,0,0);
  const lastDone = (current.logs || []).filter(l => l.done).slice(-1)[0];
  if (done){
    current.logs.push({ day, date: new Date().toISOString(), done: true, difficulty: difficulty||null, note: note||'' });
    current.totalDone = (current.totalDone || 0) + 1;
    if (lastDone){
      const ld = new Date(lastDone.date); ld.setHours(0,0,0,0);
      const diff = Math.round((today - ld) / 86400000);
      if (diff === 1) current.streak = (current.streak || 0) + 1;
      else if (diff > 1) current.streak = 1;
    } else {
      current.streak = 1;
    }
    current.bestStreak = Math.max(current.bestStreak || 0, current.streak);
    current.currentDay = day + 1;
    if (current.currentDay > current.targetDays){
      current.status = 'graduated'; current.graduatedAt = new Date().toISOString();
    } else current.status = 'active';
    if (current.identity){
      const profile = loadProfile();
      profile.identityStatements = profile.identityStatements || [];
      const ex = profile.identityStatements.find(s => s.text === current.identity);
      if (ex){ ex.votes = (ex.votes||0) + 1; ex.date = new Date().toISOString(); ex.source = 'action'; }
      else profile.identityStatements.push({ text: current.identity, votes: 1, date: new Date().toISOString(), source: 'action' });
      saveProfile(profile);
    }
  } else {
    current.logs.push({ day, date: new Date().toISOString(), done: false, difficulty: difficulty||null, note: note||'' });
    current.streak = 0;
  }
  persistAction();
}


function renderPunch(){
  const area = $('punchArea');
  if (!current){
    area.innerHTML = `<div class="create-hero">
      <div class="ch-eyebrow">Guided Change</div>
      <h1>No change started yet</h1>
      <p>Pick something you want to change. Transform will break it into one small step you can do today.</p>
      <a class="cta-start" href="act-en.html" style="text-decoration:none;">Create a full experiment →</a>
    </div>`;
    return;
  }

  const isGrad = current.status === 'graduated';
  const today = (current.plan || []).find(p => p.day === current.currentDay) || (current.plan || [])[0];
  const micro = today ? (today.micro || current.input) : current.input;
  const anchor = current.anchor && current.anchor.after;
  const phase = isGrad ? 'All ' + (current.targetDays||0) + ' days completed' : 'Day ' + current.currentDay + ' of ' + (current.targetDays||0);
  const votes = countVotes();

  let html = '';


  if (isGrad){
    html += `<div class="create-hero" style="background:linear-gradient(135deg, var(--amber-soft), var(--green-soft));color:var(--ink);">
      <div class="ch-eyebrow" style="color:var(--amber);">Experiment complete</div>
      <h1 style="color:var(--ink);">In ${current.targetDays} days, you turned \u201c${escapeHtml(current.input)}\u201d into a real track record</h1>
      <p style="color:var(--ink-2);">${current.identity ? 'You have become a \u201c' + escapeHtml(current.identity) + '\u201d person' : 'New habits and identity have taken root'}</p>
      <a class="cta-start" href="act-en.html?id=${current.id}" style="text-decoration:none;color:var(--green-deep);">Review & refine →</a>
    </div>`;
    area.innerHTML = html;
    return;
  }


  html += `<div class="create-hero">
    <div class="ch-eyebrow">${escapeHtml(phase)}</div>
    <h1>${escapeHtml(micro)}</h1>
    <p>${anchor ? 'Right after <b>' + escapeHtml(anchor) + '</b>, I take this one small step.' : 'When that moment comes, take this one small step.'}</p>
    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;opacity:.92;">
      <span><b style="font-size:16px;">${current.streak || 0}</b>-day streak</span>
      <span><b style="font-size:16px;">${current.totalDone || 0}</b> days total</span>
      <span><b style="font-size:16px;">${votes}</b> identity votes</span>
    </div>
  </div>`;


  html += `<div class="tf-hint">Today's goal is <strong>${escapeHtml(micro)}</strong>.${today && today.seconds ? ' About '+today.seconds+' seconds.' : ' Small enough that it can\u2019t fail.'}</div>`;


  html += `<button class="cta-done" id="doneBtn" onclick="markDone()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Done
  </button>
  <button class="cta-miss" onclick="showBlock()">Missed today (forgot / too much hassle / no time)</button>

  <div class="block-box" id="blockBox">
    <h3>What happened? Pick the closest one</h3>
    <div class="reason-grid">
      <button class="reason" onclick="pickReason('forgot')"><b>Forgot</b>never crossed my mind</button>
      <button class="reason" onclick="pickReason('hassle')"><b>Too much hassle</b>too many steps</button>
      <button class="reason" onclick="pickReason('demotivated')"><b>Didn\u2019t feel like it</b>no motivation in the moment</button>
      <button class="reason" onclick="pickReason('time')"><b>No time</b>couldn\u2019t spare 30 seconds</button>
    </div>
    <div id="aiBlockResult"></div>
    <div class="btn" style="margin-top:12px;width:100%;" onclick="hideBlock()">← Back</div>
  </div>

  <!-- Feedback card (hidden by default, shown after completion) -->
  <div class="today-feedback hidden" id="todayFeedbackWrap">
    <div class="tf-card">
      <div class="tf-crown" id="tfCrown">🎉</div>
      <div class="tf-title" id="tfTitle">Day X done!</div>
      <div class="tf-body" id="tfBody"></div>
      <div class="tf-stats">
        <div class="tf-stat"><span>Streak</span><b id="tfStreak">0</b><em>days</em></div>
        <div class="tf-stat"><span>Total</span><b id="tfTotal">0</b><em>days</em></div>
        <div class="tf-stat"><span>Votes</span><b id="tfVotes">+1</b><em>votes</em></div>
      </div>
      <div class="tf-sub" id="tfSub"></div>
      <div class="tf-actions">
        <button class="btn btn-primary" onclick="hideTodayFeedback()">Continue → tomorrow\u2019s step is ready</button>
        <a class="btn btn-ghost" href="growth-en.html#experiments">View Behavior Archive</a>
      </div>
    </div>
  </div>`;

  area.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function countVotes(){
  const profile = loadProfile();
  if (!current || !current.identity) return 0;
  const stmt = (profile.identityStatements || []).filter(s => s.source === 'action' && s.text === current.identity)[0];
  return stmt ? stmt.votes : 0;
}

function markDone(){
  const today = current.plan.find(p => p.day === current.currentDay);
  if (today && today.sub && today.sub.length && !today.subDone.every(Boolean)){ toast('Check off today\u2019s steps first'); return; }
  logCompletion(true, current.currentDay, null, '');
  if (current.status === 'graduated'){
    renderPunch();
    toast('All done! New habits and identity have taken root 🎓');
    return;
  }
  renderPunch();
  showTodayFeedback();
}

function hideTodayFeedback(){
  const w = $('todayFeedbackWrap'); if (w) w.classList.add('hidden');
}

async function showTodayFeedback(){
  if (!current) return;
  const w = $('todayFeedbackWrap'); if (!w) return;
  const day = current.currentDay - 1;
  const streak = current.streak || 0;
  const total = current.totalDone || 0;
  const todayPlan = current.plan[current.currentDay - 2] || current.plan[current.currentDay - 1];
  const micro = (todayPlan && todayPlan.micro) || current.input;
  const votes = countVotes();
  const isFirst = day <= 0;
  const LOCAL_MSGS = isFirst
    ? [
      'Today\u2019s behavior experiment has begun: \u201c' + micro + '\u201d.',
      'That\u2019s the first vote for \u201c' + (current.identity || 'your intended identity') + '\u201d.',
      'Your anchor is set. Start today\u2019s step within 30 seconds.',
      'Day 1 \u2014 finish \u201c' + micro + '\u201d first.'
    ]
    : [
      '\u201c' + micro + '\u201d has moved from \u201cwanting to do\u201d to \u201cdone\u201d.',
      streak + ' days in a row \u2014 your behavior is reminding you.',
      'Casting vote #' + (votes + 1) + ' for \u201c' + (current.identity || 'your intended identity') + '\u201d.',
      'Tomorrow\u2019s step will appear automatically. One more day closer to \u201c' + (current.identity || 'who you want to be') + '\u201d.'
    ];
  $('tfCrown').textContent = isFirst ? '🚀' : ((day > 0 && day % 7 === 0) ? '🏆' : '🎉');
  $('tfTitle').textContent = isFirst ? 'Today\u2019s behavior experiment begins' : ('Day ' + day + ' done!');
  $('tfBody').textContent = LOCAL_MSGS[Math.abs((day - 1)) % LOCAL_MSGS.length];
  $('tfStreak').textContent = streak;
  $('tfTotal').textContent = total;
  $('tfVotes').textContent = '+1';
  $('tfSub').textContent = isFirst ? 'Your goal for today is recorded. Finish it, then come back and tap Done.' : 'Today is recorded. Tomorrow\u2019s step is ready.';
  w.classList.remove('hidden');
  w.scrollIntoView({ behavior: 'smooth', block: 'center' });
  try {
    if (getAI().apiKey && micro && !isFirst) {
      const aiText = await aiCall(
        'A user just completed day ' + day + ' of a multi-day behavior experiment: ' + micro + '.\n' +
        'Current status: ' + streak + '-day streak, ' + total + ' days total, target identity: \u201c' + (current.identity || 'to be determined') + '\u201d.\n' +
        'Praise this completion in one sentence (max 30 words), emphasizing the concrete behavior, not \u201cpersistence\u201d. Avoid the word \u201cpersistence\u201d.'
      );
      if (aiText) $('tfBody').textContent = aiText.trim().slice(0, 120);
    }
  } catch(e){}
}

function showBlock(){ const b = $('blockBox'); if (b) b.style.display = 'block'; }
function hideBlock(){ const b = $('blockBox'); if (b) b.style.display = 'none'; }

async function pickReason(reason){
  const day = current.currentDay;
  logCompletion(false, day, reason, '');
  const block = $('blockBox'); if (block) block.style.display = 'none';
  renderPunch();
  const today = current.plan.find(p => p.day === day);
  const text = await aiCall('The user missed today\u2019s action \u201c' + ((today && today.micro) || current.input) + '\u201d because of: ' + reason + '.\nGive 1 adjustment that does not rely on willpower, making it easier next time. No \u201cyou can do it\u201d or \u201ckeep going\u201d. Max 2 sentences.');
  if (text){
    const box = $('aiBlockResult');
    if (box) box.innerHTML = `<div class="ai-result">${escapeHtml(text).replace(/\n/g,'<br>')}</div>`;
  }
  toast('It\u2019s okay \u2014 missing a day isn\u2019t failure. Adjust once, try again.');
}


let handoffInsight = '';
let handoffNature = '';
let handoffScenario = '';
let draft = { goal:'', micro:'', steps:[], seconds:30, anchor:'', identity:'' };

function renderCreate(){
  const area = $('punchArea');
  const showCtx = handoffNature || handoffInsight;
  // Show "Continue previous" link if there are any past experiments
  const past = loadActions();
  const pastActive = past.find(a => a.status === 'active');
  const pastRecent = past.filter(a => a.status === 'graduated').sort((a,b) => new Date(b.graduatedAt||0) - new Date(a.graduatedAt||0))[0];
  const resume = pastActive || pastRecent;
  const resumeLink = resume
    ? `<a class="resume-link" href="punch-en.html?id=${encodeURIComponent(resume.id)}">↻ Continue previous experiment →</a>`
    : '';
  area.innerHTML = `
    <div class="create-hero">
      <div class="ch-eyebrow">Daily Change · start a new step</div>
      <h1>Start a new behavior change</h1>
      <p>Pick one thing you want to change. Transform will break it into one small step you can do today.</p>
      ${resumeLink}
      ${showCtx ? `
        <div class="ctx-card">
          <div class="ctx-label">From today's insight · starting point</div>
          ${handoffNature ? `<div class="ctx-row"><b>Essence:</b> ${escapeHtml(handoffNature)}</div>` : ''}
          ${handoffInsight ? `<div class="ctx-row"><b>Insight:</b> ${escapeHtml(handoffInsight)}</div>` : ''}
        </div>` : ''}
      <input class="create-input" id="changeInput" placeholder="${handoffScenario ? escapeHtml('What do you want to change about \u201c' + handoffScenario + '\u201d?') : 'What do you want to change or practice? (e.g. drink a glass of water every morning)'}" maxlength="60">
      <button class="cta-start" id="startChangeBtn" onclick="startChange()">Start Changing →</button>
    </div>`;
  const input = $('changeInput');
  if (handoffScenario) input.value = handoffScenario;
  input.addEventListener('input', e => {
    $('startChangeBtn').disabled = e.target.value.trim().length < 4;
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') startChange(); });
  $('startChangeBtn').disabled = (input.value || '').trim().length < 4;
  input.focus();
}

async function startChange(){
  const goal = ($('changeInput').value || '').trim();
  if (goal.length < 4) { toast('Add a few more words'); return; }
  const cfg = getAI();
  if (!cfg.apiKey) { toast('Please set your API Key in Settings first'); return; }
  const btn = $('startChangeBtn');
  btn.disabled = true; btn.textContent = 'Transform is suggesting today\u2019s change\u2026';
  let sug = null;
  for (let attempt = 0; attempt < 3 && !sug; attempt++){
    const r = await aiCall(
      `User\u2019s change goal: \u201c${goal}\u201d\nStarting point: essence \u201c${handoffNature || 'not provided'}\u201d, insight \u201c${handoffInsight || 'not provided'}\u201d\n\nTask: Based on the above, suggest ONE minimal change that can be completed today \u2014 a micro-action.\nStrict requirements:\n1. The micro-action in one sentence (10-25 words), small enough that it cannot fail, doable within 30 seconds\n2. Break it into 2-3 even smaller steps (each max 10 words)\n3. Give 3 stable anchor moments (after ___)\n4. Output strict JSON:\n{"micro":"...","steps":["...","..."],"anchors":["after I pick up my phone in the morning","after lunch","before bed"]}`
    );
    const d = parseJSON(r);
    if (d && d.micro && d.micro.trim()){
      sug = {
        micro: d.micro.trim().slice(0, 60),
        steps: Array.isArray(d.steps) ? d.steps.map(s => String(s).trim().slice(0, 20)).filter(Boolean).slice(0, 3) : [],
        anchors: Array.isArray(d.anchors) ? d.anchors.map(s => String(s).trim().slice(0, 30)).filter(Boolean).slice(0, 3) : []
      };
    }
  }
  if (!sug){
    btn.disabled = false; btn.textContent = 'Start Changing →';
    toast('Transform could not suggest right now, please try again');
    return;
  }
  draft.goal = goal;
  draft.micro = sug.micro;
  draft.steps = sug.steps.length ? sug.steps : ['Complete this small step'];
  draft.seconds = 30;
  renderSuggest(sug.anchors.length ? sug.anchors : ['after I pick up my phone in the morning', 'after lunch', 'before bed']);
}

function renderSuggest(anchors){
  const area = $('punchArea');
  area.innerHTML = `
    <div class="suggest-card">
      <div class="sc-tag">Transform suggests \u00b7 today\u2019s change</div>
      <div class="sc-title" id="sugTitle">${escapeHtml(draft.micro)}</div>
      <div class="sc-desc">Small enough that it can\u2019t fail, done in 30 seconds. First break it into smaller steps:</div>
      <div class="sc-field">Micro-steps</div>
      <div class="sc-chips" id="stepChips">
        ${draft.steps.map((s, i) => `<span class="sc-chip" style="cursor:default;">${i+1}. ${escapeHtml(s)}</span>`).join('')}
      </div>
      <div class="sc-field">When? Pick an anchor moment (tap to choose)</div>
      <div class="sc-chips" id="anchorChips">
        ${anchors.map((a, i) => `<button class="sc-chip ${i === 0 ? 'sel' : ''}" onclick="pickAnchorChip(${i})" data-a="${escapeHtml(a)}">${escapeHtml(a)} → do it</button>`).join('')}
      </div>
      <div class="sc-field">Who do you want to become? (identity votes go here)</div>
      <input class="sc-input" id="identityInput" placeholder="e.g. a person who takes care of their body" maxlength="30">
      <button class="cta-confirm" id="confirmBtn" onclick="confirmChange()">Confirm \u00b7 start today \u2192</button>
      <div class="ai-out-box" id="aiOut"></div>
    </div>`;
  draft.anchor = anchors[0] || '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function pickAnchorChip(i){
  const chips = document.querySelectorAll('#anchorChips .sc-chip');
  chips.forEach((c, j) => c.classList.toggle('sel', j === i));
  const sel = chips[i];
  if (sel) draft.anchor = (sel.getAttribute('data-a') || '');
}

async function confirmChange(){
  const identity = ($('identityInput').value || '').trim();
  if (!draft.micro) { toast('Let Transform suggest today\u2019s change first'); return; }
  if (!draft.anchor) { toast('Pick an anchor moment'); return; }
  if (!identity) { toast('Write who you want to become (identity votes go here)'); return; }
  const btn = $('confirmBtn');
  btn.classList.add('loading'); btn.disabled = true;

  let plan = null;
  for (let attempt = 0; attempt < 2 && !plan; attempt++){
    const r = await aiCall(
      `User\u2019s change goal: \u201c${draft.goal || 'behavior change'}\u201d. Today\u2019s micro-action: \u201c${draft.micro}\u201d\n\nTask: Generate the micro-action for each of the next 7 days (one sentence per day, max 20 words, small enough to never fail; Day 1 is \u201c${draft.micro}\u201d).\nStrict JSON:\n{"days":[{"day":1,"micro":"${draft.micro}"},{"day":2,"micro":"..."},...,{"day":7,"micro":"..."}]}`
    );
    const d = parseJSON(r);
    if (d && Array.isArray(d.days) && d.days.length >= 3){
      plan = d.days.slice(0, 7).map(x => ({
        day: parseInt(x.day) || 0,
        micro: String(x.micro || '').trim().slice(0, 30),
        sub: [], subDone: []
      })).filter(x => x.day > 0 && x.micro);
    }
  }
  if (!plan){
    plan = [{day:1, micro:draft.micro, sub:[], subDone:[]}];
    for (let d = 2; d <= 7; d++){
      plan.push({ day:d, micro: ('Keep going with \u201c' + draft.micro + '\u201d'), sub:[], subDone:[] });
    }
  }

  const goal = draft.goal || handoffScenario || 'behavior change';
  current = {
    id: 'a_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    input: (goal || '').trim() || draft.micro,
    createdAt: new Date().toISOString(),
    targetDays: 7,
    currentDay: 1,
    plan,
    logs: [],
    status: 'active',
    streak: 0, totalDone: 0, bestStreak: 0,
    anchor: { after: draft.anchor },
    reminder: '',
    identity: identity,
    celebration: '',
    support: { people:[], tools:[], info:[] },
    source: 'punch',
    insight: handoffInsight || '',
    scenario: handoffScenario || ''
  };
  persistAction();
  draft = { goal:'', micro:'', steps:[], seconds:30, anchor:'', identity:'' };
  renderPunch();

  showTodayFeedback();
}


(function init(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  // From think-en.html: carries the insight
  handoffInsight = (params.get('insight') || '').trim();
  handoffNature = (params.get('nature') || '').trim();
  handoffScenario = (params.get('scenario') || '').trim();
  // 1. URL ?insight= → render create state with handoff (from think)
  // 2. URL ?id=xxx → load that specific experiment
  // 3. Default → render create state (start a NEW experiment)
  //    Recent experiments are listed below the hero as links (do NOT auto-load)
  if (handoffInsight){
    renderCreate();
    return;
  }
  if (id){
    current = loadActions().find(a => a.id === id) || null;
    if (current && current.status === 'active'){ renderPunch(); return; }
    renderCreate();
    return;
  }
  // Default: create state (do not auto-load old action)
  renderCreate();
})();
</script>
</body>
</html>
