<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>我的认知档案 · Transform</title>
<style>
  :root {
    /* ===== 设计令牌 Design Tokens · Transform（与 app.html 统一同一套值） ===== */
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #1E2A26;
    --ink-2: #5A6B64;
    --ink-3: #93A09A;
    --line: #E4E8E3;

    --green: #1D9E75;
    --green-deep: #0E6B50;
    --green-soft: #E3F3EC;
    --green-50: #ECF8F3;
    --green-light: #BFE9D8;

    --amber: #D97B29;
    --amber-soft: #FBF0E2;
    --coral: #C05B3C;
    --coral-soft: #F9EBE5;
    --blue: #3B6FA0;
    --blue-soft: #E8F0F8;
    --purple: #6B4FA0;
    --purple-soft: #EFEAF8;

    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;

    --shadow: 0 2px 8px rgba(30,42,38,.05), 0 12px 32px rgba(30,42,38,.07);
    --shadow-hover: 0 6px 16px rgba(30,42,38,.09), 0 26px 60px rgba(30,42,38,.14);

    --fs-xs: 12px;
    --fs-sm: 13px;
    --fs-base: 14px;
    --fs-md: 15px;
    --fs-lg: 17px;
    --fs-xl: 22px;
    --fs-2xl: 27px;

    --ease: cubic-bezier(.16,1,.3,1);
    --dur-fast: .2s;
    --dur: .3s;

    --touch: 44px;
  }

  /* ===== 深色模式（纯增量：默认不激活，仅用户点开关或 data-theme="dark" 时生效） ===== */
  [data-theme="dark"] {
    --bg: #13171A;
    --surface: #1E2422;
    --ink: #E8EFEB;
    --ink-2: #A9B8B2;
    --ink-3: #6E7E78;
    --line: #2C3633;
    --green: #2BBB8A;
    --green-deep: #34D29E;
    --green-soft: #16302A;
    --green-50: #10221D;
    --green-light: #1E4A3E;
    --amber: #E8943F;
    --amber-soft: #2E2417;
    --coral: #D9714F;
    --coral-soft: #2E1E18;
    --blue: #5B92C9;
    --blue-soft: #16242F;
    --purple: #9B7FD0;
    --purple-soft: #211A30;
    --shadow: 0 2px 8px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.55);
    --shadow-hover: 0 6px 16px rgba(0,0,0,.4), 0 26px 60px rgba(0,0,0,.6);
  }
  /* 档案页硬编码浅色渐变在深色下修正 */
  [data-theme="dark"] .session .insight,
  [data-theme="dark"] .d-insight { background: linear-gradient(180deg, var(--green-soft), #0F2620); }
  [data-theme="dark"] .review-card { background: linear-gradient(180deg, #2E2417, #241C12); border-color: #4A3A22; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background:
      radial-gradient(900px 420px at 100% -8%, rgba(29,158,117,.10), transparent 60%),
      radial-gradient(720px 380px at -10% 4%, rgba(217,123,41,.08), transparent 55%),
      var(--bg);
    color: var(--ink); line-height: 1.62; min-height: 100vh;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 22px 20px 110px; }

  /* 顶栏 */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .nav-link {
    display: inline-flex; align-items: center; gap: 6px;
    text-decoration: none; color: var(--ink-2); font-size: 14px;
    padding: 9px 15px; border-radius: 999px; background: var(--surface);
    border: 1px solid var(--line); transition: all .2s;
  }
  .nav-link:hover { color: var(--green-deep); border-color: var(--green); }

  /* 主题切换 */
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); font-family: inherit;
    transition: all var(--dur-fast); margin-left: auto;
  }
  .theme-toggle:hover { color: var(--green-deep); border-color: var(--green); }
  .theme-toggle .t-dark { display: none; }
  [data-theme="dark"] .theme-toggle .t-light { display: none; }
  [data-theme="dark"] .theme-toggle .t-dark { display: inline; }
  .nav-link.primary { color: var(--green-deep); border-color: var(--green); background: var(--green-soft); }

  .page-head { margin: 14px 0 18px; }
  h1 { font-size: 27px; font-weight: 800; letter-spacing: -.5px; }
  .page-sub { font-size: 14px; color: var(--ink-2); margin-top: 6px; }

  /* 工具条 */
  .toolbar { display: flex; gap: 10px; margin: 16px 0 22px; flex-wrap: wrap; }
  .search {
    flex: 1 1 180px; min-width: 160px; display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px;
  }
  .search input { border: none; outline: none; font-size: 14px; background: transparent; color: var(--ink); width: 100%; font-family: inherit; }
  .toolbar .act {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600;
    padding: 10px 16px; border-radius: 999px; cursor: pointer; transition: all .2s; font-family: inherit;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  }
  .toolbar .act:hover { color: var(--green-deep); border-color: var(--green); background: var(--green-soft); }
  .toolbar .act.solid { background: var(--green-deep); color: #fff; border-color: var(--green-deep); }
  .toolbar .act.solid:hover { background: var(--green); }

  /* 身份英雄卡 */
  .identity-card {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #0E6B50 0%, #1D9E75 55%, #2BBB8A 100%);
    border-radius: var(--radius-lg); padding: 26px 24px; color: #fff;
    box-shadow: 0 12px 34px rgba(14,107,80,.32); margin-bottom: 12px;
    animation: rise .5s cubic-bezier(.16,1,.3,1);
  }
  .identity-card::after {
    content:""; position:absolute; right:-50px; top:-50px; width:180px; height:180px; border-radius:50%;
    background: rgba(255,255,255,.10);
  }
  .identity-card .k { font-size: 12px; opacity: .8; font-weight: 700; letter-spacing: 1.2px; }
  .identity-card .v { font-size: 19px; font-weight: 800; margin-top: 8px; line-height: 1.5; position: relative; }
  .identity-card .v em { font-style: normal; border-bottom: 2px solid rgba(255,255,255,.55); padding-bottom: 2px; }
  .identity-card .count {
    font-size: 12px; opacity: .85; margin-top: 14px; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.14); padding: 6px 12px; border-radius: 999px;
  }
  .identity-empty {
    background: var(--green-soft); color: var(--green-deep); padding: 22px 24px;
    border-radius: var(--radius-md); font-size: 14.5px; margin-bottom: 14px;
    display: flex; gap: 14px; align-items: flex-start; line-height: 1.7; border: 1px solid #CFE9DC;
  }
  .identity-empty svg { flex-shrink: 0; margin-top: 3px; }

  /* 角色标签过滤栏 */
  .role-filter { margin: 18px 0 10px; }
  .role-filter .rf-title { font-size: 12.5px; font-weight: 700; color: var(--ink-3); letter-spacing: .6px; margin-bottom: 10px; }
  .role-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .role-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 999px; cursor: pointer; transition: all .2s;
    background: var(--surface); border: 1.5px solid var(--line); color: var(--ink-2); font-size: 13.5px;
  }
  .role-chip:hover { border-color: var(--green); color: var(--green-deep); }
  .role-chip.sel { background: var(--green-deep); border-color: var(--green-deep); color: #fff; }
  .role-chip .rf-count { font-size: 11px; background: rgba(0,0,0,.08); padding: 2px 7px; border-radius: 999px; }
  .role-chip.sel .rf-count { background: rgba(255,255,255,.22); }
  .role-chip .rf-tags {
    display: inline-flex; gap: 4px; font-size: 10.5px; opacity: .75;
  }
  .role-chip .rf-tags span { background: rgba(29,158,117,.12); color: var(--green-deep); padding: 1px 6px; border-radius: 999px; }
  .role-chip.sel .rf-tags span { background: rgba(255,255,255,.2); color: #fff; }

  /* 统计条 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px 0 6px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 14px; text-align: center; box-shadow: var(--shadow); }
  .stat .num { font-size: 24px; font-weight: 800; color: var(--green-deep); letter-spacing: -.5px; }
  .stat .lbl { font-size: 12px; color: var(--ink-3); margin-top: 4px; }

  /* 回顾卡 */
  .review-card {
    background: linear-gradient(180deg, #FBF0E2, #FCEBD8); border: 1px solid #F0D9B8; border-radius: var(--radius-lg);
    padding: 22px 24px; margin: 22px 0; display: none; animation: rise .5s cubic-bezier(.16,1,.3,1);
  }
  .review-card .k { font-size: 12.5px; color: #9A6216; font-weight: 800; letter-spacing: .5px; display: flex; align-items: center; gap: 7px; }
  .review-card .q { font-size: 14.5px; color: #6B4510; margin-top: 10px; line-height: 1.7; }
  .review-card .actions { margin-top: 16px; display: flex; gap: 10px; }
  .review-card button { padding: 10px 20px; border: none; border-radius: var(--radius-sm); font-size: 14px; cursor: pointer; transition: all .2s; font-family: inherit; font-weight: 700; }
  .btn-yes { background: var(--amber); color: #fff; }
  .btn-yes:hover { background: #B8691E; }
  .btn-no { background: #fff; color: #9A6216; border: 1.5px solid #E5C99E; }
  .btn-no:hover { border-color: var(--amber); }
  .review-card .done-tip { font-size: 13.5px; color: #9A6216; margin-top: 12px; display: none; font-weight: 700; }

  /* 会话卡 */
  .section-title { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 800; margin: 28px 0 14px; }
  .section-title svg { color: var(--green); }
  .session {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 22px 22px 16px; margin-bottom: 16px; box-shadow: var(--shadow); cursor: pointer;
    transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, border-color .25s;
    animation: rise .5s cubic-bezier(.16,1,.3,1);
    display: flex; flex-direction: column; height: 100%;
  }
  .session:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: #CDE6DA; }
  .session .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .session .date { font-size: 12.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .method-chip { font-size: 11.5px; font-weight: 700; color: var(--green-deep); background: var(--green-soft); padding: 4px 10px; border-radius: 999px; }
  .session .q { font-size: 15px; font-weight: 700; color: var(--ink-2); margin-bottom: 12px; line-height: 1.5; }
  .session .insight {
    position: relative; font-size: 17px; font-weight: 800; color: var(--green-deep);
    background: linear-gradient(180deg, var(--green-soft), #F1FAF5); border-left: 4px solid var(--green);
    padding: 14px 16px 14px 18px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; line-height: 1.6;
  }
  .session .insight::before { content: "“"; position: absolute; left: 6px; top: -4px; font-size: 30px; color: rgba(29,158,117,.28); font-family: Georgia, serif; }
  .session .meta { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-3); margin-top: 14px; flex-wrap: wrap; }
  .score { display: inline-flex; align-items: center; gap: 7px; }
  .score .lab { color: var(--ink-3); }
  .dots { letter-spacing: 1px; font-size: 12px; }
  .dots .on { color: var(--green); }
  .dots .off { color: #D7DED9; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip { font-size: 12.5px; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); padding: 5px 11px; border-radius: 999px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.id { color: var(--green-deep); background: var(--green-soft); border-color: #CFE9DC; font-weight: 600; }
  .tags-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .tag-pill {
    font-size: 11.5px; font-weight: 600; color: var(--green-deep);
    background: var(--green-soft); border: 1px solid #CFE9DC;
    padding: 3px 10px; border-radius: 999px;
  }
  .session-menu {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink-3); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .session-menu:hover { color: var(--green-deep); border-color: var(--green); }
  .session-menu-popover {
    position: absolute; right: 18px; top: 50px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-hover); overflow: hidden; z-index: 5;
    min-width: 110px;
  }
  .session-menu-popover button {
    display: block; width: 100%; text-align: left;
    padding: 10px 14px; border: none; background: none;
    font-size: 13px; color: var(--ink-2); cursor: pointer; font-family: inherit;
  }
  .session-menu-popover button:hover { background: var(--bg); color: var(--green-deep); }
  .session-menu-popover button.danger { color: var(--coral); }
  .session-menu-popover button.danger:hover { background: var(--coral-soft); }
  .session .foot { display: flex; gap: 8px; margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line); }
  .mini {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line);
    padding: 9px 8px; min-height: var(--touch); border-radius: 10px; cursor: pointer; transition: all .18s; font-family: inherit;
  }
  .mini:hover { color: var(--green-deep); border-color: var(--green); background: var(--green-soft); }
  .mini:active { transform: scale(.97); }

  /* 空状态 */
  .empty { text-align: center; color: var(--ink-3); padding: 70px 20px; font-size: 14.5px; }
  .empty .big { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 22px; background: var(--green-soft); display: flex; align-items: center; justify-content: center; }
  .empty a { color: var(--green); text-decoration: none; font-weight: 700; }

  /* 详情弹窗 */
  .modal-mask { position: fixed; inset: 0; background: rgba(20,30,27,.5); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 30px 16px; z-index: 50; overflow-y: auto; }
  .modal-mask.show { display: flex; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  .modal {
    background: var(--bg); border-radius: var(--radius-lg); width: 100%; max-width: 560px;
    box-shadow: 0 30px 80px rgba(0,0,0,.3); animation: pop .28s cubic-bezier(.16,1,.3,1); max-height: 90vh; overflow-y: auto;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.98) } to { opacity: 1; transform: none } }
  .modal-head { position: sticky; top: 0; background: var(--bg); padding: 18px 22px 14px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); z-index: 2; }
  .modal-head .t { font-size: 16px; font-weight: 800; }
  .modal-close { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
  .modal-close:hover { color: var(--coral); border-color: var(--coral); }
  .modal-body { padding: 18px 22px 24px; }
  .d-block { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px 18px; margin-bottom: 14px; }
  .d-k { font-size: 12px; font-weight: 800; color: var(--green-deep); letter-spacing: .6px; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .d-v { font-size: 14.5px; color: var(--ink); line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .d-insight { background: linear-gradient(180deg, var(--green-soft), #F1FAF5); border-left: 4px solid var(--green); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .d-qa { font-size: 13.5px; color: var(--ink-2); margin-bottom: 6px; }
  .d-qa b { color: var(--ink); }
  .d-list { margin: 4px 0 0 18px; font-size: 13.5px; color: var(--ink-2); line-height: 1.7; }
  .modal-actions { display: flex; gap: 10px; padding: 0 22px 22px; }
  .modal-actions .mini { padding: 12px; }
  .modal-actions .mini.danger { color: var(--coral); }
  .modal-actions .mini.danger:hover { background: var(--coral-soft); border-color: var(--coral); }
  .edit-input, .edit-textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 14px; font-family: inherit; color: var(--ink);
    background: #fff; outline: none; box-sizing: border-box;
  }
  .edit-input:focus, .edit-textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,158,117,.1); }
  .edit-textarea { min-height: 80px; resize: vertical; }

  /* 悬浮入口（在 app / index 中复用） */
  .fab-archive {
    position: fixed; right: 18px; bottom: 18px; z-index: 40;
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--green-deep), var(--green)); color: #fff;
    padding: 13px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; text-decoration: none;
    box-shadow: 0 10px 26px rgba(14,107,80,.4); transition: transform .2s, box-shadow .2s; font-family: inherit;
  }
  .fab-archive:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(14,107,80,.5); }
  .fab-archive svg { flex-shrink: 0; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* 打印（下载 PDF） */
  @media print {
    body { background: #fff; }
    .topbar, .toolbar, .fab-archive, .session .foot, .review-card .actions { display: none !important; }
    .wrap { max-width: 100%; padding: 0; }
    .session, .identity-card, .stat { box-shadow: none; break-inside: avoid; }
    .session { cursor: default; }
  }

  /* ===== Phase 2-E 桌面响应式：放宽并分栏 ===== */
  @media (min-width: 900px) {
    .wrap { max-width: 940px; }
    #sessionList { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; grid-auto-rows: 1fr; }
    .session { margin-bottom: 0; }
  }
  @media (min-width: 1200px) {
    .wrap { max-width: 1100px; }
    #sessionList { grid-template-columns: 1fr 1fr 1fr; }
  }

  /* ===== Phase 2-A 动效守卫（尊重无障碍偏好） ===== */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (function(){
    try {
      if (localStorage.getItem('trf_theme') === 'dark') {
        document.documentElement.setAttribute('data-theme','dark');
      }
    } catch(e){}
  })();
</script>

<body>
<div class="wrap">
  <div class="topbar">
    <a class="nav-link" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      首页
    </a>
    <a class="nav-link primary" href="app.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      再来一次
    </a>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换深色模式">
      <span class="t-light">☾ 深色</span><span class="t-dark">☀ 浅色</span>
    </button>
  </div>

  <div class="page-head">
    <h1>我的认知档案</h1>
    <div class="page-sub">每一次想清楚，都在这里留下痕迹 · 随时回看、调用、带走</div>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#93A09A" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="#93A09A" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="搜索挑战 / 洞察 / 身份…" oninput="onSearch()">
    </div>
    <button class="act solid" onclick="downloadPDF()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      下载 PDF
    </button>
    <button class="act" onclick="downloadJSON()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      存数据
    </button>
  </div>

  <!-- 身份区：每个角色一张卡片 -->
  <div id="identityArea"></div>

  <!-- 角色标签过滤 -->
  <div class="role-filter" id="roleFilterArea" style="display:none;">
    <div class="rf-title">按角色标签筛选档案</div>
    <div class="role-list" id="roleList"></div>
  </div>

  <!-- 统计 -->
  <div class="stats" id="statsArea"></div>

  <!-- 回顾卡 -->
  <div class="review-card" id="reviewCard">
    <div class="k">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 10h16M9 5v4M15 5v4" stroke="currentColor" stroke-width="1.8"/></svg>
      该验证你的洞察了
    </div>
    <div class="q" id="reviewText"></div>
    <div class="actions">
      <button class="btn-yes" onclick="markReviewed()">我试了，有效</button>
      <button class="btn-no" onclick="markReviewed()">还没试</button>
    </div>
    <div class="done-tip" id="reviewDone">已记录，很好</div>
  </div>

  <!-- 会话列表 -->
  <div class="section-title" id="listTitle">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 016 6c0 2.5-1.2 3.9-2.6 5.3-.8.8-1.4 1.6-1.4 2.7M12 21h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    想清楚过的
  </div>
  <div id="sessionList"></div>
  <div class="empty" id="emptyBox" style="display:none;">
    <div class="big">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-5-5m5 5l5-5" stroke="#1D9E75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="19.5" r="1.8" fill="#1D9E75"/></svg>
    </div>
    还没有认知记录。<br>
    每一次「想清楚」，都会在这里留下一张卡片——带主题标签、可回看、可调用。<br>
    <a href="app.html">花 5 分钟，把眼前这件复杂挑战想通 →</a>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-head">
      <div class="t">洞察详情</div>
      <button class="modal-close" onclick="closeDetail()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions">
      <button class="mini" onclick="enterEditMode()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        编辑
      </button>
      <button class="mini" onclick="copyCurrentInsight()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5.5A1.5 1.5 0 016.5 4H15" stroke="currentColor" stroke-width="1.8"/></svg>
        复制洞察
      </button>
      <button class="mini" onclick="downloadCurrentCard()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        存为图片
      </button>
      <button class="mini danger" onclick="confirmDeleteCurrentSession()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14zM10 11v6M14 11v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        删除
      </button>
    </div>
    <div class="modal-actions" id="modalEditActions" style="display:none;">
      <button class="mini" onclick="saveEdit()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        保存
      </button>
      <button class="mini" onclick="renderDetailView()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        取消
      </button>
    </div>
  </div>
</div>

<script>
const LS_ARCHIVE = 'trf_archive';
const LS_PROFILE = 'trf_profile';
const LS_REVIEW = 'trf_reviewed';

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeXml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
}
function fmtDate(iso) {
  try { return new Date(iso).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}); } catch(e) { return ''; }
}
function getScenario(s) { return s.scenario || s.question || ''; }
function getInsight(s) { return (s.essence && s.essence.insight) || s.insight || ''; }
function getNature(s) { return (s.essence && s.essence.nature) || ''; }

function dots(n) {
  n = Math.max(0, Math.min(5, Number(n) || 0));
  let h = '';
  for (let i = 0; i < 5; i++) h += i < n ? '<span class="on">●</span>' : '<span class="off">○</span>';
  return `<span class="dots">${h}</span>`;
}

function loadArchive() {
  try { return JSON.parse(localStorage.getItem(LS_ARCHIVE)) || []; } catch(e) { return []; }
}

/* ---------- 身份 ---------- */
function renderIdentity() {
  const archive = loadArchive();
  const identities = extractIdentities(archive);
  const area = document.getElementById('identityArea');
  if (!identities.length) {
    area.innerHTML = `<div class="identity-empty">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#1D9E75" stroke-width="2"/><path d="M12 8v4l2.6 2.6" stroke="#1D9E75" stroke-width="2" stroke-linecap="round"/></svg>
      完成一次「帮我清楚」，你会在这里看到自己的身份如何被重新定义。
    </div>`;
    document.getElementById('roleFilterArea').style.display = 'none';
    return;
  }
  // 每个角色一张卡片
  area.innerHTML = identities.map(item => `
    <div class="identity-card" onclick="filterByRole('${escapeHtml(item.text)}')">
      <div class="k">我期待自己成为</div>
      <div class="v">「<em>${escapeHtml(item.text)}</em>」的人</div>
      <div class="count">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        已投 ${item.votes || 1} 票 · 最近 ${fmtDate(item.date)}
      </div>
    </div>
  `).join('');
  renderRoleFilter(identities, archive);
}

function extractIdentities(archive) {
  let profile = { identityStatements: [] };
  try { profile = JSON.parse(localStorage.getItem(LS_PROFILE)) || profile; } catch(e) {}
  const statements = profile.identityStatements || [];
  // 同时从档案中收集身份，确保旧数据也能显示
  const map = new Map();
  statements.forEach(s => {
    if (!s.text) return;
    const existing = map.get(s.text);
    if (!existing || new Date(s.date) > new Date(existing.date)) {
      map.set(s.text, { text: s.text, date: s.date, votes: s.votes || 1, sessionId: s.sessionId });
    }
  });
  archive.forEach(s => {
    if (!s.identity) return;
    if (!map.has(s.identity)) {
      map.set(s.identity, { text: s.identity, date: s.completedAt || s.createdAt, votes: 1, sessionId: s.id });
    }
  });
  return Array.from(map.values()).sort((a, b) => new Date(b.date) - new Date(a.date));
}

let currentRoleFilter = '';
function renderRoleFilter(identities, archive) {
  const box = document.getElementById('roleFilterArea');
  const list = document.getElementById('roleList');
  if (!identities.length) { box.style.display = 'none'; return; }
  box.style.display = 'block';
  list.innerHTML = identities.map(item => {
    const related = archive.filter(s => s.identity === item.text);
    const tagSet = new Set();
    related.forEach(s => (s.tags || []).forEach(t => tagSet.add(t)));
    const tags = Array.from(tagSet).slice(0, 3);
    const isSel = currentRoleFilter === item.text;
    return `
      <div class="role-chip ${isSel ? 'sel' : ''}" onclick="filterByRole('${escapeHtml(item.text)}')">
        <span>${escapeHtml(item.text)}</span>
        <span class="rf-count">${related.length}</span>
        ${tags.length ? `<span class="rf-tags">${tags.map(t => `<span>${escapeHtml(t)}</span>`).join('')}</span>` : ''}
      </div>
    `;
  }).join('') + `
    <div class="role-chip ${currentRoleFilter === '' ? 'sel' : ''}" onclick="filterByRole('')">全部档案</div>
  `;
}

function filterByRole(role) {
  currentRoleFilter = role;
  renderSessions();
  const archive = loadArchive();
  const identities = extractIdentities(archive);
  renderRoleFilter(identities, archive);
  // 滚动到档案列表
  document.getElementById('listTitle').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- 统计 ---------- */
function renderStats() {
  const archive = loadArchive();
  const box = document.getElementById('statsArea');
  if (!archive.length) { box.innerHTML = ''; return; }
  const total = archive.length;
  const avgImpact = (archive.reduce((a, s) => a + (Number(s.impact) || 0), 0) / total).toFixed(1);
  const reviewed = (JSON.parse(localStorage.getItem(LS_REVIEW) || '[]')).length;
  box.innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="lbl">想清楚的事</div></div>
    <div class="stat"><div class="num">${avgImpact}</div><div class="lbl">平均重要性 /5</div></div>
    <div class="stat"><div class="num">${reviewed}</div><div class="lbl">已回看验证</div></div>
  `;
}

/* ---------- 回顾 ---------- */
function renderReview() {
  const archive = loadArchive();
  if (!archive.length) return;
  const reviewed = JSON.parse(localStorage.getItem(LS_REVIEW) || '[]');
  const now = Date.now();
  const due = archive.find(s => {
    if (reviewed.includes(s.id)) return false;
    const age = now - new Date(s.completedAt || s.createdAt).getTime();
    return age > 48 * 3600 * 1000;
  });
  if (!due) return;
  const card = document.getElementById('reviewCard');
  card.style.display = 'block';
  const sc = getScenario(due);
  const ins = getInsight(due);
  const out = (due.nearScenario && due.nearScenario.scenario) || due.expectedOutcome || '一些变化';
  document.getElementById('reviewText').innerHTML =
    `「${escapeHtml(sc)}」——你的新认知「${escapeHtml(ins)}」有没有在真实世界应验？期待看到${escapeHtml(out)}。`;
  window.__dueId = due.id;
}
function markReviewed() {
  const id = window.__dueId;
  if (!id) return;
  const reviewed = JSON.parse(localStorage.getItem(LS_REVIEW) || '[]');
  reviewed.push(id);
  localStorage.setItem(LS_REVIEW, JSON.stringify(reviewed));
  document.getElementById('reviewDone').style.display = 'block';
  setTimeout(() => { document.getElementById('reviewCard').style.display = 'none'; }, 1500);
}

/* ---------- 列表 ---------- */
let currentFilter = '';
function renderSessions() {
  const archive = loadArchive();
  const box = document.getElementById('sessionList');
  const empty = document.getElementById('emptyBox');
  const title = document.getElementById('listTitle');
  if (!archive.length) { box.innerHTML = ''; empty.style.display = 'block'; title.style.display = 'none'; document.getElementById('statsArea').innerHTML=''; return; }
  const f = currentFilter.trim().toLowerCase();
  let filtered = archive;
  if (currentRoleFilter) {
    filtered = filtered.filter(s => s.identity === currentRoleFilter);
  }
  if (f) {
    filtered = filtered.filter(s =>
      (getScenario(s) + ' ' + getInsight(s) + ' ' + (s.identity || '') + ' ' + (s.tags || []).join(' ') + ' ' + (s.nearScenario && s.nearScenario.scenario || '')).toLowerCase().includes(f)
    );
  }
  empty.style.display = filtered.length ? 'none' : 'block';
  title.style.display = 'flex';
  title.innerHTML = currentRoleFilter
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 016 6c0 2.5-1.2 3.9-2.6 5.3-.8.8-1.4 1.6-1.4 2.7M12 21h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>「${escapeHtml(currentRoleFilter)}」想清楚过的`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3a6 6 0 016 6c0 2.5-1.2 3.9-2.6 5.3-.8.8-1.4 1.6-1.4 2.7M12 21h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>想清楚过的`;
  box.innerHTML = filtered.map((s, i) => {
    const groups = (s.groups || []).map(g => g.label).filter(Boolean);
    const near = s.nearScenario || {};
    const far = s.farScenario || {};
    const tags = s.tags || [];
    return `
    <div class="session" data-id="${s.id}" onclick="openDetail('${s.id}')">
      <div class="row1">
        <span class="date">${fmtDate(s.completedAt || s.createdAt)}</span>
        <div style="display:flex;gap:8px;align-items:center;">
          ${s.method ? `<span class="method-chip">${escapeHtml(s.method)}</span>` : ''}
          <button class="session-menu" onclick="event.stopPropagation();toggleSessionMenu('${s.id}')" title="更多">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="6" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="18" r="2" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
      ${tags.length ? `<div class="tags-row">${tags.map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="q">${escapeHtml(getScenario(s))}</div>
      <div class="insight">${escapeHtml(getInsight(s))}</div>
      <div class="meta">
        <span class="score"><span class="lab">重要性</span>${dots(s.impact)}</span>
        <span class="score"><span class="lab">接受难度</span>${dots(s.effort)}</span>
        ${groups.length ? `<span class="score"><span class="lab">归类 ${groups.length} 类</span></span>` : ''}
      </div>
      <div class="chips">
        ${near.scenario ? `<span class="chip">近：${escapeHtml(near.scenario)}</span>` : ''}
        ${far.scenario ? `<span class="chip">远：${escapeHtml(far.scenario)}</span>` : ''}
        ${s.identity ? `<span class="chip id">身份：${escapeHtml(s.identity)}</span>` : ''}
      </div>
      <div class="foot" onclick="event.stopPropagation()">
        <button class="mini" onclick="event.stopPropagation();openDetail('${s.id}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>
          查看详情
        </button>
        <button class="mini" onclick="event.stopPropagation();copyInsight('${s.id}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V5.5A1.5 1.5 0 016.5 4H15" stroke="currentColor" stroke-width="1.8"/></svg>
          复制洞察
        </button>
        <button class="mini" onclick="event.stopPropagation();downloadCard('${s.id}')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          存为图片
        </button>
      </div>
      <div class="session-menu-popover" id="menu-${s.id}" style="display:none;">
        <button onclick="event.stopPropagation();openDetail('${s.id}')">编辑 / 详情</button>
        <button onclick="event.stopPropagation();confirmDeleteSession('${s.id}')" class="danger">删除</button>
      </div>
    </div>`;
  }).join('');
}

function onSearch() {
  currentFilter = document.getElementById('searchInput').value;
  renderSessions();
}

function toggleSessionMenu(id) {
  const pop = document.getElementById('menu-' + id);
  if (!pop) return;
  const show = pop.style.display === 'none';
  document.querySelectorAll('.session-menu-popover').forEach(p => p.style.display = 'none');
  pop.style.display = show ? 'block' : 'none';
  if (show) {
    const close = e => {
      if (!pop.contains(e.target) && !e.target.closest('.session-menu')) {
        pop.style.display = 'none';
        document.removeEventListener('click', close);
      }
    };
    setTimeout(() => document.addEventListener('click', close), 10);
  }
}

function saveArchive(archive) {
  localStorage.setItem(LS_ARCHIVE, JSON.stringify(archive));
  renderIdentity();
  renderStats();
  renderReview();
  renderSessions();
}

function updateProfileIdentity(session) {
  if (!session.identity) return;
  let profile = { identityStatements: [] };
  try { profile = JSON.parse(localStorage.getItem(LS_PROFILE)) || profile; } catch(e) {}
  profile.identityStatements = profile.identityStatements || [];
  const existing = profile.identityStatements.find(s => s.text === session.identity);
  if (existing) {
    existing.date = session.completedAt || session.createdAt || new Date().toISOString();
    existing.sessionId = session.id;
  } else {
    profile.identityStatements.unshift({ text: session.identity, date: session.completedAt || session.createdAt || new Date().toISOString(), sessionId: session.id, votes: 1 });
  }
  localStorage.setItem(LS_PROFILE, JSON.stringify(profile));
}

function confirmDeleteSession(id) {
  const s = findSession(id);
  if (!s) return;
  if (!confirm('确定删除这条认知记录？删除后无法恢复。')) return;
  let archive = loadArchive();
  archive = archive.filter(x => x.id !== id);
  saveArchive(archive);
  // 同时从 profile 中移除关联身份（若该身份已无其他档案引用）
  let profile = { identityStatements: [] };
  try { profile = JSON.parse(localStorage.getItem(LS_PROFILE)) || profile; } catch(e) {}
  if (profile.identityStatements) {
    const stillUsed = archive.some(s => s.identity && profile.identityStatements.some(st => st.text === s.identity));
    if (!stillUsed) {
      profile.identityStatements = profile.identityStatements.filter(st => st.sessionId !== id);
      localStorage.setItem(LS_PROFILE, JSON.stringify(profile));
    }
  }
  toast('已删除');
}

/* ---------- 详情 ---------- */
let currentDetail = null;
let isEditing = false;
function findSession(id) { return loadArchive().find(s => s.id === id); }

function openDetail(id) {
  const s = findSession(id);
  if (!s) return;
  currentDetail = s;
  isEditing = false;
  renderDetailView();
  document.getElementById('modalMask').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function renderDetailView() {
  if (!currentDetail) return;
  const s = currentDetail;
  const b = document.getElementById('modalBody');
  const groups = (s.groups || []).map(g => `• ${escapeHtml(g.label)}：${(g.notes || []).map(n => `${n.type} ${n.text}`).join('；')}`).join('\n') || '—';
  const qa = (s.insightQuestions || []).map((q, i) => `<div class="d-qa"><b>Q${i+1}：</b>${escapeHtml(q)}<br><b>A：</b>${escapeHtml((s.insightAnswers || [])[i] || '—')}</div>`).join('') || '';
  const near = s.nearScenario || {}, far = s.farScenario || {};
  const nf = s.nearFeedback || null, ff = s.farFeedback || null;
  const rp = s.resourcesPlan || null;
  const tags = (s.tags || []).map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join('') || '<span style="color:var(--ink-3);font-size:12.5px;">无标签</span>';
  b.innerHTML = `
    <div class="d-block"><div class="d-k">标签</div><div class="d-v">${tags}</div></div>
    <div class="d-block"><div class="d-k">面对的挑战</div><div class="d-v">${escapeHtml(getScenario(s))}</div></div>
    ${qa ? `<div class="d-block"><div class="d-k">知行的启发与你的回答</div>${qa}</div>` : ''}
    <div class="d-block d-insight"><div class="d-k">现象背后的本质</div><div class="d-v">${escapeHtml(getNature(s) || '—')}</div></div>
    <div class="d-block d-insight"><div class="d-k">新洞察 / 新认知</div><div class="d-v">${escapeHtml(getInsight(s))}</div></div>
    <div class="d-block"><div class="d-k">评分</div><div class="d-v">重要性 ${dots(s.impact)} · 接受难度 ${dots(s.effort)}</div></div>
    ${groups !== '—' ? `<div class="d-block"><div class="d-k">归类</div><div class="d-v">${escapeHtml(groups)}</div></div>` : ''}
    ${near.scenario ? `<div class="d-block"><div class="d-k">近应用（熟悉的场景）</div><div class="d-v">场景：${escapeHtml(near.scenario)}<br>计划：${escapeHtml(near.plan || '—')}<br>时间：${escapeHtml(near.when || '—')} · 验证：${escapeHtml(near.howToVerify || '—')}</div>${fbBlock('近应用反馈', nf)}</div>` : ''}
    ${far.scenario ? `<div class="d-block"><div class="d-k">远应用（陌生场景）</div><div class="d-v">场景：${escapeHtml(far.scenario)}<br>计划：${escapeHtml(far.plan || '—')}<br>时间：${escapeHtml(far.when || '—')} · 验证：${escapeHtml(far.howToVerify || '—')}</div>${fbBlock('远应用反馈', ff)}</div>` : ''}
    ${rp ? `<div class="d-block"><div class="d-k">知行建议：支持资源与条件</div><div class="d-v">找的人：${(rp.people||[]).map(escapeHtml).join('；') || '—'}<br>资源：${(rp.resources||[]).map(escapeHtml).join('；') || '—'}<br>条件：${(rp.conditions||[]).map(escapeHtml).join('；') || '—'}<br>备注：${escapeHtml(rp.note || '—')}</div></div>` : ''}
    ${s.identity ? `<div class="d-block d-insight"><div class="d-k">期待的身份</div><div class="d-v">「${escapeHtml(s.identity)}」</div></div>` : ''}
  `;
  document.getElementById('modalActions').style.display = 'flex';
  document.getElementById('modalEditActions').style.display = 'none';
  isEditing = false;
}

function enterEditMode() {
  if (!currentDetail) return;
  isEditing = true;
  const s = currentDetail;
  const b = document.getElementById('modalBody');
  const tagsVal = (s.tags || []).join(', ');
  b.innerHTML = `
    <div class="d-block">
      <div class="d-k">标签（用逗号分隔）</div>
      <input type="text" class="edit-input" id="editTags" value="${escapeHtml(tagsVal)}" placeholder="主题、项目、情绪…">
    </div>
    <div class="d-block">
      <div class="d-k">面对的挑战</div>
      <textarea class="edit-textarea" id="editScenario">${escapeHtml(getScenario(s))}</textarea>
    </div>
    <div class="d-block">
      <div class="d-k">现象背后的本质</div>
      <textarea class="edit-textarea" id="editNature">${escapeHtml(getNature(s))}</textarea>
    </div>
    <div class="d-block">
      <div class="d-k">新洞察 / 新认知</div>
      <textarea class="edit-textarea" id="editInsight">${escapeHtml(getInsight(s))}</textarea>
    </div>
    <div class="d-block">
      <div class="d-k">期待的身份</div>
      <input type="text" class="edit-input" id="editIdentity" value="${escapeHtml(s.identity || '')}">
    </div>
  `;
  document.getElementById('modalActions').style.display = 'none';
  document.getElementById('modalEditActions').style.display = 'flex';
}

function saveEdit() {
  if (!currentDetail) return;
  const s = currentDetail;
  const tags = document.getElementById('editTags').value.split(/[,，]/).map(t => t.trim()).filter(Boolean);
  const scenario = document.getElementById('editScenario').value.trim();
  const nature = document.getElementById('editNature').value.trim();
  const insight = document.getElementById('editInsight').value.trim();
  const identity = document.getElementById('editIdentity').value.trim();

  let archive = loadArchive();
  const idx = archive.findIndex(x => x.id === s.id);
  if (idx === -1) return;

  const oldIdentity = archive[idx].identity;
  archive[idx].tags = tags;
  archive[idx].scenario = scenario;
  archive[idx].essence = archive[idx].essence || {};
  archive[idx].essence.nature = nature;
  archive[idx].essence.insight = insight;
  archive[idx].identity = identity;
  archive[idx].updatedAt = new Date().toISOString();

  // 同步更新 profile 中关联的身份
  if (identity) {
    updateProfileIdentity(archive[idx]);
  }
  // 如果身份被清空，且旧身份没有其他档案引用，从 profile 移除
  if (oldIdentity && !identity) {
    let profile = { identityStatements: [] };
    try { profile = JSON.parse(localStorage.getItem(LS_PROFILE)) || profile; } catch(e) {}
    const stillUsed = archive.some(x => x.id !== s.id && x.identity === oldIdentity);
    if (!stillUsed) {
      profile.identityStatements = (profile.identityStatements || []).filter(st => st.text !== oldIdentity);
      localStorage.setItem(LS_PROFILE, JSON.stringify(profile));
    }
  }

  saveArchive(archive);
  currentDetail = archive[idx];
  renderDetailView();
  toast('已保存');
}

function confirmDeleteCurrentSession() {
  if (!currentDetail) return;
  confirmDeleteSession(currentDetail.id);
  closeDetail();
}

function fbBlock(title, fb) {
  if (!fb) return '';
  const acts = (fb.actions || []).map(a => `<li>${escapeHtml(a)}</li>`).join('');
  return `<div class="d-block" style="margin-top:-14px;background:var(--green-soft);border-color:#CFE9DC;">
    <div class="d-k">${escapeHtml(title)} · ${fb.score || '—'}/5</div>
    <div class="d-v">做得好：${escapeHtml(fb.pros || '—')}<br>可改进：${escapeHtml(fb.improvements || '—')}<br>建议：${escapeHtml(fb.suggestion || '—')}</div>
    ${acts ? `<ul class="d-list">${acts}</ul>` : ''}
  </div>`;
}
function closeDetail() {
  document.getElementById('modalMask').classList.remove('show');
  document.body.style.overflow = '';
  isEditing = false;
}

function copyInsight(id) {
  const s = findSession(id);
  if (!s) return;
  const text = getInsight(s);
  navigator.clipboard.writeText(text).then(() => toast('已复制洞察')).catch(() => {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制洞察'); } catch(e) { toast('复制失败'); }
    document.body.removeChild(ta);
  });
}
function copyCurrentInsight() { if (currentDetail) copyInsight(currentDetail.id); }

  const data = { archive: loadArchive(), profile: (()=>{try{return JSON.parse(localStorage.getItem(LS_PROFILE))}catch(e){return {}}}), exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });

/* ---------- 导出：卡片图片（SVG → PNG，离线） ---------- */
function wrapChars(text, max) {
  const lines = []; let line = '';
  for (const ch of (text || '')) { line += ch; if (line.length >= max) { lines.push(line); line = ''; } }
  if (line) lines.push(line);
  if (!lines.length) lines.push('');
  return lines;
}
function buildCardSVG(s) {
  const W = 820, pad = 48;
  let y = 0; const parts = [];
  // 背景
  parts.push(`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E6B50"/><stop offset="1" stop-color="#2BBB8A"/></linearGradient>
    <clipPath id="clip"><rect x="0" y="0" width="${W}" height="9999" rx="26"/></clipPath></defs>`);
  parts.push(`<g clip-path="url(#clip)"><rect x="0" y="0" width="${W}" height="9999" fill="#ffffff"/>`);
  // 头部
  parts.push(`<rect x="0" y="0" width="${W}" height="150" fill="url(#g)"/>`);
  parts.push(`<text x="${pad}" y="58" font-size="14" fill="#ffffff" opacity="0.85" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700" letter-spacing="1">TRANSFORM · 我的洞察卡片</text>`);
  parts.push(`<text x="${pad}" y="92" font-size="15" fill="#ffffff" opacity="0.9" font-family="PingFang SC, Microsoft YaHei, sans-serif">${escapeXml(fmtDate(s.completedAt || s.createdAt))}</text>`);
  if (s.identity) parts.push(`<text x="${W-pad}" y="92" text-anchor="end" font-size="14" fill="#ffffff" opacity="0.95" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-weight="700">期待：${escapeXml(truncate(s.identity, 16))}</text>`);
  y = 150 + pad;

  // 挑战
  parts.push(`<text x="${pad}" y="${y}" font-size="13" fill="#93A09A" font-family="PingFang SC, sans-serif" font-weight="700" letter-spacing="1">面对的挑战</text>`);
  y += 24;
  wrapChars(getScenario(s), 30).forEach(l => { parts.push(`<text x="${pad}" y="${y}" font-size="17" fill="#1E2A26" font-family="PingFang SC, sans-serif">${escapeXml(l)}</text>`); y += 26; });
  y += 14;

  // 新认知
  parts.push(`<text x="${pad}" y="${y}" font-size="13" fill="#0E6B50" font-family="PingFang SC, sans-serif" font-weight="700" letter-spacing="1">我的新认知</text>`);
  y += 22;
  wrapChars(getInsight(s), 22).forEach(l => { parts.push(`<text x="${pad}" y="${y}" font-size="24" fill="#0E6B50" font-family="PingFang SC, sans-serif" font-weight="800">${escapeXml(l)}</text>`); y += 34; });
  y += 8;
  // 本质
  const nat = getNature(s);
  if (nat) {
    parts.push(`<text x="${pad}" y="${y}" font-size="13" fill="#93A09A" font-family="PingFang SC, sans-serif" font-weight="700" letter-spacing="1">现象背后的本质</text>`);
    y += 22;
    wrapChars(nat, 32).forEach(l => { parts.push(`<text x="${pad}" y="${y}" font-size="16" fill="#5A6B64" font-family="PingFang SC, sans-serif">${escapeXml(l)}</text>`); y += 24; });
    y += 12;
  }
  // 评分条
  parts.push(`<text x="${pad}" y="${y}" font-size="15" fill="#1E2A26" font-family="PingFang SC, sans-serif">重要性 ${'●'.repeat(Math.max(0,Math.min(5,Number(s.impact)||0)))}${'○'.repeat(5-Math.max(0,Math.min(5,Number(s.impact)||0)))}　接受难度 ${'●'.repeat(Math.max(0,Math.min(5,Number(s.effort)||0)))}${'○'.repeat(5-Math.max(0,Math.min(5,Number(s.effort)||0)))}</text>`);
  y += 30;
  // 底部线条
  parts.push(`<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="#E6E9E4" stroke-width="1"/>`);
  y += 26;
  parts.push(`<text x="${pad}" y="${y}" font-size="12.5" fill="#93A09A" font-family="PingFang SC, sans-serif">由 Transform · 想清楚，做得到 生成</text>`);
  y += pad;
  parts.push(`</g>`);
  const H = y;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${parts.join('')}</svg>`;
}
function truncate(t, n) { t = t || ''; return t.length > n ? t.slice(0, n) + '…' : t; }

function svgToPngDownload(svg, filename) {
  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = img.width * scale; canvas.height = img.height * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(b => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = filename; a.click();
      setTimeout(() => { URL.revokeObjectURL(url); URL.revokeObjectURL(a.href); }, 1000);
      toast('已保存为图片');
    }, 'image/png');
  };
  img.onerror = () => { toast('图片生成失败'); URL.revokeObjectURL(url); };
  img.src = url;
}
function downloadCard(id) {
  const s = findSession(id);
  if (!s) return;
  svgToPngDownload(buildCardSVG(s), 'transform-洞察-' + (s.id || Date.now()) + '.png');
}
function downloadCurrentCard() { if (currentDetail) downloadCard(currentDetail.id); }

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(30,42,38,.92);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:opacity .2s;'; document.body.appendChild(el); }
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}
