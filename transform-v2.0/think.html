<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>每日洞察 · Transform</title>
<style>
  :root {
    --bg: #F8F7F3;
    --surface: #FFFFFF;
    --surface-2: #F2F1EC;
    --ink: #151B19;
    --ink-2: #3D4A45;
    --ink-3: #7A8A83;
    --line: #E6E9E7;
    --line-2: #DDE2DF;
    --green: #0E6B50;
    --green-deep: #0A5A42;
    --green-2: #158A68;
    --green-3: #1D9E75;
    --green-soft: #E8F4EE;
    --green-light: #C8EBD9;
    --green-50: #F0F9F4;
    --amber: #C87A2A;
    --amber-soft: #FDF3E6;
    --amber-2: #EAA052;
    --coral: #C05B3C;
    --coral-soft: #F9EBE5;
    --violet: #5B4AA8;
    --violet-soft: #EEECFA;
    --radius-xl: 32px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow-1: 0 1px 2px rgba(21,27,25,.04);
    --shadow-2: 0 4px 12px rgba(21,27,25,.06), 0 16px 40px rgba(21,27,25,.08);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"] {
    --bg: #0C100F;
    --surface: #161C1A;
    --surface-2: #1E2523;
    --ink: #EEF4F1;
    --ink-2: #A7B6B0;
    --ink-3: #6A7A74;
    --line: #252E2C;
    --line-2: #2F3A37;
    --green: #34D29E;
    --green-2: #2BBB8A;
    --green-3: #1D9E75;
    --green-soft: #132A24;
    --green-light: #1E4A3E;
    --green-50: #0F1F1B;
    --amber: #EAA052;
    --amber-soft: #2E2417;
    --coral: #D9714F;
    --coral-soft: #2E1E18;
    --violet: #A99BE8;
    --violet-soft: #23203A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh;
  }
  .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 0 20px 110px; }

  /* 完整版「深入洞察」入口（底部小链接） */
  .full-link-bar {
    text-align: center; margin-top: 24px; padding: 16px 0 0;
    border-top: 1px dashed var(--line);
  }
  .full-link-bar a {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--violet, #5B4AA8);
    text-decoration: none; padding: 8px 16px; border-radius: 999px;
    transition: all .2s;
  }
  .full-link-bar a:hover { background: var(--violet-soft, #EEECFA); }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 16px 0; }
  /* ===== 全局导航（所有页面互跳） ===== */
  .gnav {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
    padding: 4px; border-radius: 999px; background: var(--surface-2);
    overflow-x: auto; justify-content: center; scrollbar-width: none;
  }
  .gnav::-webkit-scrollbar { display: none; }
  .gnav .gn-item {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    text-decoration: none; white-space: nowrap; transition: all .2s;
    flex-shrink: 0;
  }
  .gnav .gn-item:hover { color: var(--green); background: var(--green-soft); }
  .gnav .gn-item.on { background: var(--surface); color: var(--green-deep); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(14,107,80,.26), 0 1px 4px rgba(30,42,38,.08); }
  @media (max-width: 560px) {
    .gnav { gap: 4px; }
    .gnav .gn-item { padding: 6px 11px; font-size: 12px; }
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none;
    font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 999px; transition: all .2s;
  }
  .back:hover { background: var(--surface-2); color: var(--ink); }
  .topbar .spacer { flex: 1; }
  .topbar button {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13.5px;
    padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .topbar button:hover { color: var(--ink); border-color: var(--line-2); }
  /* R-11：主题开关统一为图标按钮（与其它页逐字一致） */
  .tb-theme { padding: 9px 12px !important; }
  .theme-toggle .t-dark { display: none; }
  [data-theme="dark"] .theme-toggle .t-light { display: none; }
  [data-theme="dark"] .theme-toggle .t-dark { display: inline; }
  .tb-theme .t-light, .tb-theme .t-dark { font-size: 15px; line-height: 1; }
  .arch-btn { background: linear-gradient(135deg, #0A5A42, #0E6B50) !important; color: #fff !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(14,107,80,.22); }
  .arch-btn:hover { color: #fff !important; border-color: transparent !important; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(14,107,80,.32); }
  /* 高特异性：覆盖 .topbar button */
  .topbar button.arch-btn,
  .topbar button.arch-btn:hover { background: linear-gradient(135deg, #0A5A42, #0E6B50) !important; color: #fff !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(14,107,80,.22); }

  /* 阶段 1：输入主题 */
  .think-hero {
    background: linear-gradient(135deg, #0A5A42, var(--green-3));
    border-radius: var(--radius-lg); padding: 30px 26px; color: #fff; margin-top: 8px;
  }
  .think-hero .th-eyebrow { font-size: 12.5px; opacity: .85; letter-spacing: .5px; margin-bottom: 10px; }
  .think-hero h1 { font-size: 24px; font-weight: 800; line-height: 1.4; margin-bottom: 8px; }
  .think-hero p { font-size: 14px; opacity: .92; line-height: 1.7; margin-bottom: 18px; }
  .think-input {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: none; font-size: 15px;
    font-family: inherit; color: var(--ink); outline: none; background: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  .think-input::placeholder { color: var(--ink-3); }
  .cta-start {
    display: block; width: 100%; margin-top: 12px; padding: 15px; border: none; border-radius: 12px;
    background: #fff; color: #0A5A42; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease);
  }
  .cta-start:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.18); }
  .cta-start:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .cta-back-q {
    display: block; width: 100%; margin-top: 8px; padding: 13px; border: 1.5px solid rgba(255,255,255,.55);
    border-radius: 12px; background: transparent; color: #fff; font-size: 14.5px; font-weight: 700;
    cursor: pointer; font-family: inherit; transition: all .25s var(--ease);
  }
  .cta-back-q:hover { background: rgba(255,255,255,.14); }
  .tk-card {
    background: #fff; border-radius: 12px; padding: 12px 14px; margin-top: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,.15); color: var(--ink);
  }
  .tk-card .tk-line { font-size: 13.5px; color: var(--ink); line-height: 1.6; }
  .tk-card .tk-line b { color: var(--green-deep); }
  .tk-card .tk-hint { font-size: 12px; color: var(--ink-3); margin-top: 5px; line-height: 1.55; }

  /* 阶段 2：AI 出题 + 回答 */
  .q-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 24px; margin-top: 16px;
  }
  .q-card .q-tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800;
    letter-spacing: 1px; color: var(--violet); margin-bottom: 12px;
  }
  .q-card .q-text { font-size: 19px; font-weight: 800; line-height: 1.5; margin-bottom: 16px; color: var(--ink); }
  .q-card .q-ctx { font-size: 12.5px; color: var(--ink-3); margin-bottom: 14px; line-height: 1.6; }
  .q-answer {
    width: 100%; min-height: 90px; padding: 13px 15px; border-radius: 12px;
    border: 1.5px solid var(--line-2); background: var(--surface); font-size: 14.5px;
    font-family: inherit; color: var(--ink); outline: none; resize: vertical; line-height: 1.7;
    transition: border-color .2s;
  }
  .q-answer:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(91,74,168,.1); }

  .q-ai-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .q-ai-label { font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .ai-btn-cap {
    display: inline-flex; align-items: center; gap: 5px; padding: 9px 16px; border-radius: 999px;
    border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink-2);
    font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .ai-btn-cap:hover { border-color: var(--violet); color: var(--violet); background: var(--violet-soft); }
  .ai-btn-cap.loading { opacity: .5; pointer-events: none; }

  .q-ai-result { margin-top: 12px; padding: 12px 14px; background: var(--violet-soft); border-radius: 12px; font-size: 13.5px; line-height: 1.7; display: none; }
  .q-ai-result.show { display: block; animation: fade-in .3s ease; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .ai-tag { display: inline-block; font-size: 11px; font-weight: 800; color: var(--violet); margin-bottom: 4px; }
  /* 脚手架结果累积：保留每一次（理清 → 质疑 → 查证），不互相覆盖 */
  .q-ai-item + .q-ai-item { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }

  /* 多轮问答 */
  .q-round + .q-round { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .q-round-past { opacity: .82; }
  .q-round-tag { font-size: 11px; font-weight: 800; color: var(--ink-3); letter-spacing: .04em; margin-bottom: 6px; }
  /* 三类深化对话卡 */
  .cap-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .cap-card + .cap-card { margin-top: 10px; }
  .cap-q { margin-bottom: 8px; }
  .cap-ans { background: var(--green-50); border: 1px solid var(--green-light); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--ink); white-space: pre-wrap; }
  .cap-input { width: 100%; min-height: 72px; border: 1.5px solid var(--green-light); border-radius: 10px; padding: 10px 12px; font-family: inherit; font-size: 13.5px; line-height: 1.6; resize: vertical; background: var(--surface); box-sizing: border-box; color: var(--ink); outline: none; }
  .cap-input:focus { border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(29,158,117,.1); }
  .cap-actions { display: flex; gap: 10px; margin-top: 8px; }
  .ai-btn-cap.done { border-color: var(--green-light); color: var(--green); background: var(--green-50); }
  /* 底部操作行：追问 + 整合 */
  .q-foot-row { display: flex; gap: 10px; margin-top: 16px; align-items: stretch; flex-wrap: wrap; }
  .q-foot-row .cta-integrate { flex: 1.4; margin-top: 0; }
  .q-foot-row .btn-ghost { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; border: none; transition: all .25s var(--ease);
  }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: #0A5A42; }
  .btn-ghost { background: var(--surface); color: var(--green); border: 1.5px solid var(--green-light); }
  .btn-ghost:hover { border-color: var(--green); background: var(--green-50); }

  .cta-integrate {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    margin-top: 16px; padding: 16px; border: none; border-radius: var(--radius-md);
    background: var(--green-deep); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease);
  }
  .cta-integrate:hover { transform: translateY(-2px); filter: brightness(1.08); }
  .cta-integrate:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .cta-integrate.loading { opacity: .6; pointer-events: none; }

  /* 阶段 3：洞察卡 */
  .insight-result { margin-top: 16px; }
  .insight-result.hidden { display: none; }
  .ir-card {
    background: linear-gradient(135deg, var(--green-soft) 0%, var(--green-50) 100%);
    border: 1.5px solid var(--green-light); border-radius: var(--radius-lg);
    padding: 24px 22px 18px;
    box-shadow: 0 8px 28px rgba(29,158,117,.14);
    animation: tf-slide .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes tf-slide { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .ir-crown { font-size: 36px; line-height: 1; margin-bottom: 6px; }
  .ir-title { font-size: 20px; font-weight: 800; color: var(--green); margin-bottom: 14px; }
  .ir-block { background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .ir-block .k { font-size: 11.5px; font-weight: 800; letter-spacing: 1px; color: var(--green); margin-bottom: 4px; }
  .ir-block .v { font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.7; }
  .ir-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .ir-actions-sub { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .ir-actions-sub .btn { flex: 1; padding: 10px 16px; font-size: 13.5px; }
  .ir-canvas { display: block; width: min(100%, 340px); height: auto; margin: 6px auto 4px; border-radius: 18px; box-shadow: 0 8px 28px rgba(31,45,39,.12); }
  .ir-note { font-size: 12px; color: var(--ink-3); margin-top: 10px; text-align: center; }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--surface); padding: 12px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .3s var(--ease);
    z-index: 100; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 路径式步骤条（与 app/act 同款，3 节点：写下来/想清楚/已沉淀） */
  .path { display: flex; align-items: flex-start; justify-content: space-between; position: relative; max-width: 360px; margin: 2px auto 8px; }
  .path::before {
    content: ''; position: absolute; top: 16px; left: 7.8%; right: 7.8%;
    height: 2px; background: var(--line); border-radius: 2px;
  }
  .path::after {
    content: ''; position: absolute; top: 16px; left: 7.8%;
    height: 2px; background: var(--green); border-radius: 2px;
    transition: width .5s cubic-bezier(.16,1,.3,1); width: 0;
  }
  .path[data-progress="2"]::after { width: 42%; }
  .path[data-progress="3"]::after { width: 84%; }
  .p-node { display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 1; width: 56px; cursor: default; }
  .p-node.clickable { cursor: pointer; }
  .p-node.clickable:hover .p-dot { border-color: var(--green); box-shadow: 0 0 0 5px rgba(29,158,117,.10); }
  .p-dot {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--surface); border: 2.5px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: var(--ink-3);
    transition: all .4s cubic-bezier(.16,1,.3,1);
  }
  .p-node svg { width: 15px; height: 15px; }
  .p-node.active .p-dot { border-color: var(--green); background: var(--green-soft); color: var(--green-deep); box-shadow: 0 0 0 5px rgba(29,158,117,.12); }
  .p-node.done .p-dot { background: var(--green); border-color: var(--green); color: #fff; }
  .p-node .p-label { font-size: 12px; color: var(--ink-3); transition: color .3s; white-space: nowrap; }
  .p-node.active .p-label { color: var(--green-deep); font-weight: 600; }
  .p-node.done .p-label { color: var(--ink-2); }
  @media (min-width: 1024px) {
    .p-dot { width: 40px; height: 40px; }
    .p-node .p-label { font-size: 13px; }
    .p-node svg { width: 17px; height: 17px; }
    .path::before, .path::after { top: 19px; height: 3px; }
    .path[data-progress="2"]::after { width: 42%; }
    .path[data-progress="3"]::after { width: 84%; }
  }
</style>
<script>
  (function(){
    try { if (localStorage.getItem('trf_theme') === 'dark') document.documentElement.setAttribute('data-theme','dark'); }
    catch(e){}
  })();
</script>

</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      首页
    </a>
    <nav class="gnav" aria-label="全局导航">
      <a class="gn-item on" href="think.html">每日洞察</a>
      <a class="gn-item" href="punch.html">每日改变</a>
      <a class="gn-item" href="cognitive.html">成长资产</a>
    </nav>
    <button class="theme-toggle tb-theme" onclick="toggleTheme()" aria-label="切换深色模式" title="切换深色模式"><span class="t-light">☾</span><span class="t-dark">☀</span></button>
  </div>

  <div class="path" id="stepsBar" style="display:none;">
    <div class="p-node" data-step="0">
      <div class="p-dot"><svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="p-label">写下来</span>
    </div>
    <div class="p-node" data-step="1">
      <div class="p-dot"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.9"/><path d="M12 8v4l2.6 2.6" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></div>
      <span class="p-label">想清楚</span>
    </div>
    <div class="p-node" data-step="2">
      <div class="p-dot"><svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="p-label">已沉淀</span>
    </div>
  </div>

  <div id="thinkArea"></div>
  <div id="voiceSlot" data-voice-slot hidden></div>
  <div class="full-link-bar">
    <a href="app.html">深入洞察 →</a>
  </div>
  <div id="toast"></div>
</div>

<script>
/* ===================== 数据层（与 app.html 完全互通） ===================== */
const LS_ARCHIVE = 'trf_archive';
const LS_PROFILE = 'trf_profile';
const LS_AI = 'trf_ai_config_v1';
const BRAND_PROFILES = {
  'DeepSeek': { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
  'OpenAI':   { baseUrl: 'https://api.openai.com/v1',  model: 'gpt-4o-mini' },
  'Gemini':   { baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai/', model: 'gemini-2.0-flash' }
};

let topic = '';        // 当前主题
let rounds = [];       // 多轮问答 [{q, a}] —— AI 一直追问，直到用户按「整合出洞察」
let caps = {};         // 三类深化对话 {'理清': {q, a, at}, ...} —— 按类别单独显示，保存后叠加进主回答
let capOpen = '';      // 当前展开待回答的类别
let integrating = false;
let qTopic = '';       // 出题时的主题（用于判断主题是否被改 → 决定重出题还是返回答题）
const CAPS = ['理清', '质疑', '查证'];

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('trf_theme', next); } catch(e){}
}
function getAI(){
  let cfg; try { cfg = JSON.parse(localStorage.getItem(LS_AI)) || {}; } catch(e){ cfg = {}; }
  const brand = cfg.brand || 'DeepSeek';
  const profile = BRAND_PROFILES[brand] || BRAND_PROFILES['DeepSeek'];
  return { brand, apiKey: cfg.apiKey || '', baseUrl: cfg.baseUrl || profile.baseUrl, model: cfg.model || profile.model };
}
function loadArchive(){ try { return JSON.parse(localStorage.getItem(LS_ARCHIVE)) || []; } catch(e){ return []; } }
function saveArchive(list){ localStorage.setItem(LS_ARCHIVE, JSON.stringify(list)); }

async function aiCall(prompt, attempt = 1){
  const cfg = getAI();
  if (!cfg.apiKey) return null;
  const url = cfg.baseUrl.replace(/\/$/, '') + '/chat/completions';
  const maxAttempts = 4;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: cfg.model, messages: [{ role:'user', content: prompt }], temperature: 0.6, max_tokens: 700 })
    });
    if (!res.ok){
      if (attempt < maxAttempts && [503,502,500,429].includes(res.status)){
        await new Promise(r => setTimeout(r, 250 * Math.pow(2, attempt)));
        return aiCall(prompt, attempt + 1);
      }
      return null;
    }
    return (await res.json()).choices[0].message.content;
  } catch(e){ return null; }
}
function parseJSON(text){
  if (!text) return null;
  try { const m = text.match(/\{[\s\S]*\}/); if (!m) return null; return JSON.parse(m[0]); } catch(e){ return null; }
}

function backToQA(){

/* 步骤条：cur = 0 写下来 / 1 想清楚 / 2 已沉淀 */
function stepGo(cur){
  const bar = $('stepsBar'); if (!bar) return;
  bar.style.display = 'flex';
  const nodes = Array.prototype.slice.call(bar.querySelectorAll('.p-node'));
  nodes.forEach((n, i) => {
    n.classList.toggle('active', i === cur);
    n.classList.toggle('done', i < cur);
    // 已在流程中（答题/沉淀）时，「写下来」可点回退；沉淀为终态不回退
    const canBack = i < cur && cur < 2;
    n.classList.toggle('clickable', canBack);
    n.onclick = canBack ? function(){ if (i === 0) renderInputStage(); } : null;
    n.title = canBack ? '回看 / 修改这一步' : '';
  });
  bar.dataset.progress = cur + 1;
}

async function startThink(){
  topic = ($('topicInput').value || '').trim();
  if (topic.length < 4) { toast('再多写几个字，Transform 才能出好题'); return; }
  const cfg = getAI();
  if (!cfg.apiKey) { toast('请先在设置里配置 API Key 再开始'); return; }
  const btn = $('startBtn');
  btn.classList.add('loading'); btn.disabled = true; btn.textContent = 'Transform 正在出题…';
  // 出 1 题
  let q = null;
  for (let attempt = 0; attempt < 3 && !q; attempt++){
    const r = await aiCall(
      `主题：「${topic}」\n\n任务：基于这个主题，抛 1 个启发式问题，帮助用户想清楚这件事。\n严格要求：\n1. 简短（10-25 字）、单一（一次只问一件事）、精确\n2. 直接问要害，不绕弯\n3. 严格按 JSON 输出：\n{"q":"问题"}`
    );
    const d = parseJSON(r);
    if (d && d.q && d.q.trim()) q = d.q.trim().slice(0, 60);

/* —— 三类深化对话：点按钮 → 出该类问题卡，用户只答该卡；保存后叠加进主回答 + 按类别单独显示 —— */
const CAP_PROMPTS = {
  '理清': '帮用户把刚才写的散乱想法重新组织，找出头绪。提出 1-2 个问题，指向关联或可能的盲点，让用户自己回答。只问问题，不下结论。',
  '质疑': '苏格拉底式挑战。提出 1-2 个尖锐问题，挑战用户的现有思考，让用户自己回答。只问问题，不给答案。',
  '查证': '提出 1-2 个能用事实、原则或案例检验用户判断的问题，让用户自己去找依据。只问问题，不替用户做判断。'
};
const LOCAL_CAP_Q = {   // AI 不可用 → 本地固定模板（长在真实主题上，不编造智能感）
  '理清': () => `关于「${topic}」，你刚才写的哪一点最接近你的真实想法？哪一点其实你自己也没想透？`,
  '质疑': () => `如果有人说「${topic}」这件事你想反了，你会拿什么证据反驳？你现在的判断，最脆弱的一环是什么？`,
  '查证': () => `「${topic}」这件事上，有没有一个具体的事实或例子，能检验你刚才的判断是对是错？`
};

async function openCap(cap, btn){
  if (caps[cap]){ capOpen = capOpen === cap ? '' : cap; renderCaps(); return; }
  if (!rounds.some(r => r.a.trim())){ toast('先写下你的思考'); return; }
  btn.classList.add('loading');
  const ctx = rounds.map((r, i) => `问题${i + 1}：${r.q}\n用户回答${i + 1}：${r.a}`).join('\n');
  let q = '';
  try {
    const r = await aiCall(
      `主题：「${topic}」\n\n目前的问答：\n${ctx}\n\n${CAP_PROMPTS[cap]}\n\n【硬性要求】只输出你要问用户的问题（1-2 个，合计不超过 80 字），直接输出问题本身，不要寒暄、不要标题、不要给答案。`
    );
    if (r) q = r.trim().slice(0, 200);
  } catch(e) {}
  btn.classList.remove('loading');
  if (!q) q = LOCAL_CAP_Q[cap]();
  caps[cap] = { q, a: '', at: null };
  capOpen = cap;
  renderCaps();
}

function renderCaps(){
  const box = $('qAiResult');
  const parts = [];
  CAPS.forEach(c => {
    const item = caps[c]; if (!item) return;
    const open = capOpen === c && !item.at;
    parts.push(`
      <div class="cap-card" data-cap="${c}">
        <span class="ai-tag">Transform · ${c}${item.at ? ' · 已叠加 ✓' : ''}</span>
        <div class="cap-q">${escapeHtml(item.q).replace(/\n/g, '<br>')}</div>
        ${item.at
          ? `<div class="cap-ans">${escapeHtml(item.a)}</div>`
          : (open ? `
            <textarea class="cap-input" id="capInput" placeholder="按照上面的问题写下你的思考——这里只回答这一条，不会带上你之前的内容…"></textarea>
            <div class="cap-actions">
              <button class="btn btn-primary" onclick="saveCap('${c}')">保存修订</button>
              <button class="btn btn-ghost" onclick="cancelCap()">取消</button>
            </div>` : '')}
      </div>`);
  });
  box.innerHTML = parts.join('');
  box.classList.toggle('show', parts.length > 0);
}

function saveCap(cap){
  const item = caps[cap]; if (!item) return;
  const ta = $('capInput');
  const v = ((ta && ta.value) || '').trim();
  if (!v){ toast('先回答上面的问题再保存'); return; }
  item.a = v; item.at = new Date().toISOString();
  // 直接叠加到最初的输入答案中（带类别前缀；整合时也按类别单独考虑）
  const cur = rounds[rounds.length - 1];
  cur.a = (cur.a.trim() ? cur.a.replace(/\s+$/, '') + '\n\n' : '') + '【' + cap + '】' + v;
  const mainTa = $('qa' + (rounds.length - 1));
  if (mainTa) mainTa.value = cur.a;
  capOpen = '';
  renderCaps();
  refreshCapBtns();
  toast('已叠加到你的回答，并归入「' + cap + '」✓');
}
function cancelCap(){ capOpen = ''; renderCaps(); }
function refreshCapBtns(){
  document.querySelectorAll('.q-ai-row .ai-btn-cap').forEach(b => {
    const c = b.textContent.replace(' ✓', '').trim();

async function finishThink(){

  if (!rounds.some(r => r.a.trim())) { toast('先写下你的回答'); return; }

    rounds.map((r, i) => `问题${i + 1}：${r.q}\n用户回答${i + 1}：${r.a.trim() || '（未填）'}`).join('\n\n') +
    (CAPS.some(c => caps[c] && caps[c].at) ? '\n\n三类深化对话（Transform 问 → 用户答）：\n' +
      CAPS.filter(c => caps[c] && caps[c].at).map(c => `[${c}] ${caps[c].q}\n→ ${caps[c].a}`).join('\n') : '');

  let essence = null;
  for (let attempt = 0; attempt < 3 && !essence; attempt++){
    const r = await aiCall(
      `主题：「${topic}」\n\n用户在多轮问答中的全部输入：\n${qaPairs}\n\n任务：同等考虑以上所有输入——每一轮问答的回答，以及理清/质疑/查证三类对话的回答——整合出两个产出（严格按 JSON）：\n- nature（现象本质）：这些现象背后的本质是……（一句话，15-40字）\n- newInsight（新洞察）：我们对这个问题的新洞察和认知是……（一句话，15-40字）\n\n格式：\n{"nature":"...","newInsight":"..."}`
    );

    if (d && (d.nature || d.newInsight)){
      essence = { nature: (d.nature || '').trim(), insight: (d.newInsight || '').trim() };
    }
  }
  if (!essence){
    integrating = false;
    btn.classList.remove('loading'); btn.disabled = false; btn.textContent = '让 Transform整合出洞察 →';
    toast('Transform 整合失败，请稍后再试');
    return;
  }
  const capEntries = CAPS.filter(c => caps[c] && caps[c].at)
    .map(c => ({ cap: c, text: caps[c].q, answer: caps[c].a, at: caps[c].at }));
  // 存入「成长资产 · 洞察」（与 app.html complete() 的条目格式一致；多轮问答即多题数组）
  const session = {
    id: 's_' + Date.now(),
    createdAt: new Date().toISOString(),
    scenario: topic,
    notes: [],
    groups: [],
    insightQuestions: rounds.map(r => r.q),
    insightAnswers: rounds.map(r => r.a),
    insightPersonalView: '',
    essence,
    confirmed: false,
    impact: 0,
    effort: 0,
    scene: '',
    expectedOutcome: '',
    nearScenario: null,
    farScenario: null,
    nearFeedback: null,
    farFeedback: null,
    resourcesPlan: null,
    nearResourcesPlan: null,
    farResourcesPlan: null,
    identity: '',
    insightAiHelps: [capEntries],
    insightRevisions: [capEntries.map(e => ({ text: e.answer, at: e.at }))],
    tags: [],
    completedAt: new Date().toISOString(),
    source: 'think'
  };
  const archive = loadArchive();
  archive.unshift(session);
  saveArchive(archive);
  integrating = false;
  renderInsightResult(session);
}

/* —— 洞察卡片：竖版 4:3 图片（Canvas 绘制，可保存 PNG）——
   内容：时间戳 · 用户的问题（主题）· 现象背后的本质 · 新洞察。 */
function irWrapText(ctx, text, maxWidth, maxLines){
  const lines = []; let line = '';
  for (const ch of String(text || '')){
    if (ch === '\n'){ lines.push(line); line = ''; continue; }
    if (ctx.measureText(line + ch).width > maxWidth){ lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  if (lines.length > maxLines){
    let last = lines[maxLines - 1];
    while (last && ctx.measureText(last + '…').width > maxWidth) last = last.slice(0, -1);
    return { lines: lines.slice(0, maxLines - 1).concat([last + '…']), cut: true };
  }
  return { lines, cut: false };
}
function irSparkle(ctx, x, y, r){
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.quadraticCurveTo(x, y, x, y + r); ctx.quadraticCurveTo(x, y, x - r, y);
  ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
}
function irRoundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawInsightCard(session){
  const cv = document.getElementById('insightCardCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const W = 900, H = 1200, PX = 70, CW = W - PX * 2;
  const FONT = "'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif";
  const C = { paper:'#FAF8F2', ink:'#1F2D27', sub:'#8A938D', green:'#0E6B50', line:'#E5E1D5', card:'#FFFFFF', cardLine:'#E8E4D8' };
  // 底色
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  // 右上装饰星光
  ctx.fillStyle = 'rgba(14,107,80,.14)';
  irSparkle(ctx, W - 92, 96, 26); irSparkle(ctx, W - 140, 140, 13);
  // 头部：品牌 + 时间戳
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = C.green; ctx.font = '800 26px ' + FONT; ctx.textAlign = 'left';
  ctx.fillText('Transform · 每日洞察', PX, 92);
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const ts = now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日 ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  ctx.fillStyle = C.sub; ctx.font = '500 21px ' + FONT; ctx.textAlign = 'right';
  ctx.fillText(ts, W - PX, 92);
  ctx.textAlign = 'left';
  // 用户的问题（主题）
  ctx.fillStyle = C.sub; ctx.font = '800 20px ' + FONT;
  ctx.fillText('用 户 的 问 题', PX, 168);
  ctx.fillStyle = C.ink; ctx.font = '800 37px ' + FONT;
  const t1 = irWrapText(ctx, topic, CW, 3);
  t1.lines.forEach((l, i) => ctx.fillText(l, PX, 224 + i * 52));
  // 分隔虚线
  ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.setLineDash([2, 10]);
  ctx.beginPath(); ctx.moveTo(PX, 372); ctx.lineTo(W - PX, 372); ctx.stroke(); ctx.setLineDash([]);
  // 卡 A：现象背后的本质（白卡）
  irRoundRect(ctx, PX, 404, CW, 296, 26);
  ctx.fillStyle = C.card; ctx.fill(); ctx.strokeStyle = C.cardLine; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = C.green;
  irSparkle(ctx, PX + 44, 462, 13);
  ctx.font = '800 22px ' + FONT;
  ctx.fillText('现象背后的本质', PX + 72, 470);
  ctx.fillStyle = '#33413B'; ctx.font = '600 27px ' + FONT;
  const t2 = irWrapText(ctx, session.essence.nature || '（未生成）', CW - 88, 4);
  t2.lines.forEach((l, i) => ctx.fillText(l, PX + 44, 524 + i * 42));
  // 卡 B：新洞察（深绿卡 · 白字）
  irRoundRect(ctx, PX, 728, CW, 356, 26);
  ctx.fillStyle = C.green; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  irSparkle(ctx, PX + 44, 786, 13);
  ctx.font = '800 22px ' + FONT;
  ctx.fillText('新 洞 察', PX + 72, 794);
  ctx.fillStyle = '#FFFFFF'; ctx.font = '800 31px ' + FONT;
  const t3 = irWrapText(ctx, session.essence.insight || '（未生成）', CW - 88, 5);
  t3.lines.forEach((l, i) => ctx.fillText(l, PX + 44, 850 + i * 46));
  // 页脚
  ctx.strokeStyle = C.line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(PX, 1128); ctx.lineTo(W - PX, 1128); ctx.stroke();
  ctx.fillStyle = C.sub; ctx.font = '500 20px ' + FONT; ctx.textAlign = 'center';
  ctx.fillText('Transform · 想清楚，做得到', W / 2, 1166);
  ctx.textAlign = 'left';
}
function downloadInsightCard(){
  const cv = document.getElementById('insightCardCanvas');
  if (!cv) return;
  const a = document.createElement('a');
  a.download = 'transform-insight-' + new Date().toISOString().slice(0, 10) + '.png';
  a.href = cv.toDataURL('image/png');
  a.click();
  toast('洞察卡片已保存为图片 ✓');
}

/* ===================== 初始化 ===================== */
// 初始化：支持 ?topic= 预填主题（来自首页今日卡片）
(function(){
  const params = new URLSearchParams(location.search);
  const prefill = (params.get('topic') || '').trim();
  if (prefill){
    topic = prefill;
    // 预填后自动开始（跳过输入步骤，直接进入 AI 出题）
    const cfg = getAI();
    if (cfg.apiKey){
      startThinkWithTopic(prefill);
      return;
    }
  }
  renderInputStage();
})();

async function startThinkWithTopic(t){
  topic = t;
  // 出 1 题
  let q = null;
  for (let attempt = 0; attempt < 3 && !q; attempt++){
    const r = await aiCall(
      `主题：「${topic}」\n\n任务：基于这个主题，抛 1 个启发式问题，帮助用户想清楚这件事。\n严格要求：\n1. 简短（10-25 字）、单一（一次只问一件事）、精确\n2. 直接问要害，不绕弯\n3. 严格按 JSON 输出：\n{"q":"问题"}`
    );
    const d = parseJSON(r);
    if (d && d.q && d.q.trim()) q = d.q.trim().slice(0, 60);
  }
  if (!q){
    renderInputStage();
    toast('Transform 暂时出不了题，请稍后再试');
    return;
  }
  qTopic = topic;
  rounds = [{ q, a: '' }]; caps = {}; capOpen = '';
  renderQuestionStage();
}
