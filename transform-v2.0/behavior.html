<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>成长资产 · 改变 · Transform</title>
<style>
  :root {
    --bg: #F6F5F1;
    --surface: #FFFFFF;
    --ink: #1E2A26;
    --ink-2: #5A6B64;
    --ink-3: #93A09A;
    --line: #E4E8E3;
    --green: #0E6B50;
    --green-deep: #0E6B50;
    --green-2: #0A5A42;
    --green-soft: #E3F3EC;
    --green-50: #ECF8F3;
    --green-light: #BFE9D8;
    --amber: #D97B29;
    --amber-soft: #FBF0E2;
    --coral: #C05B3C;
    --coral-soft: #F9EBE5;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow: 0 2px 8px rgba(30,42,38,.05), 0 12px 32px rgba(30,42,38,.07);
    --shadow-hover: 0 6px 16px rgba(30,42,38,.09), 0 26px 60px rgba(30,42,38,.14);
    --touch: 44px;
    --ease: cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"] {
    --bg: #13171A;
    --surface: #1E2422;
    --ink: #E8EFEB;
    --ink-2: #A9B8B2;
    --ink-3: #6E7E78;
    --line: #2C3633;
    --green: #34D29E;
    --green-deep: #34D29E;
    --green-2: #2BBB8A;
    --green-soft: #16302A;
    --green-50: #10221D;
    --green-light: #1E4A3E;
    --amber: #E8943F;
    --amber-soft: #2E2417;
    --coral: #D9714F;
    --coral-soft: #2E1E18;
    --shadow: 0 2px 8px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.55);
    --shadow-hover: 0 6px 16px rgba(0,0,0,.4), 0 26px 60px rgba(0,0,0,.6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background:
      radial-gradient(900px 420px at 100% -8%, rgba(29,158,117,.10), transparent 60%),
      radial-gradient(720px 380px at -10% 4%, rgba(217,123,41,.08), transparent 55%),
      var(--bg);
    color: var(--ink); line-height: 1.62; min-height: 100vh;
  }
  .wrap { max-width: 600px; margin: 0 auto; padding: 22px 20px 110px; }

  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  /* ===== R-11：统一全局导航（与 think/punch/app/act 逐字一致） ===== */
  .topbar .back {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none;
    font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 999px; transition: all .2s; flex-shrink: 0;
  }
  .topbar .back:hover { background: var(--surface-2); color: var(--ink); }
  .gnav {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
    padding: 4px; border-radius: 999px; background: var(--surface-2);
    overflow-x: auto; justify-content: center; scrollbar-width: none;
  }
  .gnav::-webkit-scrollbar { display: none; }
  .gnav .gn-item {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    text-decoration: none; white-space: nowrap; transition: all .2s;
    flex-shrink: 0;
  }
  .gnav .gn-item:hover { color: var(--green); background: var(--green-soft); }
  .gnav .gn-item.on { background: var(--surface); color: var(--green-deep); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(14,107,80,.26), 0 1px 4px rgba(30,42,38,.08); }
  @media (max-width: 560px) {
    .gnav { gap: 4px; }
    .gnav .gn-item { padding: 6px 11px; font-size: 12px; }
  }
  .tb-theme { padding: 9px 12px !important; flex-shrink: 0; }
  .tb-theme .t-light, .tb-theme .t-dark { font-size: 15px; line-height: 1; }
  .theme-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); font-family: inherit;
    transition: all .2s;
  }
  .theme-toggle:hover { color: var(--green-deep); border-color: var(--green); }
  .theme-toggle .t-dark { display: none; }
  [data-theme="dark"] .theme-toggle .t-light { display: none; }
  [data-theme="dark"] .theme-toggle .t-dark { display: inline; }

  .page-head {
    margin: 14px 0 22px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
    flex-wrap: wrap;
  }
  .page-head .title-block { display: flex; flex-direction: column; }
  h1 { font-size: 27px; font-weight: 800; letter-spacing: -.5px; }
  .page-sub { font-size: 14px; color: var(--ink-2); margin-top: 6px; }

  .arch-toggle {
    display: inline-flex; align-items: center; padding: 4px;
    border-radius: 999px; background: var(--surface-2);
    border: 1px solid var(--line); flex-shrink: 0;
  }
  .arch-toggle a {
    display: inline-flex; align-items: center; padding: 7px 16px;
    border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--ink-2); text-decoration: none; transition: all .2s;
  }
  .arch-toggle a.on { background: var(--surface); color: var(--green-deep); box-shadow: inset 0 0 0 1px rgba(14,107,80,.26), 0 1px 3px rgba(30,42,38,.07); }
  .arch-toggle a:not(.on):hover { color: var(--green-deep); }

  /* 档案区域 */
  .archive-section { margin-top: 32px; }
  .archive-section.cog .archive-icon {
    background: linear-gradient(135deg, var(--green-soft), #D6EFE2); color: var(--green-deep);
    box-shadow: 0 4px 14px rgba(29,158,117,.18);
  }
  .archive-section.beh .archive-icon {
    background: linear-gradient(135deg, var(--amber-soft), #F8E4C5); color: var(--amber);
    box-shadow: 0 4px 14px rgba(217,123,41,.18);
  }
  .archive-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; line-height: 1.3; }
  .archive-head p { font-size: 13px; color: var(--ink-3); margin-top: 3px; line-height: 1.5; }

  /* 紧凑统计条 */
  .stat-strip {
    display: flex; flex-wrap: wrap; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin: 18px 0 6px;
    box-shadow: 0 1px 2px rgba(30,42,38,.03);
  }
  .stat-strip .item {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--ink-2); font-weight: 600;
  }
  .stat-strip .num { font-size: 16px; font-weight: 800; color: var(--green-deep); }
  .stat-strip .sep { color: var(--line); margin: 0 2px; }

  /* 可展开卡（accordion） */
  .expand-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    margin-bottom: 12px; overflow: hidden;
    transition: border-color .25s, box-shadow .25s;
  }
  .expand-card.open { box-shadow: 0 4px 16px rgba(30,42,38,.06); }
  .expand-card.open.cog { border-color: rgba(29,158,117,.25); }
  .expand-card.open.beh { border-color: rgba(217,123,41,.25); }
  .expand-head {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 16px 20px;
    background: transparent; border: none; cursor: pointer;
    text-align: left; font-family: inherit; color: inherit;
    transition: background .2s;
  }
  .expand-head:hover { background: var(--bg); }
  .expand-icon {
    width: 40px; height: 40px; border-radius: 11px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 19px; flex-shrink: 0;
    background: var(--green-soft); color: var(--green-deep);
  }
  .expand-card.beh .expand-icon { background: var(--amber-soft); color: var(--amber); }
  .expand-card.open.cog .expand-icon { background: var(--green); color: #fff; }
  .expand-card.open.beh .expand-icon { background: var(--amber); color: #fff; }
  .expand-title { flex: 1; min-width: 0; }
  .expand-name { font-size: 15.5px; font-weight: 700; color: var(--ink); }
  .expand-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.4; }
  .expand-count {
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); flex-shrink: 0;
  }
  .expand-card.open.cog .expand-count { background: var(--green-soft); color: var(--green-deep); border-color: rgba(29,158,117,.2); }
  .expand-card.open.beh .expand-count { background: var(--amber-soft); color: #8B5A1B; border-color: rgba(217,123,41,.2); }
  .expand-chevron { color: var(--ink-3); flex-shrink: 0; transition: transform .3s var(--ease); }
  .expand-card.open .expand-chevron { transform: rotate(180deg); color: var(--green-deep); }
  .expand-card.beh.open .expand-chevron { color: var(--amber); }
  /* body 网格 0fr→1fr 平滑展开 */
  .expand-body {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .35s cubic-bezier(.16,1,.3,1);
  }
  .expand-card.open .expand-body { grid-template-rows: 1fr; }
  .expand-body > .inner { overflow: hidden; }
  .expand-card.open .expand-body > .inner { padding: 4px 20px 20px; }
  .expand-empty {
    padding: 28px 20px; text-align: center; color: var(--ink-3); font-size: 13.5px;
  }
  .expand-empty a { color: var(--green); text-decoration: none; font-weight: 700; }

  /* 回收箱 */
  .archive-section.trash .archive-icon { background: linear-gradient(135deg, #ECEFF1, #D7DBDF); color: #5b6b73; box-shadow: 0 4px 14px rgba(90,107,115,.16); }
  .expand-card.trash-card.open { border-color: rgba(90,107,115,.25); }
  .expand-card.trash-card .expand-icon { background: #ECEFF1; color: #5b6b73; }
  .expand-card.trash-card.open .expand-icon { background: #5b6b73; color: #fff; }
  .expand-card.trash-card.open .expand-count { background: #ECEFF1; color: #5b6b73; border-color: rgba(90,107,115,.2); }
  .expand-card.trash-card.open .expand-chevron { color: #5b6b73; }

  /* 归并：次数徽章 + 折叠元信息 */
  .fold-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .fold-count { font-size: 11.5px; font-weight: 700; color: var(--green-deep); background: var(--green-soft); border: 1px solid rgba(29,158,117,.2); border-radius: 999px; padding: 1px 8px; }

  /* 归并后的单次出现 */
  .occ { padding: 12px 0; border-top: 1px solid var(--line); }
  .occ:first-child { border-top: none; padding-top: 4px; }
  .occ-date { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
  .occ .i-row, .occ .m-framework, .occ .m-changed { font-size: 13.5px; color: var(--ink); line-height: 1.6; margin: 3px 0; }
  .occ .i-row b, .occ .m-changed b { color: var(--ink-2); font-weight: 700; margin-right: 4px; }

  /* 回收箱条目 */
  .trash-toolbar { margin-bottom: 12px; }
  .trash-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .trash-item:first-child { border-top: none; }
  .ti-type { display: inline-block; font-size: 11px; font-weight: 700; color: var(--ink-3); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-bottom: 4px; }
  .ti-title { font-size: 14px; font-weight: 700; color: var(--ink); line-height: 1.4; }
  .ti-sub { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
  .ti-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .mini.del { color: #c0392b; border-color: rgba(192,57,43,.3); }
  .mini.del:hover { background: rgba(192,57,43,.08); }

  /* 身份英雄卡 */
  .identity-card {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, #0E6B50 0%, #1D9E75 55%, #2BBB8A 100%);
    border-radius: var(--radius-lg); padding: 24px 22px; color: #fff;
    box-shadow: 0 12px 34px rgba(14,107,80,.32); margin-bottom: 14px;
    animation: rise .5s cubic-bezier(.16,1,.3,1);
  }
  .identity-card::after { content:""; position:absolute; right:-50px; top:-50px; width:180px; height:180px; border-radius:50%; background: rgba(255,255,255,.10); }
  .identity-card .k { font-size: 12px; opacity: .8; font-weight: 700; letter-spacing: 1.2px; }
  .identity-card .v { font-size: 18px; font-weight: 800; margin-top: 8px; line-height: 1.5; position: relative; }
  .identity-card .v em { font-style: normal; border-bottom: 2px solid rgba(255,255,255,.55); padding-bottom: 2px; }
  .identity-card .count {
    font-size: 12px; opacity: .85; margin-top: 12px; display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.14); padding: 6px 12px; border-radius: 999px;
  }
  .identity-empty {
    background: var(--green-soft); color: var(--green-deep); padding: 20px 22px;
    border-radius: var(--radius-md); font-size: 14px; margin-bottom: 14px;
    display: flex; gap: 12px; align-items: flex-start; line-height: 1.7; border: 1px solid #CFE9DC;
  }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 10px; text-align: center; box-shadow: var(--shadow); }
  .stat .num { font-size: 22px; font-weight: 800; color: var(--green-deep); letter-spacing: -.5px; }
  .stat .lbl { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
  .section-title svg { color: var(--green); flex-shrink: 0; }

  /* 认知模型卡 */
  .model { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 20px 16px; margin-bottom: 14px; box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.16,1,.3,1); }
  .model .m-scenario { font-size: 13px; font-weight: 700; color: var(--green-deep); }
  .model .m-framework {
    position: relative; font-size: 16px; font-weight: 800; color: var(--ink); line-height: 1.7;
    background: var(--green-50); border-left: 4px solid var(--green);
    padding: 14px 16px 14px 18px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin-top: 10px;
  }
  .model .m-changed { font-size: 13.5px; color: var(--ink-2); margin-top: 10px; line-height: 1.6; }
  .model .m-date { font-size: 12px; color: var(--ink-3); margin-top: 12px; }

  /* 洞察卡 */
  .insight { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); animation: rise .5s cubic-bezier(.16,1,.3,1); }
  .insight .i-scenario { font-size: 14px; font-weight: 700; color: var(--ink); }
  .insight .i-row { margin-top: 10px; font-size: 13.5px; line-height: 1.7; color: var(--ink-2); }
  .insight .i-row b { color: var(--green-deep); font-size: 12px; display: inline-block; min-width: 44px; }
  .asset-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .tag-chip { font-size: 11.5px; font-weight: 700; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); padding: 3px 10px; border-radius: 999px; }
  .filter-sep { display: inline-block; width: 1px; height: 22px; background: var(--line); margin: 4px 4px; }
  .filter-search {
    flex: 1; min-width: 120px; max-width: 220px;
    padding: 7px 12px; font-family: inherit; font-size: 13px;
    color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 999px;
  }
  .filter-search:focus { outline: none; border-color: var(--green); }
  .insight .i-date { font-size: 12px; color: var(--ink-3); margin-top: 12px; }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .filter-chip { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; transition: all .18s; }
  .filter-chip.on { color: var(--green-deep); background: var(--green-soft); border-color: var(--green); }

  /* 行为实验卡 */
  .action {
    position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 20px 20px 14px; margin-bottom: 14px; box-shadow: var(--shadow);
    transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, border-color .25s;
    animation: rise .5s cubic-bezier(.16,1,.3,1);
    display: flex; flex-direction: column; min-width: 0;
  }
  .action:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: #CDE6DA; }
  .action .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .action .date { font-size: 12.5px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px; }
  .status-chip { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .status-chip.active { color: var(--green-deep); background: var(--green-soft); }
  .status-chip.graduated { color: #7A5E16; background: var(--amber-soft); }
  .status-chip.paused { color: var(--ink-3); background: var(--bg); }
  .action .input { font-size: 15px; font-weight: 700; color: var(--ink-2); line-height: 1.5; }
  .action .plan-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
    color: var(--green-deep); background: var(--green-soft); border: 1px solid #CFE9DC;
    padding: 4px 11px; border-radius: 999px; margin-top: 8px; align-self: flex-start;
  }
  .action .tiny {
    position: relative; font-size: 15px; font-weight: 800; color: var(--green-deep);
    background: linear-gradient(180deg, var(--green-soft), #F1FAF5); border-left: 4px solid var(--green);
    padding: 12px 14px 12px 16px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; line-height: 1.6; margin-top: 10px;
  }
  .action .a-source { font-size: 12px; color: var(--ink-3); margin-top: 10px; line-height: 1.6; }
  .action .a-source b { color: var(--green-deep); }
  .action .a-reflect { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--ink-2); line-height: 1.6; }
  .action .a-reflect b { color: var(--amber); font-size: 12px; }
  .action .anchor { font-size: 13px; color: var(--ink-2); margin-top: 10px; line-height: 1.6; }
  .action .meta { display: flex; gap: 14px; font-size: 12px; color: var(--ink-3); margin-top: 12px; flex-wrap: wrap; }
  .action .foot { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; }
  .mini {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line);
    padding: 9px 8px; min-height: var(--touch); border-radius: 10px; cursor: pointer; transition: all .18s; font-family: inherit; text-decoration: none;
  }
  .mini:hover { color: var(--green-deep); border-color: var(--green); background: var(--green-soft); }
  .mini.solid { background: var(--green-deep); color: #fff; border-color: var(--green-deep); }
  .mini.solid:hover { background: var(--green-2); }

  /* 折叠卡片：默认只露标题，点击展开详情 */
  .fold-card { cursor: pointer; }
  .fold-head { position: relative; }
  .fold-head::after {
    content: "";
    position: absolute; right: 18px; top: 50%;
    width: 7px; height: 7px;
    border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3);
    transform: translateY(-70%) rotate(45deg);
    transition: transform .25s var(--ease);
  }
  .fold-card.open .fold-head::after { transform: translateY(-30%) rotate(-135deg); }
  .model.fold-card, .insight.fold-card, .action.fold-card { transition: border-color .2s, box-shadow .2s; }
  .model.fold-card:hover, .insight.fold-card:hover, .action.fold-card:hover { border-color: var(--green-light); }
  .action.fold-card:hover { transform: none; box-shadow: var(--shadow); border-color: #CDE6DA; }
  .fold-body { display: none; }
  .fold-card.open .fold-body { display: block; animation: rise .25s var(--ease); }

  /* ===== R-15：二级展开（保证单卡展开 ≤ 一屏） ===== */
  .more-occ {
    margin-top: 12px; width: 100%; padding: 11px 14px; border-radius: 10px;
    background: var(--surface-2); border: 1px dashed var(--line-2); color: var(--ink-2);
    font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .more-occ:hover { border-color: var(--green); color: var(--green-deep); background: var(--green-soft); }
  .occ-rest { margin-top: 4px; }
  .occ-sub { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .occ-sub > summary {
    display: flex; align-items: center; gap: 6px; list-style: none; cursor: pointer;
    font-size: 13px; font-weight: 700; color: var(--green-deep);
  }
  .occ-sub > summary::-webkit-details-marker { display: none; }

<script>
/* ===================== 数据层 ===================== */
const LS_ARCHIVE = 'trf_archive';
const LS_ACTIONS = 'trf_actions';
const LS_PROFILE = 'trf_profile';
const LS_AI = 'trf_ai_config_v1';
const LS_PATTERNS = 'trf_patterns';
const BRAND_PROFILES = {
  'DeepSeek': { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
  'OpenAI':   { baseUrl: 'https://api.openai.com/v1',  model: 'gpt-4o-mini' },

};

function $(id){ return document.getElementById(id); }
/* P1-7：锚点数据可能是完整句（「在我…之后」），展示模板已带包裹，先剥离避免「在我 在我…之后 之后」 */
async function aiCall(prompt, attempt = 1){
  const cfg = getAI();
  if (!cfg.apiKey){ toast('配置 API Key 后，Transform AI 才能帮你跨时间发现模式'); return null; }
  const url = cfg.baseUrl.replace(/\/$/, '') + '/chat/completions';
  const maxAttempts = 5;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: cfg.model, messages: [{ role:'user', content: prompt }], temperature: 0.5, max_tokens: 1200 })
    });
    if (!res.ok){
      if (attempt < maxAttempts && [503,502,500,429].includes(res.status)){
        await new Promise(r => setTimeout(r, 250 * Math.pow(2, attempt)));
        return aiCall(prompt, attempt + 1);
      }
      throw new Error('AI 请求失败：' + res.status);
    }
    return (await res.json()).choices[0].message.content;
  } catch(e){
    if (attempt < maxAttempts && ((e.message||'').includes('Failed to fetch') || (e.message||'').includes('aborted'))){
      await new Promise(r => setTimeout(r, 250 * Math.pow(2, attempt)));
      return aiCall(prompt, attempt + 1);
    }
    toast('AI 暂时不可用，请稍后重试');
    return null;
  }
}

/* ===================== 首屏/空状态/页脚 ===================== */
function renderEmptyState(){
  const box = $('emptyOnboard'); if (!box) return;
  const any = hasAnyAsset();
  const secs = [$('libSection'), $('modelsSection'), $('pageFoot')];
  if (any){
    box.setAttribute('hidden', '');

/* ===================== 展开 / 收起 ===================== */
/* R-15：二次展开「更早的记录」 */
/* ===================== R-16 · UI 状态持久化（trf_ui：展开态 / 滚动位置） ===================== */
const TRF_UI_KEY = 'trf_ui';
let sectionOpen = {};   // { 'sec:<name>' | 'fold:<id>': true }
let uiScroll = 0;

(function loadUIState(){
  let u = {};
  try { u = JSON.parse(localStorage.getItem(TRF_UI_KEY) || '{}') || {}; } catch(e){ u = {}; }

// 渲染前：把 DOM 上的展开态读入内存（避免重渲染把用户展开的卡折叠回去）
// 渲染后：把内存里的展开态回写到 DOM
// 滚动位置持久化（节流）
let uiScrollTimer = null;
window.addEventListener('scroll', function(){
  if (uiScrollTimer) return;
  uiScrollTimer = setTimeout(function(){
    uiScrollTimer = null;
    uiScroll = window.scrollY || 0;
    saveUIState();

}, { passive: true });

// 按场景标题归并：相同标题合并为一张卡，count 代表出现次数；空标题/默认标题各自独立
/* ===================== 认知模型（复盘产出） ===================== */
function renderModels(){
  const box = $('modelList'); if (!box) return;
  const archive = loadArchive();
  const models = archive.filter(s => (s.mentalModel && s.mentalModel.trim()) || (s.reflection && s.reflection.changed && s.reflection.changed.trim()));
  if (!models.length){
    box.innerHTML = `<div class="expand-empty">还没有沉淀的认知模型。<br>完成一次「每日洞察」并复盘后，你的新认知框架会出现在这里。<br><a href="app.html">去深入洞察 →</a></div>`;
    return;
  }
  captureOpenState();   // R-16
  box.innerHTML = groupByScenario(models).map(g => {
    const n = g.items.length;
    const latest = g.items.slice().sort((a,b)=> new Date(b.reflectedAt||b.completedAt||b.createdAt||0) - new Date(a.reflectedAt||a.completedAt||a.createdAt||0))[0];
    const countBadge = n > 1 ? `<span class="fold-count">产出 ${n} 次</span>` : '';
    // R-15：模型卡同样只展开最近一次
    const mOrdered = g.items.slice().sort((a,b)=> new Date(b.reflectedAt||b.completedAt||b.createdAt||0) - new Date(a.reflectedAt||a.completedAt||a.createdAt||0));
    const occOne = s => {
      const fw = (s.mentalModel || '').trim();
      const changed = (s.reflection && s.reflection.changed || '').trim();
      return `<div class="occ">
        <div class="occ-date">复盘于 ${fmtDate(s.reflectedAt || s.completedAt || s.createdAt)}</div>
        ${fw ? `<div class="m-framework">${escapeHtml(fw)}</div>` : ''}
        ${changed ? `<div class="m-changed"><b>改变了什么：</b>${escapeHtml(changed)}</div>` : ''}
        ${(s.tags || []).length ? `<div class="asset-tags">${s.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        ${assetActions('model', s.id)}
      </div>`;
    };
    const firstOcc = occOne(mOrdered[0]);
    const restN = mOrdered.length - 1;
    const restOcc = mOrdered.slice(1).map(occOne).join('');
    return `<div class="model fold-card" id="mod-${escapeHtml(String(latest.id))}" onclick="toggleFold(this)">
      <div class="fold-head">
        <div class="m-scenario">${escapeHtml(g.scenario)}</div>
        <div class="fold-meta">${countBadge}<span class="m-date">复盘于 ${fmtDate(latest.reflectedAt || latest.completedAt || latest.createdAt)}</span></div>
      </div>
      <div class="fold-body" onclick="event.stopPropagation()">
        <div class="occ-first">${firstOcc}</div>
        ${restN ? `<div class="occ-rest" hidden>${restOcc}</div>
        <button class="more-occ" type="button" onclick="toggleRestOcc(this)">还有 ${restN} 次较早的复盘 · 展开全部</button>` : ''}
      </div>
    </div>`;
  }).join('');
  applyOpenState();   // R-16：渲染后回写展开态
}

/* ===================== 洞察库（含标签过滤与搜索） ===================== */
let insightFilter = '';
let insightSearch = '';
function renderTagFilters(){
  const archive = loadArchive();

function renderInsights(){
  const box = $('insightList'); if (!box) return;

  if (!archive.length){

      return hay.includes(q);

  if (!archive.length){ box.innerHTML = '<div class="expand-empty">没有找到符合当前条件的洞察。</div>'; return; }
  captureOpenState();   // R-16：重渲染前保留用户已展开的卡
  box.innerHTML = groupByScenario(archive).map(g => {
    const n = g.items.length;
    const latest = g.items.slice().sort((a,b)=> new Date(b.completedAt||b.createdAt||0) - new Date(a.completedAt||a.createdAt||0))[0];
    const countBadge = n > 1 ? `<span class="fold-count">出现 ${n} 次</span>` : '';
    // R-15：默认只展开「最近一次」，更早的记录二次展开
    const ordered = g.items.slice().sort((a,b)=> new Date(b.completedAt||b.createdAt||0) - new Date(a.completedAt||a.createdAt||0));
    const occOne = s => {
      const e = s.essence || {};
      const nature = (e.nature || '').trim();
      const insight = (e.insight || '').trim();
      const learned = (s.reflection && s.reflection.learned || '').trim();
      return `<div class="occ">

        ${assetActions('insight', s.id)}

    const firstOcc = occOne(ordered[0]);
    const restN = ordered.length - 1;
    const restOcc = ordered.slice(1).map(occOne).join('');
    return `<div class="insight fold-card" id="ins-${escapeHtml(String(latest.id))}" onclick="toggleFold(this)">
      <div class="fold-head">
        <div class="i-scenario">${escapeHtml(g.scenario)}</div>
        <div class="fold-meta">${countBadge}<span class="i-date">${fmtDate(latest.completedAt || latest.createdAt)}${latest.reflectedAt ? ' · 已复盘' : ''}</span></div>
      </div>
      <div class="fold-body" onclick="event.stopPropagation()">

        <button class="more-occ" type="button" onclick="toggleRestOcc(this)">还有 ${restN} 次较早的记录 · 展开全部</button>` : ''}
      </div>
    </div>`;
  }).join('');
  applyOpenState();   // R-16：渲染后回写展开态
}

/* ===================== 行为实验 ===================== */
let actionFilter = { status: '', tag: '', q: '', time: 'all' };

function renderActions(){
  const actions = loadActions();
  renderActionFilters(actions);
  const box = $('actionList');
  if (!box) return;
  if (!actions.length){
    box.innerHTML = '';   // 空状态由 renderEmptyState 统一承担
    return;
  }
  const filtered = filterActions(actions);
  if (!filtered.length){
    box.innerHTML = `<div class="expand-empty">没有符合当前筛选条件的实验。</div>`;
    return;
  }
  captureOpenState();   // R-16
  box.innerHTML = filtered.map(a => {
    const status = a.status || 'active';
    const statusText = { active: '进行中', graduated: '已毕业', paused: '已暂停' }[status] || status;
    const statusClass = { active: 'active', graduated: 'graduated', paused: 'paused' }[status] || 'paused';
    const lastLog = (a.logs || []).slice(-1)[0];
    const lastDate = lastLog ? fmtDate(lastLog.date) : fmtDate(a.createdAt);
    const N = a.targetDays || 0;
    const totalDone = a.totalDone || 0;
    const plan = a.plan || [];
    const curDay = a.currentDay || 1;
    const curMicro = (plan.length && plan[Math.min(curDay, plan.length) - 1]) ? plan[Math.min(curDay, plan.length) - 1].micro : ((a.tiny && a.tiny.text) || '');
    const microText = status === 'graduated' ? '已完成全部 ' + N + ' 天计划' : (curMicro || '');
    return `<div class="action fold-card" id="act-${escapeHtml(String(a.id))}" onclick="toggleFold(this)">
      <div class="fold-head">
        <div class="row1">
          <span class="date">${lastDate}</span>
          <span class="status-chip ${statusClass}">${statusText}</span>
        </div>
        <div class="input">${escapeHtml(a.input || a.goal || '')}</div>
        ${microText ? `<div class="i-lead">${escapeHtml(microText)}</div>` : ''}
        <div class="fold-meta">
          ${N ? `<span class="plan-pill">${N} 天 · 已完成 ${totalDone}/${N}</span>` : ''}
          <a class="head-use" href="act.html?id=${encodeURIComponent(a.id)}" onclick="event.stopPropagation()">继续做 →</a>
        </div>
      </div>
      <div class="fold-body" onclick="event.stopPropagation()">
        ${a.anchor && a.anchor.after ? `<div class="anchor">锚点：在我 ${escapeHtml(anchorText(a.anchor.after))} 之后</div>` : ''}
        ${(a.sourceInsightId || a.insight || a.result || a.habit || (a.reflection && (a.reflection.changed || ''))) ? `<details class="occ-sub"><summary>来源与复盘</summary><div class="occ-sub-body">
          ${(a.sourceInsightId || a.insight) ? `<div class="a-source"><b>源于洞察：</b>${escapeHtml(String(a.insight || '').replace(/\n+/g, ' · '))}${a.sourceInsightId ? ` <a class="rel-link" href="cognitive.html#ins-${encodeURIComponent(a.sourceInsightId)}">查看那条想法 →</a>` : ''}</div>` : ''}
          ${(a.result || a.habit || (a.reflection && a.reflection.changed)) ? `<div class="a-reflect">
          ${a.result ? `<div><b>结果</b> ${escapeHtml(a.result)}</div>` : ''}
          ${a.habit ? `<div><b>新习惯</b> ${escapeHtml(a.habit)}</div>` : ''}
          ${a.reflection && a.reflection.changed ? `<div><b>改变</b> ${escapeHtml(a.reflection.changed)}</div>` : ''}
        </div>` : ''}
        </div></details>` : ''}
        ${(a.tags || []).length ? `<div class="asset-tags">${a.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="meta">
          <span>连续 ${a.streak || 0} 天</span>

function renderActionFilters(actions){
  const box = $('actionFilters');
  if (!box) return;
  if (!actions.length){ box.innerHTML = ''; return; }
  const tags = [];
  actions.forEach(a => (a.tags || []).forEach(t => { if (t && !tags.includes(t)) tags.push(t); }));
  // 首屏只留 3 个视图 chip
  const viewOpts = [
    { k: '', v: '全部' },
    { k: 'active', v: '进行中' },
    { k: 'graduated', v: '已毕业' }
  ];
  box.innerHTML = viewOpts.map(o =>
    `<button class="filter-chip${actionFilter.status === o.k ? ' on' : ''}" onclick="setActionFilter('status','${o.k}')">${o.v}</button>`).join('');

  const more = $('actionMoreFilters');
  const toggle = $('filterToggleBtn');
  if (toggle) toggle.hidden = false;
  if (!more) return;
  let html = timeChipsHtml(actionFilter.time, "setActionFilter('time'");
  html += `<button class="filter-chip${actionFilter.status === 'paused' ? ' on' : ''}" onclick="setActionFilter('status','${actionFilter.status === 'paused' ? '' : 'paused'}')">只看已暂停</button>`;
  if (tags.length){
    html += '<span class="filter-sep"></span>' +
      '<button class="filter-chip' + (actionFilter.tag ? '' : ' on') + '" onclick="setActionFilter(\'tag\',\'\')">全部标签</button>' +
      tags.map(t => `<button class="filter-chip${actionFilter.tag === t ? ' on' : ''}" onclick="setActionFilter('tag','${String(t).replace(/'/g, "\\'")}')">${escapeHtml(t)}</button>`).join('');
  }
  more.innerHTML = html;
}
// 使用动作：记录这条想法被带去了哪里
function setActionFilter(key, value){
  if (key !== 'q'){ const inp = $('actionSearch'); if (inp && inp.value !== actionFilter.q) inp.value = actionFilter.q || ''; }
  actionFilter[key] = value;
  renderActions();
}
/* ===================== 模式识别 ===================== */
function renderPatterns(){
  const area = $('patternArea');

  try { saved = JSON.parse(localStorage.getItem(LS_PATTERNS)); } catch(e){}
  const pc = $('patternsCount'); if (pc) pc.textContent = (saved && saved.patterns) ? saved.patterns.length : 0;
  const archive = loadArchive(); const actions = loadActions();
  const hasData = archive.length || actions.length;
  if (saved && saved.patterns && saved.patterns.length){
    area.innerHTML = `<div class="pattern-cta">
      <h3>Transform 发现的跨时间模式</h3>
      <p>基于你 ${archive.length} 次认知梳理 + ${actions.length} 个行为实验，识别到 ${saved.patterns.length} 个重复模式。分析于 ${fmtDate(saved.generatedAt)}。</p>
      <div class="btn-row"><button class="btn-ai" onclick="aiDiscoverPatterns(true)">重新分析</button><button class="btn-ghost" onclick="clearPatterns()">清除</button></div>
    </div>` +
    saved.patterns.map((p, i) => `<div class="pattern">
      <div class="p-title">${escapeHtml(p.title)}<span class="tag">模式 ${i+1}</span></div>
      <div class="p-evidence">${escapeHtml(p.evidence || '')}</div>
      <div class="p-insight">${escapeHtml(p.insight || '')}</div>
      ${(p.tags || []).length ? `<div class="asset-tags">${p.tags.map(t => `<span class="tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      ${assetActions('pattern', i)}
    </div>`).join('') + `<div class="pattern-meta">Transform · Growth Memory Agent</div>`;
    return;
  }
  if (!hasData){
    area.innerHTML = `<div class="expand-empty">还没有足够的数据发现模式。<br>先完成几次「每日洞察」或「每日改变」，Transform才能跨时间看到你反复出现的问题、角色与阻力。</div>`;
    return;
  }
  area.innerHTML = `<div class="pattern-cta">
    <h3>Transform 帮你跨时间发现模式</h3>
    <p>AI 会阅读你全部 ${archive.length} 次认知梳理与 ${actions.length} 个行为实验，找出「你反复出现的问题」「一直想成为的角色」「重复踩过的阻力」——这才是成长资产的长期价值。</p>
    <div class="btn-row"><button class="btn-ai" onclick="aiDiscoverPatterns(false)">Transform帮我发现模式</button></div>
  </div>
  <div class="pattern-meta" id="patternHint" style="margin-top:2px;"></div>`;
  // 无 API Key 时给出基础素材提示
  const cfg = getAI();
  if (!cfg.apiKey) $('patternHint').innerHTML = '（未配置 API Key：可先看「身份」与「洞察库」里的标签，作为基础素材）';
}
async function aiDiscoverPatterns(regen){
  const src = buildPatternSource();
  const prompt = '你是用户的「成长记录员 Growth Memory Agent」。请跨时间阅读以下成长记录，识别 2-4 个最值得用户注意的重复模式：反复出现的问题、一直想成为的角色、重复踩过的阻力、或正在形成的优势。\n成长记录：\n' + src + '\n严格返回 JSON：{"patterns":[{"title":"一句话标题","evidence":"支撑证据（引用具体记录，40字内）","insight":"对用户的洞察与建议（40字内）"}]}';
  toast(regen ? '正在重新分析…' : '正在跨时间扫描你的成长记录…');
  const text = await aiCall(prompt);
  if (!text) return;
  try {
    const j = JSON.parse(text.replace(/```json|```/g, '').trim());
    if (!j.patterns || !j.patterns.length) throw new Error('no patterns');
    // 去重（按 title）+ 限制最多 4 个
    const seen = new Set();
    const uniquePatterns = j.patterns.filter(p => {
      const t = (p && p.title || '').trim();
      if (!t || seen.has(t)) return false;
      seen.add(t);
      return true;
    }).slice(0, 4);
    localStorage.setItem(LS_PATTERNS, JSON.stringify({ patterns: uniquePatterns, generatedAt: new Date().toISOString() }));
    renderPatterns();
    // P0-2：页面容器 id 是 patternArea（不存在 #patterns），原引用抛错被 catch 误当成解析失败导致重复渲染
    $('patternArea').scrollIntoView({ behavior: 'smooth' });
  } catch(err){
    const area = $('patternArea');
    area.innerHTML += `<div class="pattern" style="white-space:pre-wrap;">${escapeHtml(text)}</div>`;
  }
}

/* P0-11/12：基于真实行为数据的本地主动发现（无需 API Key，达到阈值才显示） */
function renderDiscovery(){
  const box = $('discoveryBox'); if (!box) return;
  const actions = (loadActions() || []).filter(a => a && (a.status === 'graduated' || (a.logs && a.logs.length)));
  box.innerHTML = '';
  if (actions.length < 3) return; // 阈值：行为实验 ≥ 3
  // 统计失败原因
  const reasonCount = {};
  actions.forEach(a => (a.logs || []).forEach(l => {
    if (l && l.done === false && l.reason) reasonCount[l.reason] = (reasonCount[l.reason] || 0) + 1;
  }));
  let topReason = null, topN = 0;
  Object.keys(reasonCount).forEach(r => { if (reasonCount[r] > topN){ topN = reasonCount[r]; topReason = r; } });
  let body;
  if (topReason && topN >= 2){
    // W10 趋势细节：最近一次失败距今 + 是否同一实验反复失败（反复 → 设计问题而非意志力）
    const fails = [];
    actions.forEach(a => (a.logs || []).forEach(l => { if (l && l.done === false && l.reason === topReason) fails.push({ aid: a.id, date: l.date || '' }); }));
    const dated = fails.map(f => new Date(String(f.date).length <= 10 && f.date ? f.date + 'T00:00:00' : f.date).getTime()).filter(t => !isNaN(t));
    let recency = '';
    if (dated.length){
      const days = Math.max(0, Math.round((Date.now() - Math.max.apply(null, dated)) / 864e5));
      recency = '，最近一次失败在 <b>' + days + '</b> 天前';
    }
    const byExp = {};
    fails.forEach(f => byExp[f.aid] = (byExp[f.aid] || 0) + 1);
    const repeat = Object.keys(byExp).some(k => byExp[k] >= 2);
    body = `过去 <b>${actions.length}</b> 次行为实验里，「<b>${escapeHtml(topReason)}</b>」是你最容易失败的原因（共 <b>${topN}</b> 次${recency}${repeat ? '，而且在同一次实验里反复出现——问题可能不在意志力，而在设计' : ''}）。下一次，可以从缩小这一步、或重新设计触发点开始。`;
  } else {
    body = `你已经完成了 <b>${actions.length}</b> 次行为实验。再多积累几次，就能看出自己在哪一步最容易卡住。`;
  }
  box.innerHTML = `<div class="discovery-card">
    <div class="dc-label">我发现了一个关于你的模式</div>
    <div class="dc-body">${body}</div>
  </div>`;
}
