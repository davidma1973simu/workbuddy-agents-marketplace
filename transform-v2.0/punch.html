<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>每日改变 · Transform</title>
<style>
  :root {
    --bg: #F8F7F3;
    --surface: #FFFFFF;
    --surface-2: #F2F1EC;
    --ink: #151B19;
    --ink-2: #3D4A45;
    --ink-3: #7A8A83;
    --line: #E6E9E7;
    --line-2: #DDE2DF;
    --green: #0E6B50;
    --green-deep: #0A5A42;
    --green-2: #158A68;
    --green-3: #1D9E75;
    --green-soft: #E8F4EE;
    --green-light: #C8EBD9;
    --green-50: #F0F9F4;
    --amber: #C87A2A;
    --amber-soft: #FDF3E6;
    --amber-2: #EAA052;
    --coral: #C05B3C;
    --coral-soft: #F9EBE5;
    --violet: #5B4AA8;
    --violet-soft: #EEECFA;
    --radius-xl: 32px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow-1: 0 1px 2px rgba(21,27,25,.04);
    --shadow-2: 0 4px 12px rgba(21,27,25,.06), 0 16px 40px rgba(21,27,25,.08);
    --shadow-3: 0 8px 24px rgba(21,27,25,.08), 0 32px 64px rgba(21,27,25,.12);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"] {
    --bg: #0C100F;
    --surface: #161C1A;
    --surface-2: #1E2523;
    --ink: #EEF4F1;
    --ink-2: #A7B6B0;
    --ink-3: #6A7A74;
    --line: #252E2C;
    --line-2: #2F3A37;
    --green: #34D29E;
    --green-2: #2BBB8A;
    --green-3: #1D9E75;
    --green-soft: #132A24;
    --green-light: #1E4A3E;
    --green-50: #0F1F1B;
    --amber: #EAA052;
    --amber-soft: #2E2417;
    --coral: #D9714F;
    --coral-soft: #2E1E18;
    --violet: #A99BE8;
    --violet-soft: #23203A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh;
  }
  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 20px 110px; }

  /* 完整版「帮我改变」入口（底部小链接） */
  .full-link-bar {
    text-align: center; margin-top: 24px; padding: 16px 0 0;
    border-top: 1px dashed var(--line);
  }
  .full-link-bar a {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--amber);
    text-decoration: none; padding: 8px 16px; border-radius: 999px;
    transition: all .2s;
  }
  .full-link-bar a:hover { background: var(--amber-soft); }

  /* ===== 顶栏 ===== */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 16px 0; flex-wrap: wrap; }
  /* ===== 全局导航（所有页面互跳） ===== */
  .gnav {
    display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;
    padding: 4px; border-radius: 999px; background: var(--surface-2);
    justify-content: center; flex-wrap: wrap;
  }
  .gnav .gn-item {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 7px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--ink-2);
    text-decoration: none; white-space: nowrap; transition: all .2s;
    flex-shrink: 0;
  }
  .gnav .gn-item:hover { color: var(--green); background: var(--green-soft); }
  .gnav .gn-item.on { background: var(--surface); color: var(--green-deep); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(14,107,80,.26), 0 1px 4px rgba(30,42,38,.08); }
  /* 主题切换按钮双 span（t-light 默认显示，t-dark 仅深色时显示） */
  .t-dark { display: none; }
  [data-theme="dark"] .t-light { display: none; }
  [data-theme="dark"] .t-dark { display: inline; }
  /* R-11：主题开关统一为图标按钮（与其它页逐字一致） */
  .tb-theme { padding: 9px 12px !important; }
  .tb-theme .t-light, .tb-theme .t-dark { font-size: 15px; line-height: 1; }
  @media (max-width: 720px) {
    .topbar { gap: 6px; }
    .topbar .back { order: 1; }
    .topbar .spacer { display: none; }
    .gnav { order: 3; width: 100%; flex: none; padding: 6px; gap: 4px; }
    .gnav .gn-item { flex: 1 1 0; min-width: 0; padding: 9px 10px; font-size: 12.5px; justify-content: center; white-space: nowrap; }
    .topbar .theme-toggle, .topbar .arch-btn, .topbar button { order: 2; padding: 8px 12px; font-size: 12.5px; }
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none;
    font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 999px; transition: all .2s;
  }
  .back:hover { background: var(--surface-2); color: var(--ink); }
  .topbar .spacer { flex: 1; }
  .topbar button {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13.5px;
    padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .topbar button:hover { color: var(--ink); border-color: var(--line-2); }
  .arch-btn { background: linear-gradient(135deg, #0A5A42, #0E6B50) !important; color: #fff !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(14,107,80,.22); }
  .arch-btn:hover { color: #fff !important; border-color: transparent !important; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(14,107,80,.32); }
  /* 高特异性：覆盖 .topbar button */
  .topbar button.arch-btn,
  .topbar button.arch-btn:hover { background: linear-gradient(135deg, #0A5A42, #0E6B50) !important; color: #fff !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(14,107,80,.22); }

  /* ===== 今日反馈卡 ===== */
  .today-feedback { margin-top: 14px; }
  .today-feedback.hidden { display: none; }
  .tf-card {
    background: var(--green-50);
    border: 1px solid var(--green-light); border-radius: var(--radius-lg);
    padding: 18px 18px 14px; text-align: center;
    animation: tf-slide .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes tf-slide { from { transform: translateY(-8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .tf-crown { line-height: 1; margin-bottom: 6px; }
  .tf-crown svg { display: block; margin: 0 auto; }
  .tf-title { font-size: 17px; font-weight: 800; color: var(--green); margin-bottom: 8px; }
  .tf-body { font-size: 15px; color: var(--ink); line-height: 1.7; margin-bottom: 14px; }
  .tf-stats { display: flex; justify-content: center; gap: 22px; padding: 12px 0; border-top: 1px dashed var(--green-light); border-bottom: 1px dashed var(--green-light); }
  .tf-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tf-stat span { font-size: 11px; color: var(--ink-3); }
  .tf-stat b { font-size: 24px; font-weight: 800; color: var(--green); line-height: 1; }
  .tf-stat em { font-size: 10px; color: var(--ink-3); font-style: normal; }
  .tf-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }
  .tf-section {
    text-align: left;
    background: var(--green-50); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .tf-section-label {
    font-size: 12px; font-weight: 700; color: var(--green-deep);
    letter-spacing: .4px; margin-bottom: 4px;
  }
  .tf-section-body {
    font-size: 14px; color: var(--ink); line-height: 1.7;
  }
  .tf-progress {
    text-align: left; margin: 14px 0 12px;
  }
  .tf-progress-label {
    font-size: 12px; font-weight: 700; color: var(--ink-2);
    margin-bottom: 6px;
  }
  .tf-progress-bar {
    height: 10px; border-radius: 999px; background: var(--green-50);
    overflow: hidden; position: relative;
  }
  .tf-progress-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--green), var(--green-3));
    transition: width .6s ease;
  }
  .tf-progress-text {
    font-size: 12px; color: var(--ink-3); margin-top: 4px;
  }
  .tf-actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .tf-upgrade { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--green-light); text-align: center; }
  .tu-q { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .tu-link { display: inline-block; font-size: 13.5px; font-weight: 700; color: var(--green-deep); text-decoration: none; border-bottom: 1.5px solid var(--green); padding-bottom: 1px; }
  .tu-link:hover { color: var(--green); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; border: none; transition: all .25s var(--ease);
  }
  .btn-ghost { background: var(--surface); color: var(--green); border: 1.5px solid var(--green-light); }
  .btn-ghost:hover { border-color: var(--green); background: var(--green-50); }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: #0A5A42; }
  .btn-amber { background: var(--amber); color: #fff; }
  .btn-amber:hover { filter: brightness(1.06); }

  /* ===== 没做到面板 ===== */
  .block-box { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px; display: none; }
  .block-box h3 { font-size: 15px; font-weight: 800; margin-bottom: 12px; }
  .reason-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reason {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 12px; font-size: 13.5px; color: var(--ink); cursor: pointer; font-family: inherit;
    text-align: left; line-height: 1.5; transition: all .2s;
  }
  .reason b { display: block; font-size: 15px; }
  .reason:hover { border-color: var(--amber); background: var(--amber-soft); }
  .ai-result { margin-top: 12px; background: var(--green-soft); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13.5px; line-height: 1.7; }

  /* ===== 执行态 v3：周进度条 + 徽章 + AI 反馈对话（think 同款） ===== */
  .pw-week { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .pw-bar { flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
  .pw-fill { height: 100%; border-radius: 999px; background: #fff; transition: width .5s ease; }
  .pw-label { font-size: 12px; opacity: .9; white-space: nowrap; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35);
    color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .3px;
  }
  .badge.locked { opacity: .45; }

  .ai-msg { display: flex; gap: 10px; margin-top: 14px; animation: bubble-in .3s ease; }
  .ai-avatar {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--green), var(--green-3));
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
  }
  .ai-bubble {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.7; color: var(--ink);
  }
  .ai-bubble .ab-celebrate { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--green-deep); margin-bottom: 4px; }
  .cta-ghost-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px;
    background: var(--surface); color: var(--ink-2); border: 1.5px solid var(--line-2);
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .cta-ghost-btn:hover { background: var(--green-soft); color: var(--green-deep); border-color: var(--green); }
  @keyframes bubble-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .today-prompt { margin-top: 12px; background: var(--amber-soft); border-left: 3px solid var(--amber); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.6; color: var(--ink); }
  .today-prompt b { color: var(--amber); }

  #toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--surface); padding: 12px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .3s var(--ease);
    z-index: 100; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 创建态（think 同款风格） ===== */
  .create-hero {
    background: linear-gradient(135deg, #0A5A42, var(--green-3));
    border-radius: var(--radius-lg); padding: 30px 26px; color: #fff; margin-top: 8px;
  }
  .create-hero .ch-eyebrow { font-size: 12.5px; opacity: .85; letter-spacing: .5px; margin-bottom: 10px; }
  .create-hero h1 { font-size: 24px; font-weight: 800; line-height: 1.4; margin-bottom: 8px; }
  .create-hero p { font-size: 14px; opacity: .92; line-height: 1.7; margin-bottom: 18px; }
  .create-input {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: none; font-size: 15px;
    font-family: inherit; color: var(--ink); outline: none; background: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  .create-input::placeholder { color: var(--ink-3); }
  .cta-start {
    display: block; width: 100%; margin-top: 12px; padding: 15px; border: none; border-radius: 12px;
    background: #fff; color: #0A5A42; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease);
  }
  .cta-start:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.18); }
  .cta-start:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .ctx-card {
    background: var(--amber-soft); border: 1.5px solid rgba(200,122,42,.3); border-radius: var(--radius-md);
    padding: 14px 16px; margin-bottom: 14px;
  }
  .ctx-card .ctx-label { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--amber); margin-bottom: 6px; text-transform: uppercase; }
  .ctx-card .ctx-row { font-size: 13.5px; color: var(--ink); line-height: 1.7; }
  .ctx-card .ctx-row b { color: var(--amber); font-weight: 800; }

  .suggest-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 24px; margin-top: 16px;
  }
  .suggest-card .sc-tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800;
    letter-spacing: 1px; color: var(--green); margin-bottom: 12px; text-transform: uppercase;
  }
  .suggest-card .sc-title { font-size: 22px; font-weight: 800; line-height: 1.4; margin-bottom: 10px; color: var(--ink); letter-spacing: -.2px; }
  .sc-micro-card {
    background: linear-gradient(135deg, var(--green-50), var(--surface));
    border-left: 4px solid var(--green); border-radius: 12px;
    padding: 16px 18px; font-size: 17px; font-weight: 700; color: var(--ink);
    line-height: 1.5;
  }
  .suggest-card .sc-desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; margin-bottom: 16px; }
  .sc-field { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin: 14px 0 8px; }
  .sc-rationale { background: var(--amber-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; color: var(--ink); margin: 6px 0 2px; }
  .sc-details {
    margin: 12px 0;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 14px;
    border: 1px solid var(--line);
  }
  .sc-details summary {
    font-size: 13.5px; font-weight: 700; color: var(--green-deep);
    cursor: pointer; user-select: none;
    list-style: none;
    display: flex; align-items: center; gap: 6px;
  }
  .sc-details summary::-webkit-details-marker { display: none; }
  .sc-details[open] summary { margin-bottom: 6px; }
  .sc-details summary:hover { color: var(--green); }
  .sc-row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .sc-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .sc-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
    border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink-2);
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .sc-chip:hover { border-color: var(--green); color: var(--green); background: var(--green-50); }
  .sc-chip.sel { background: var(--green); border-color: var(--green); color: #fff; }
  .sc-input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line-2);
    background: var(--surface); font-size: 14px; font-family: inherit; color: var(--ink); outline: none;
  }
  .sc-input:focus { border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(29,158,117,.1); }
  .plan-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px; }
  .plan-day { display: flex; align-items: baseline; gap: 12px; padding: 8px 12px; border-radius: 8px; background: var(--surface); font-size: 13.5px; line-height: 1.5; }
  .plan-day.today { background: var(--green-50); border-left: 3px solid var(--green); }
  .plan-day-label { flex-shrink: 0; font-weight: 700; color: var(--green-deep); min-width: 88px; font-size: 12px; letter-spacing: 0.3px; }
  .plan-day-text { color: var(--ink); flex: 1; word-break: break-word; overflow-wrap: anywhere; line-height: 1.45; }
  .sc-hint { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
  .sc-textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--surface); font-size: 13.5px; font-family: inherit; color: var(--ink); outline: none; resize: vertical; min-height: 56px; line-height: 1.5; box-sizing: border-box; }
  .sc-textarea:focus { border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(29,158,117,.1); }
  .sc-obstacle-result { background: var(--green-50); border-left: 3px solid var(--green); border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 13.5px; color: var(--ink); line-height: 1.6; }
  .sc-summary { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
  .sc-summary b { color: var(--green-deep); }
  .cta-confirm {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    margin-top: 16px; padding: 16px; border: none; border-radius: var(--radius-md);
    background: var(--green); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease);
  }
  .cta-confirm:hover { transform: translateY(-2px); background: #0A5A42; }
  .cta-confirm:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* ===== Stage 2：checklist + 大按键 + 自定义锚点 ===== */
  .step-list { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .step-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-radius: 12px;
    background: var(--surface); border: 1.5px solid var(--line);
    font-size: 14px; line-height: 1.5;
  }
  .step-item.plain { cursor: default; }
  .step-no {
    width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0;
    background: var(--green-soft); color: var(--green-deep);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
  }

  .anchor-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;
  }
  .anchor-key {
    padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--surface); color: var(--ink);
    font-size: 14.5px; font-weight: 600; line-height: 1.4;
    cursor: pointer; transition: all .2s; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
    font-family: inherit;
  }
  .anchor-key:hover { border-color: var(--green); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(14,107,80,.12); }
  .anchor-key.sel {

<script>
/* ===================== 数据层（与 act.html 完全互通） ===================== */
const LS_ACTIONS = 'trf_actions';
const LS_PROFILE = 'trf_profile';
const LS_AI = 'trf_ai_config_v1';
const BRAND_PROFILES = {
  'DeepSeek': { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
  'OpenAI':   { baseUrl: 'https://api.openai.com/v1',  model: 'gpt-4o-mini' },
  'Gemini':   { baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai/', model: 'gemini-2.0-flash' }
};

let current = null; // 当前 Action

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), ms || 2400);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('trf_theme', next); } catch(e){}
}
function getAI(){
  let cfg; try { cfg = JSON.parse(localStorage.getItem(LS_AI)) || {}; } catch(e){ cfg = {}; }
  const brand = cfg.brand || 'DeepSeek';
  const profile = BRAND_PROFILES[brand] || BRAND_PROFILES['DeepSeek'];
  return { brand, apiKey: cfg.apiKey || '', baseUrl: cfg.baseUrl || profile.baseUrl, model: cfg.model || profile.model };
}
function loadActions(){ try { return JSON.parse(localStorage.getItem(LS_ACTIONS)) || []; } catch(e){ return []; } }
function saveActions(list){ localStorage.setItem(LS_ACTIONS, JSON.stringify(list)); }
function loadProfile(){ try { return JSON.parse(localStorage.getItem(LS_PROFILE)) || { identityStatements: [] }; } catch(e){ return { identityStatements: [] }; } }
function saveProfile(p){ localStorage.setItem(LS_PROFILE, JSON.stringify(p)); }
function persistAction(){ const list = loadActions(); const i = list.findIndex(a => a.id === current.id); if (i >= 0) list[i] = current; else list.push(current); saveActions(list); }

async function aiCall(prompt, attempt = 1){
  const cfg = getAI();
  if (!cfg.apiKey) return { ok: false, kind: 'NO_KEY', msg: 'API Key 未配置（请到设置页填写）' };
  const url = cfg.baseUrl.replace(/\/$/, '') + '/chat/completions';
  const maxAttempts = 4;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: cfg.model, messages: [{ role:'user', content: prompt }], temperature: 0.2, max_tokens: 2000 })
    });
    if (!res.ok){
      let errText = ''; try { errText = (await res.text()).slice(0, 200); } catch(e){}
      if (attempt < maxAttempts && [503,502,500,429].includes(res.status)){
        await new Promise(r => setTimeout(r, 250 * Math.pow(2, attempt)));
        return aiCall(prompt, attempt + 1);
      }
      console.error('[aiCall]', res.status, res.statusText, errText);
      // 友好提示
      let kind = 'HTTP_' + res.status, msg = res.status + ' ' + res.statusText;
      if (res.status === 401 || res.status === 403) msg = 'API Key 无效或权限不足（401/403）。检查设置里的 brand + apiKey';
      else if (res.status === 404) msg = 'API 地址或模型不存在（404）。检查 brand（DeepSeek/OpenAI/Gemini）';
      else if (res.status === 429) msg = '请求过快或余额不足（429）。稍后再试';
      return { ok: false, kind, msg, detail: errText };
    }
    return { ok: true, text: (await res.json()).choices[0].message.content };
  } catch(e){
    console.error('[aiCall] network/fetch error:', e);
    const hint = /fetch|network|CORS|SSL/i.test(String(e.message || e))
      ? '网络/CORS 失败：GitHub Pages 跨域调用被拦截。详见控制台'
      : ('调用失败：' + (e.message || e));
    return { ok: false, kind: 'NETWORK', msg: hint, detail: String(e) };
  }
}
function parseJSON(text){
  if (!text) return null;
  // 容错：去 markdown ```json ... ``` 包裹
  let s = String(text).replace(/^\s*```(?:json)?\s*/i, '').replace(/\s*```\s*$/i, '').trim();
  // 取第一个 { 到最后一个 } 的 JSON 块
  const first = s.indexOf('{'), last = s.lastIndexOf('}');
  if (first < 0 || last <= first) return null;
  try { return JSON.parse(s.slice(first, last + 1)); } catch(e){
    console.warn('[parseJSON] failed, raw text:\n', text);
    return null;
  }
}

// 适配器：老调用 r = await aiCall(prompt) 现在拿到 {ok, text/msg}，需要兼容老的字符串形式
function aiText(r){ return r && r.ok ? r.text : null; }
function aiErr(r){ return r && !r.ok ? r : null; }

/* ===================== 每日改变 核心 ===================== */
// done=true：正常完成；done=true + extra.rescued：受阻后靠最小版补做（也算完成，连续不清零）
// done=false：明确今天不做（记 reason，供 D 态重新设计）；失败不惩罚——不在此清零 streak，
//             连续值由下一次完成按间隔天数自然重算（隔断则归 1）
function logCompletion(done, day, difficulty, note, extra){
  extra = extra || {};
  const rescued = !!extra.rescued;
  const reason = (extra.reason != null) ? String(extra.reason) : null;
  const today = new Date(); today.setHours(0,0,0,0);
  const lastDone = (current.logs || []).filter(l => l.done).slice(-1)[0];
  if (done){
    current.logs.push({ day, date: new Date().toISOString(), done: true, difficulty: difficulty||null, note: note||'', output: extra.output||'', rescued, reason });
    current.totalDone = (current.totalDone || 0) + 1;
    if (lastDone){
      const ld = new Date(lastDone.date); ld.setHours(0,0,0,0);
      const diff = Math.round((today - ld) / 86400000);
      if (diff === 1) current.streak = (current.streak || 0) + 1;
      else if (diff > 1) current.streak = 1;
    } else {
      current.streak = 1;
    }
    current.bestStreak = Math.max(current.bestStreak || 0, current.streak);
    current.currentDay = Math.max(current.currentDay || 1, day + 1);
    if (current.currentDay > current.targetDays){
      current.status = 'graduated'; current.graduatedAt = new Date().toISOString();
    } else current.status = 'active';
    // 身份证据累积（内部计数保留；UI 已从"投票"改为"见证"，方向 = 由证据得出身份）
    if (current.identity){
      const profile = loadProfile();
      profile.identityStatements = profile.identityStatements || [];
      const ex = profile.identityStatements.find(s => s.text === current.identity);
      if (ex){ ex.votes = (ex.votes||0) + 1; ex.date = new Date().toISOString(); ex.source = 'action'; }
      else profile.identityStatements.push({ text: current.identity, votes: 1, date: new Date().toISOString(), source: 'action' });
      saveProfile(profile);
    }
  } else {
    current.logs.push({ day, date: new Date().toISOString(), done: false, difficulty: reason || difficulty || null, note: note||'', rescued:false, reason });
  }
  persistAction();
}

/* ---- 执行日辅助（全部由 logs 现算，不引入新存档字段，老存档自动兼容） ---- */
function todayAlreadyDone(){
  const now = new Date(); now.setHours(0,0,0,0); const ts = now.getTime();
  return (current.logs || []).some(l => {
    if (!l.done) return false;
    const d = new Date(l.date); d.setHours(0,0,0,0);
    return d.getTime() === ts;
  });
}
// 距最近一次完成（done，含 rescued）的自然日间隔；从未完成过 → 按实验开始日算
// 注意：绝不能返回 Infinity（会在界面上渲染成「连续 Infinity 天没发生」）
function daysSinceLastDone(){
  const ld = (current.logs || []).filter(l => l.done).slice(-1)[0];
  const base = ld ? ld.date : (current.createdAt || '');
  if (!base) return 0;
  const now = new Date(); now.setHours(0,0,0,0);
  const d = new Date(base); d.setHours(0,0,0,0);
  if (isNaN(d.getTime())) return 0;
  return Math.max(0, Math.round((now - d) / 86400000));
}
// 锚点措辞：AI 给的锚点有的写「在早上打开电脑之后」，有的写「在我吃完午饭后」。
// 展示前统一去掉首「在」与尾「之后/以后」，模板再补一次，避免出现「在「在…」之后做」。
function anchorText(a){
  let t = String(a == null ? '' : a).trim();
  if (!t) return '';
  t = t.replace(/^在/, '').replace(/(之后|以后)$/, '');
  return t;
}

// 身份措辞：用户写的身份本身常以「…的人 / …者」结尾，避免渲染成「…的人」的人
function idPhrase(id){
  const s = String(id == null ? '' : id).trim();
  if (!s) return '';
  return /(人|者|员|家|师|匠)$/.test(s) ? ('「' + s + '」') : ('「' + s + '」的人');
}
// 本周（周一起）实际完成天数（done 含 rescued），供证据行
function weekDoneCount(){
  const now = new Date(); now.setHours(0,0,0,0);
  const mon = new Date(now); mon.setDate(now.getDate() - ((now.getDay() + 6) % 7)); mon.setHours(0,0,0,0);
  const seen = new Set();
  (current.logs || []).forEach(l => {
    if (!l.done) return;
    const d = new Date(l.date); d.setHours(0,0,0,0);
    if (d >= mon && d <= now) seen.add(d.getTime());
  });
  return seen.size;
}
// 本地降维：把一段行为缩小到 10 秒能做的最小版（零 AI 依赖）
function downscaleMicro(micro){
  const m = (micro || '').trim();
  if (!m) return '做一件 10 秒就能完成的小事';
  const q = m.replace(/(\d+)\s*(个|次|组|圈|遍|页|套|行|颗|步|下|轮|张|份)/, (a, n, u) => (+n > 1 ? ('1' + u) : a));
  if (q !== m) return q;
  const t = m.replace(/(\d+)\s*(秒|分钟|小时)/, (a, n, u) => (u === '秒' ? '10 秒' : ('1' + u)));
  if (t !== m) return t;
  return '只做开头一步：' + m;
}

/* ===== R-24 每日改变 = 一张「改变任务清单」 =====
   常显：要改变的任务 · 7 天微行动 · 逐日打勾 · 每天记录「做了什么 + 产出物」
   锚点只在创建时设一次，7 天通用，清单里每天提醒。 */
function logsDoneSet(){
  const s = new Set();
  (current.logs || []).forEach(l => { if (l && l.done) s.add(l.day); });
  return s;
}
function logRecForDay(day){
  const ls = (current.logs || []).filter(l => l && l.done && l.day === day);
  return ls.length ? ls[ls.length - 1] : null;
}
function planOfDay(day){ return (current.plan || []).find(x => x.day === day) || null; }
function microOfDay(day){
  const p = planOfDay(day);
  return (p && p.micro) || (current.plan && current.plan[0] && current.plan[0].micro) || current.input || '';
}

function renderPunch(){
  const area = $('punchArea');
  if (!current){
    area.innerHTML = `<div class="create-hero">
      <div class="ch-eyebrow">每日改变</div>
      <h1>还没有开始一次改变</h1>

  }

  const isGrad = current.status === 'graduated';
  const plan = current.plan || [];
  const N = current.targetDays || plan.length || 7;
  const anchor = (current.anchor && current.anchor.after) || '';
  const doneSet = logsDoneSet();
  const total = current.totalDone || 0;
  const curDay = Math.min(Math.max(current.currentDay || 1, 1), N);

  // P1-W3：升级到「帮我改变」时带上已有上下文（目标 / 最近在做的小步 / 最近失败原因）
  const lastFail = (current.logs || []).filter(l => l && l.done === false).pop();
  const failReason = (lastFail && lastFail.reason) || '';
  const upUrl = 'act.html?goal=' + encodeURIComponent(current.input || '')

  // ① 任务头：要改变的那件事（常显）+ 一次性锚点提醒
  html += `<div class="ck-head">
      <div class="ck-eyebrow">每日改变${isGrad ? ' · 已走完' : ''}</div>
      <div class="ck-goal" id="ckGoal">${escapeHtml(current.input || '')}</div>
      <div class="ck-meta">
        <span class="ck-anchor-tag">${anchor ? '锚点 · 在「' + escapeHtml(anchorText(anchor)) + '」之后做' : '到了那个时刻，就做那一小步'}</span>
        <span class="ck-count">${isGrad ? ('已完成 ' + N + ' / ' + N + ' 天') : ('第 ' + curDay + ' / ' + N + ' 天 · 已完成 ' + total + ' 天')}</span>

    </div>`;

  // ② 进度
  html += `<div class="ck-prog" role="img" aria-label="已完成 ${doneSet.size} / ${N} 天">${
    Array.from({ length: N }, (_, i) => {
      const d = i + 1;
      const cls = doneSet.has(d) ? 'on' : ((!isGrad && d === curDay) ? 'cur' : '');
      return '<span class="ck-seg ' + cls + '"></span>';
    }).join('')
  }</div>`;

  // ③ 清单标题
  html += `<div class="ck-listhead"><span>${N} 天微行动</span><span class="ck-lh-sub">${isGrad ? '整轮已完成，清单留作记录' : '到点就做，做完打勾'}</span></div>`;

  // ④ 清单本体：7 天全在眼前
  html += '<div class="ck-list">';
  for (let d = 1; d <= N; d++){
    html += renderCheckRow(d, {
      isDone: doneSet.has(d),
      isToday: !isGrad && d === curDay && !doneSet.has(d),
      anchor: anchor,
    });
  }
  html += '</div>';

  // ⑤ D 态：连续没做 → 重新设计卡（失败是给系统的输入，不是给你的判决）
  const gapDays = daysSinceLastDone();
  if (!isGrad && gapDays >= 2 && !rdAdjustedToday()) html += renderRedesignCard(gapDays, upUrl);

  // ⑥ C 态容器：没做到 → 选因 → 当场给最小版（帮助，不是说教）
  html += `<div class="block-box" id="blockBox">
      <h3>没关系。先选一个最接近的：</h3>
      <div class="reason-grid">
        <button class="reason" onclick="pickBlock('忘了')"><b>忘了</b>压根没想起来</button>

        <button class="reason" onclick="pickBlock('没时间')"><b>没时间</b>挤不出这 30 秒</button>
      </div>

  html += `<div class="today-feedback hidden" id="todayFeedbackWrap">

        <div class="tf-title" id="tfTitle">第 X 天完成</div>
        <div class="tf-evidence" id="tfEvidence"></div>
        <div class="tf-body" id="tfWitness"></div>
        <details class="sc-details tf-meaning" id="tfMeaningFold">
          <summary id="tfMeaningSummary">它对你成为的人意味着什么？</summary>
          <div class="tf-meaning-body" id="tfMeaningBody"></div>
        </details>
      </div>
    </div>`;

  // ⑧ 出口：更完整的复盘（不在每日流程里拦路；整轮走完时是主要出口）
  html += `<div class="tf-upgrade ck-foot">
      <div class="tu-q">想把这个改变做得更完整（含复盘与沉淀）？</div>

/* 单日行：已完成 = 可展开看当天记录 · 今天 = 展开填写区 · 未到 = 安静一行 */
function renderCheckRow(day, o){
  const micro = microOfDay(day);

  if (o.isDone){
    const rec = logRecForDay(day);
    const note = (rec && rec.note) || '';
    const output = (rec && rec.output) || '';
    const rescued = !!(rec && rec.rescued);
    const body = (note || output)
      ? (note ? `<div class="ck-rec"><span class="ck-rec-k">我做了什么</span><span class="ck-rec-v">${escapeHtml(note)}</span></div>` : '')
        + (output ? `<div class="ck-rec"><span class="ck-rec-k">产出物</span><span class="ck-rec-v">${escapeHtml(output)}</span></div>` : '')
      : '<div class="ck-rec ck-rec-empty">这一天的记录是空的</div>';
    return `<details class="ck-row done" id="ck-day-${day}">
        <summary class="ck-sum">
          <span class="ck-tick on" aria-hidden="true"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span class="ck-dnum">Day ${day}</span>
          <span class="ck-txt">${escapeHtml(micro)}</span>
          <span class="ck-state">${rescued ? '最小版接住' : '已记录'}</span>
        </summary>
        <div class="ck-body">${body}</div>
      </details>`;
  }

  if (o.isToday){
    const p = planOfDay(day);
    const subs = (p && p.sub && p.sub.length) ? p.sub : [];
    const subsHtml = subs.length
      ? `<div class="ck-subs"><div class="ck-subs-label">今天的小步骤</div>${subs.map((s, i) => {
          const on = !!(p.subDone && p.subDone[i]);
          return `<label class="ck-sub${on ? ' on' : ''}"><input type="checkbox" ${on ? 'checked' : ''} onchange="toggleSub(${i})"><span>${escapeHtml(s)}</span></label>`;
        }).join('')}</div>`
      : '';
    return `<div class="ck-row today" id="ck-day-${day}">
        <div class="ck-sum">
          <span class="ck-tick cur" aria-hidden="true"></span>
          <span class="ck-dnum">Day ${day}</span>
          <span class="ck-state ck-state-today">今天</span>
        </div>
        <div class="ck-body">
          <div class="ck-micro">${escapeHtml(micro)}</div>
          <div class="ck-anchor-tip">${o.anchor ? '到「<b>' + escapeHtml(anchorText(o.anchor)) + '</b>」之后做——到了就做，不用想。' : '到了那个时刻，就做这一小步。'}</div>
          ${subsHtml}
          <label class="ck-field"><span class="ck-lab">今天我做了什么</span>
            <textarea class="ck-in" id="ckNote" rows="2" maxlength="300" placeholder="写一句，例如：午饭时我把手上的进度同步给了对方"></textarea></label>
          <label class="ck-field"><span class="ck-lab">产出物 <em>没有可留空</em></span>
            <input class="ck-in" id="ckOutput" maxlength="200" placeholder="例如：一段 3 行记录 / 一份发给对方的清单"></label>
          <button class="ck-do" id="ckDoBtn" onclick="markDone()">完成今天，打勾</button>
          <button class="ck-miss-link" onclick="showBlock()">今天没做到</button>
        </div>
      </div>`;
  }

  return `<div class="ck-row" id="ck-day-${day}">
      <div class="ck-sum">
        <span class="ck-tick" aria-hidden="true"></span>
        <span class="ck-dnum">Day ${day}</span>
        <span class="ck-txt">${escapeHtml(micro)}</span>
      </div>
    </div>`;
}

/* 打勾按钮可用性：小步骤全勾上 + 写了一句「做了什么」 */
function refreshTodayRowState(){
  const btn = $('ckDoBtn'); if (!btn) return;
  const note = $('ckNote');
  const p = planOfDay(current.currentDay);
  const subsOk = !(p && p.sub && p.sub.length) || (p.subDone || []).every(Boolean);
  const ok = subsOk && !!(note && note.value.trim());
  btn.disabled = !ok;
  if (note && !note.dataset.bound){
    note.dataset.bound = '1';
    note.addEventListener('input', refreshTodayRowState);
  }
}


function toggleSub(i){
  if (!current) return;
  const t = (current.plan || []).find(x => x.day === current.currentDay); if (!t) return;
  t.subDone = t.subDone || [];
  while (t.subDone.length < (t.sub || []).length) t.subDone.push(false);
  t.subDone[i] = !t.subDone[i];
  persistAction();
  const lab = document.querySelectorAll('.ck-sub')[i];
  if (lab) lab.classList.toggle('on', !!t.subDone[i]);
  refreshTodayRowState();
}

// ===== 打卡动作：完成 / 最小版补做(rescued) / 明确不做(miss) =====
function markDone(){
  if (!current) return;
  const today = (current.plan || []).find(p => p.day === current.currentDay);
  if (today && (today.sub || []).length && !(today.subDone || []).every(Boolean)){ toast('先把今天的几步都勾上'); return; }
  if (todayAlreadyDone() && !logRecForDay(current.currentDay)){
    // 今天已经完成过一天了。规则不变，但不再静默吞掉——输入内容原样留在框里
    toast('今天已经完成过一天了 —— 剩下几天明天接着来');
    return;
  }
  if (todayAlreadyDone()){ renderPunch(); showTodayFeedback(false); return; } // 同日重复 → 只回放，不再重复计数
  // R-24：每天留下「做了什么 + 产出物」，这一天才算真的发生过
  const noteEl = $('ckNote'); const outEl = $('ckOutput');
  const note = noteEl ? (noteEl.value || '').trim() : '';
  const output = outEl ? (outEl.value || '').trim() : '';
  if (noteEl && !note){ toast('写一句今天做了什么，就能打勾'); noteEl.focus(); return; }
  const day = current.currentDay;
  logCompletion(true, day, null, note, { output });
  renderPunch();
  // 刚打勾那天就地展开，让用户看到自己写下的记录
  const row = $('ck-day-' + day);
  if (row && row.tagName === 'DETAILS') row.setAttribute('open', '');
  if (current.status === 'graduated'){
    toast('7 天走完了。这张清单留作你的记录');
    return;
  }
  showTodayFeedback(false);
}

// C 态：受阻后选择做最小版 → rescued 完成（失败不惩罚：记完成、连续不清零）
function markDoneRescued(reason){
  if (!current) return;
  if (todayAlreadyDone()){ renderPunch(); showTodayFeedback(true); return; }
  logCompletion(true, current.currentDay, reason || '', '', { rescued: true, reason: reason || '' });
  if (current.status === 'graduated'){
    renderPunch();
    toast('全部完成！新的习惯和角色已生根');
    return;
  }
  renderPunch();
  showTodayFeedback(true);
}

// C 态：明确今天不做了 → 记 miss + 原因（供 D 态重新设计；失败是输入不是判决）
function markMiss(reason){
  if (!current) return;
  if (todayAlreadyDone()){ renderPunch(); return; }
  logCompletion(false, current.currentDay, reason || '', '', { reason: reason || '' });
  renderPunch();
  const gap = daysSinceLastDone();
  toast(gap >= 2
    ? '已记下。连续 ' + gap + ' 天没发生——明天会建议你把设计重新调一下。'
    : '没关系，没做到不是失败。先放着，明天再试。');
}

/* ===== B 态：完成反馈 = 行为证据行 + 身份见证句（就地展开，不堆信息） ===== */
async function showTodayFeedback(isRescued){
  if (!current) return;
  const w = $('todayFeedbackWrap'); if (!w) return;
  const day = current.currentDay - 1;
  const streak = current.streak || 0;
  const total = current.totalDone || 0;
  const weekC = weekDoneCount();
  const todayPlan = current.plan[current.currentDay - 2] || current.plan[current.currentDay - 1];
  const micro = (todayPlan && todayPlan.micro) || current.input;
  const anchor = current.anchor && current.anchor.after;
  const identity = current.identity || '';
  const targetDays = current.targetDays || 7;
  const isFirst = total <= 1;

  // 1. 标题（rescued = 用最小版接住了）
  // 图标固定为「完成」标记，状态差异由标题与证据行承担（UI 不使用 emoji）
  $('tfTitle').textContent = isFirst
    ? '今天的行为实验开始了'
    : (isRescued ? ('第 ' + day + ' 天 · 用最小版接住了') : ('第 ' + day + ' 天完成'));

  // 2. 行为证据行（本地计数：真实发生的事实，不是表扬）
  const evAnchor = (streak >= 2 && anchor) ? (' · 连续 ' + streak + ' 天在「' + anchorText(anchor) + '」之后做到') : '';
  $('tfEvidence').textContent = '本周第 ' + weekC + ' 次 · 累计 ' + total + ' 天' + evAnchor + (isRescued ? '（今天靠最小版接住）' : '');

  // 3. 身份见证句（证据 → 身份；结论让用户自己得出，不是自我审判）
  let witness;
  if (isRescued){
    witness = identity
      ? '今天状态没那么好，但你用最小版接住了。不完美的完成，也在让你成为' + idPhrase(identity) + '。'
      : '今天状态没那么好，但你用最小版接住了。能接住，就能继续。';
  } else if (isFirst){
    witness = identity
      ? '第一次完成。你在用行动回答：我想成为' + idPhrase(identity) + '。'
      : '第一次完成。改变从今天这一小步开始。';
  } else if (streak >= 3){
    witness = '连续 ' + streak + ' 天在锚点时刻做到。这个动作正从「刻意」变成「顺手」——你正在成为' + (identity ? idPhrase(identity) + '。' : '那个想成为的自己。');
  } else if (weekC >= 5){
    witness = '这一周大部分日子你都做到了。这就是' + (identity ? '「' + identity + '」' : '改变') + '的证据。';
  } else {
    witness = '第 ' + day + ' 天完成，为' + (identity ? '「' + identity + '」' : '那个想成为的自己') + '又添了一条证据。';
  }
  $('tfWitness').textContent = witness;

  // 4. 折叠：「它对成为你意味着什么」（AI 2 句；无 API key 自动隐藏，不阻塞）
  const fold = $('tfMeaningFold');
  const summary = $('tfMeaningSummary');
  const mb = $('tfMeaningBody');
  if (fold) fold.style.display = (getAI().apiKey && micro) ? '' : 'none';
  if (summary) summary.textContent = identity ? ('它对你成为「' + identity + '」意味着什么？') : '它对你想成为的自己意味着什么？';
  if (mb) mb.textContent = '';
  try {
    if (getAI().apiKey && micro) {
      const aiResp = await aiCall(
        '用户刚完成了一个「每日改变」实验' + (isRescued ? '（靠最小版补做完成）' : '') + '的第 ' + day + ' 天。\n' +
        '今天做了：在「' + (anchor || '未指定') + '」之后，' + micro + '。\n' +
        '大目标：「' + (current.input || '') + '」，目标身份：「' + (identity || '待定') + '」。\n' +
        '当前：连续 ' + streak + ' 天，累计 ' + total + ' / ' + targetDays + ' 天。\n' +
        '请写 2 句（≤ 80 字），说明这件事对"成为' + (identity || '更好的自己') + '"意味着什么：\n' +
        '第一句把今天的具体动作与身份相连（不是泛泛夸赞）；第二句回应进展——若连续 ≥ 3 天说"从刻意到顺手"；若今天是最小版补做，认可"接住比完美重要"。\n' +
        '禁用"坚持"与说教。'
      );
      const aiTextVal = aiText(aiResp);
      if (aiTextVal && mb) mb.innerHTML = escapeHtml(aiTextVal.trim().slice(0, 220)).replace(/\n/g, '<br>');
      else if (aiErr(aiResp)) console.warn('AI meaning failed:', aiErr(aiResp).msg);
    }
  } catch(e){}

  w.classList.remove('hidden');
  w.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ===================== 步骤条（path/3节点，可回跳） ===================== */
const PUNCH_STEPS = [
  { label: '定目标', svg: '<svg viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>' },

];
let punchStep = 0;         // 当前所在 stage
let punchMaxReached = 0;    // 到达过的最远 stage（回跳边界：i<=punchMaxReached 才允许）
function calcMaxReachedFromDraft(){
  let m = 0;
  if (draft && draft.micro) m = Math.max(m, 1);
  if (draft && draft.micro && draft.anchor) m = Math.max(m, 2);
  return m;
}
function advancePunchStep(i){
  if (i > punchMaxReached) punchMaxReached = i;
  punchStep = i;
}
function renderPunchStepsBar(){
  const wrap = document.getElementById('punchStepsBarWrap');
  if (!wrap) return;
  // 已经创建实验（current）后不再显示
  if (typeof current !== 'undefined' && current && current.id && current.status !== 'archived'){
    const hasProgress = (current && current.currentDay) || (current && current.id);
    if (hasProgress) { wrap.innerHTML = ''; return; }
  }
  const nodes = PUNCH_STEPS.map((s, i) => {
    const cls = i === punchStep ? 'p-node active'
              : (i <= punchMaxReached) ? 'p-node done'
              : 'p-node disabled';
    const clickable = (i <= punchMaxReached) ? ' onclick="punchGo(' + i + ')"' : '';
    return `<div class="${cls}">
      <button type="button" ${clickable} aria-label="回到第 ${i+1} 步 ${s.label}">${s.svg}</button>
      <span class="p-label">${s.label}</span>
    </div>`;
  }).join('');
  wrap.innerHTML = `<div class="path" id="punchPath" data-progress="${punchStep + 1}">${nodes}</div>`;
}
function punchGo(i){
  if (i > punchMaxReached) return; // 没走到过的步骤禁止跳
  if (i === punchStep) return;     // 已在当前阶段
  const prev = punchStep;
  punchStep = i; // 仅改 punchStep，punchMaxReached 保持
  if (i === 0) { renderPunchStepsBar(); renderCreate(); return; }
  if (i === 1) {
    if (!draft.micro){ punchStep = prev; renderPunchStepsBar(); toast('先重新定目标，让 Transform 给出建议'); return; }
    renderPunchStepsBar(); renderPlanDraft();
    toast('如需调整计划内容，可修改目标后点「重新出题 →」');
    return;
  }
  if (i === 2) {
    if (!draft.micro){ punchStep = prev; renderPunchStepsBar(); return; }
    renderPunchStepsBar();
    renderTodayDraft(draft.anchors && draft.anchors.length ? draft.anchors : ['在我早上拿起手机之后', '在我吃完午饭后', '在我晚上睡前']);
    return;
  }
}

  const { data: d, error: aiErr0 } = await aiExperimentDraft(goal, 0, skipComplex);

    renderAIDebugCard(goal, aiErr0);

  if (d.isComplex) renderFocusConfirm();

      <div class="sc-micro-card" style="background:var(--amber-soft);font-size:14px;">${escapeHtml(msg)}</div>

      <div class="sc-field">AI 原始响应（前 800 字）</div>
      <pre style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;font-family:var(--font-mono);white-space:pre-wrap;word-break:break-word;line-height:1.5;max-height:300px;overflow:auto;color:var(--ink-2);">${escapeHtml(detail.slice(0, 800))}${detail.length > 800 ? '\n...(截断，原始 ' + detail.length + ' 字)' : ''}</pre>

      <div class="sc-field">常见原因</div>
      <ul style="font-size:13px;line-height:1.7;color:var(--ink-2);padding-left:20px;margin:6px 0 14px;">
        <li><b>PARSE</b>：AI 返回的不是有效 JSON（可能包了 markdown / prose / 截断）。检查上面"原始响应"。</li>
        <li><b>NETWORK</b>：网络/CORS 失败——GitHub Pages 跨域调用被浏览器拦截。</li>
        <li><b>HTTP_401/403</b>：API Key 无效或权限不足。检查设置里的 brand + apiKey。</li>
        <li><b>HTTP_404</b>：API 地址或模型名错。检查 brand（DeepSeek/OpenAI/Gemini）。</li>
        <li><b>HTTP_429</b>：请求过快或余额不足。稍后重试。</li>
        <li><b>NO_KEY</b>：API Key 未配置。</li>
      </ul>

      <button class="cta-confirm" onclick="location.reload()">刷新页面（清除缓存）</button>
      <button class="ai-btn-cap" style="margin-left:8px;" onclick="document.querySelector('#debugCard')?.remove()">关闭</button>
    </div>`;
}

/* ---------- Stage 1：AI 拆解建议（长度 + 理由 + 每日行动） ---------- */
async function aiExperimentDraft(goal, lenHint, skipComplex){
  const lenRule = lenHint > 0
    ? `\n用户指定实验长度为 ${lenHint} 天，请用 planLength = ${lenHint}。`
    : `\n- 根据目标自动选择实验长度：\n  * 1 天：一次性动作（如「锁门前检查煤气」）。\n  * 3 天：短期习惯确认（如「专注 10 分钟做一件事」）。\n  * 7 天：真正要养成的习惯（如「每天早上一杯温水」）。\n  * 14-30 天：深度改变（如「成为行业专家」）。`;
  const complexityRule = skipComplex
    ? `\n目标已由洞察收窄为聚焦处境（skipComplex）：isComplex 恒为 false，直接围绕目标拆解，不做复杂度判断。`
    : `\n拆解前先判断一次目标的体量：\n- 若目标是**小而具体的行为**（如「每天早上一杯温水」「晚饭后拉伸 2 分钟」）→ isComplex=false，直接按目标拆。\n- 若目标是**宏大 / 抽象 / 长期 / 复合处境**（如「成为行业专家」「改善和家人关系」「培养表达能力」）→ isComplex=true，此时**不要直接拆大目标**：先把它收窄为「最近一周每天都能实验的一个具体处境」focus（一句话、可每天行动、30 秒能开个头、不靠他人），focusReason 用 ≤40 字说明为何这样收窄；随后 days / micro / steps / anchors 一律围绕 focus 展开，不要回到大目标。`;
  const prompt = `用户的改变目标：「${goal}」\n认知起点：本质「${handoffNature || '未提供'}」洞察「${handoffInsight || '未提供'}」\n\n任务：构建一个行为实验草案。${lenRule}${complexityRule}\n\n关键要求（避免"愚蠢的社交行为清单"）：\n- 不要把目标拆成"向同事问好/分享/邀请喝咖啡/午餐社交"这类通用社交行为——除非目标本身明确是社交。\n- 拆解的方向应是**元能力 + 具体微行动**：\n  · 学习/研究：学一个具体的知识点、读一段文档、练习一个具体技能\n  · 创作/产出：写一段话、做一个小东西、记录一个观察\n  · 复盘/反思：写下今天的发现、对比预期与结果\n  · 习惯固化：把一件大事缩小到 30 秒内、与已有的日常动作挂钩\n- micro（今天的行动）必须是**用户自己一个人、在 30 秒内、不靠他人**就能完成的。\n- steps 是 micro 的 2-3 步子动作，每步 ≤10 字，顺序明确。\n- anchors 选用户最容易触发的那一刻（起床后/打开电脑/吃完饭/睡前），用"在____之后"格式。\n- days 每天一个渐进动作，Day 1 = micro。\n\n严格按 JSON 输出：\n{"planLength":7,"rationale":"...","isComplex":false,"focus":"","focusReason":"","micro":"...","steps":["...","..."],"anchors":["在早上打开电脑之后","在午饭后","在晚上睡前"],"days":[{"day":1,"micro":"..."},...,{"day":N,"micro":"..."}]}`;
  for (let attempt = 0; attempt < 3; attempt++){
    const aiResp = await aiCall(prompt);
    if (aiErr(aiResp)) return { data: null, error: aiResp };
    const r = aiText(aiResp);
    const d = parseJSON(r);
    if (d && d.micro && d.micro.trim() && Array.isArray(d.days)){
      const N = [1,3,7,14,30].includes(parseInt(d.planLength)) ? parseInt(d.planLength) : d.days.length;
      const focusTxt = String(d.focus || '').trim();
      const isComplex = skipComplex ? false : !!(d.isComplex && focusTxt);
      return {
        data: {
          planLength: N,
          rationale: String(d.rationale || '').trim().slice(0, 120),
          micro: d.micro.trim().slice(0, 60),
          steps: Array.isArray(d.steps) ? d.steps.map(x => String(x).trim().slice(0, 20)).filter(Boolean).slice(0, 3) : [],
          anchors: Array.isArray(d.anchors) ? d.anchors.map(x => String(x).trim().slice(0, 30)).filter(Boolean).slice(0, 3) : [],
          days: d.days.map(x => String(x.micro || '').trim().slice(0, 60)).filter(Boolean).slice(0, N),
          isComplex,
          focus: focusTxt.slice(0, 60),
          focusReason: String(d.focusReason || '').trim().slice(0, 60)
        },
        error: null
      };
    }
    // 失败：把原始响应带回去（最后一次）
    var lastErr = { kind: 'PARSE', msg: 'AI 返回的内容 3 次都解析失败', detail: r || '(空响应)' };
  }
  return { data: null, error: lastErr };
}

function applyDraft(d){
  draft.micro = d.micro;
  draft.steps = d.steps.length ? d.steps : ['完成这一小步'];
  draft.days = d.days;
  draft.planLength = d.planLength;
  draft.targetDays = d.planLength;
  draft.rationale = d.rationale;
  draft.anchors = d.anchors;
  draft.focus = (d.focus || '').trim();
  draft.focusReason = (d.focusReason || '').trim();
  draft.isComplex = !!d.isComplex;
}

function renderPlanDraft(){
  const area = $('punchArea');
  const N = draft.planLength || 7;
  // 7 天整体任务（保留 + 折叠/展开）
  const daysHtml = draft.days.map((d, i) => `
    <div class="plan-day${i === 0 ? ' today' : ''}">
      <span class="plan-day-label">Day ${i + 1}${i === 0 ? '（今天）' : ''}</span>
      <span class="plan-day-text">${escapeHtml(d)}</span>
    </div>
  `).join('');
  area.innerHTML = `
    <div class="suggest-card">
      <div class="sc-tag">第 1 步 · 实验拆解</div>
      <div class="sc-title">Transform 建议 <b>${N}</b> 天实验</div>
      ${draft.rationale ? `<div class="sc-rationale">${escapeHtml(draft.rationale)}</div>` : ''}

      <div class="sc-field">今天要做的微行动</div>
      <div class="sc-micro-card">${escapeHtml(draft.micro)}</div>

      <details class="sc-details">
        <summary>查看本周 ${N} 天整体任务（Day 1–${N}）</summary>
        <div class="plan-list" style="margin-top:10px;">${daysHtml}</div>
      </details>

      <button class="cta-confirm" onclick="goTodayDraft()">确认，开始今天 →</button>
      <div class="ai-out-box" id="aiOut"></div>
    </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}


/* ---------- 复杂目标收窄确认卡（补丁 A：入口目标分流） ---------- */
function renderFocusConfirm(){
  const area = $('punchArea');
  const focus = draft.focus || draft.micro;
  const N = draft.planLength || 7;
  area.innerHTML = `
    <div class="suggest-card fc-card">
      <div class="sc-tag">大目标 · 先收窄再拆解</div>
      <div class="sc-title">这个目标有点大</div>
      <div class="fc-line">「${escapeHtml(draft.rawGoal || draft.goal)}」一下子拆不到每天。先聚焦<b>最近一周能实验的一件事</b>：</div>
      <div class="fc-focus">${escapeHtml(focus)}</div>
      ${draft.focusReason ? `<div class="fc-reason">为什么这样收窄：${escapeHtml(draft.focusReason)}</div>` : ''}
      <div class="fc-plan-hint">已按这个处境拆好 ${N} 天计划。确认后即可开始；要更完整的长期规划，可去完整行动页。</div>
      <button type="button" class="cta-confirm" onclick="focusUseIt()">就用它拆解 →</button>
      <button type="button" class="cta-ghost-btn fc-ghost" onclick="focusRewrite()">自己改写</button>
      <a class="fc-full" href="act.html?goal=${encodeURIComponent(draft.rawGoal || draft.goal)}">要更完整的长期规划 → 去完整行动页创建</a>
    </div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function focusUseIt(){
  // 用户认可 AI 的收窄 → 以收窄后的处境作为实验主题（draft.goal 已被改写）
  if (draft.focus){ draft.goal = draft.focus; }
  if (draft.focusReason && !draft.rationale){ draft.rationale = draft.focusReason; }
  renderPlanDraft();
}
function focusRewrite(){
  // 想自己改 → 回到输入框，预填 AI 收窄版供微调（避免对着大目标无从下手）
  if (draft.focus) draft.goal = draft.focus;
  draft.focus = ''; draft.focusReason = ''; draft.isComplex = false;
  punchStep = 0;
  renderPunchStepsBar();
  renderCreate();
}

/* ---------- Stage 2：今日行动 + 锚点（用户互动） ---------- */
function goTodayDraft(){
  if (!draft.micro){ toast('拆解建议还没准备好'); return; }
  advancePunchStep(2);
  renderPunchStepsBar();
  renderTodayDraft(draft.anchors || ['在我早上拿起手机之后', '在我吃完午饭后', '在我晚上睡前']);
}

function renderTodayDraft(anchors){
  const area = $('punchArea');
  const stepsHtml = draft.steps.map((s, i) => `
    <div class="step-item plain">
      <span class="step-no">${i + 1}</span>
      <span class="step-text">${escapeHtml(s)}</span>
    </div>
  `).join('');
  const anchorBtns = anchors.map((a, i) => `
    <button type="button" class="anchor-key${draft.anchor === a ? ' sel' : ''}" onclick="pickAnchorChip(${i})" data-a="${escapeHtml(a)}">${escapeHtml(a)}</button>
  `).join('');
  const canConfirm = !!draft.anchor;
  const N0 = draft.planLength || 7;
  area.innerHTML = `
    <div class="suggest-card">
      <div class="sc-tag">第 3 步 · 定锚点</div>
      <h2 class="sc-title" id="todayTitle">这 ${N0} 天，都在哪个时刻做？</h2>
      <div class="sc-desc">只在这里定这一次。以后每天到了这个时刻就做——清单里也会每天提醒你。</div>

      <div class="sc-field">选一个触发时刻</div>
      <div class="anchor-grid" id="anchorGrid">
        ${anchorBtns}
        <div class="anchor-custom">
          <input class="anchor-input" id="anchorCustomInput" placeholder="自定义锚点：在____之后" maxlength="40">
          <button type="button" class="anchor-submit" onclick="useCustomAnchor()">使用这个</button>
        </div>
      </div>
      <div class="anchor-feedback" id="anchorFeedback">${draft.anchor ? '这 ' + N0 + ' 天都在「<b>' + escapeHtml(anchorText(draft.anchor)) + '</b>」之后做。到点就做，不用想。' : '选一个时刻，让这 ' + N0 + ' 天自动发生。'}</div>

      <div class="sc-field">今天要做的这一小步</div>
      <div class="sc-micro-card">${escapeHtml(draft.micro)}</div>

      <div class="sc-field">今天的小步骤</div>
      <div class="step-list" id="stepList">${stepsHtml}</div>

      <button class="cta-confirm" id="stageConfirmBtn" onclick="startExperiment()" ${canConfirm ? '' : 'disabled'}>${canConfirm ? '开始这 ' + N0 + ' 天的改变 →' : '先选一个触发时刻'}</button>
      <div class="ai-out-box" id="aiOut"></div>
    </div>`;
  if (!draft.anchor && !draft.userTypedAnchor) draft.anchor = anchors[0] || '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateStageConfirmBtn(){
  const canConfirm = !!draft.anchor;
  const btn = $('stageConfirmBtn'); if (!btn) return;
  btn.disabled = !canConfirm;
  btn.textContent = canConfirm ? ('开始这 ' + (draft.planLength || 7) + ' 天的改变 →') : '先选一个触发时刻';
}

function pickAnchorChip(i){
  const chips = document.querySelectorAll('.anchor-key');
  chips.forEach((c, j) => c.classList.toggle('sel', j === i));
  const sel = chips[i];
  if (sel) draft.anchor = (sel.getAttribute('data-a') || '');
  draft.userTypedAnchor = false;
  const inp = $('anchorCustomInput');
  if (inp) inp.classList.remove('anchor-input-active');
  anchorFeedbackSay('这 ' + (draft.planLength || 7) + ' 天都在「<b>' + escapeHtml(anchorText(draft.anchor)) + '</b>」之后做。到点就做，不用想。');
  updateStageConfirmBtn();
}

function anchorFeedbackSay(html){
  const fb = $('anchorFeedback');
  if (fb) fb.innerHTML = html;
}

function useCustomAnchor(){
  const inp = $('anchorCustomInput'); if (!inp) return;
  const v = (inp.value || '').trim();
  if (!v){ toast('先写一个锚点'); return; }
  draft.anchor = v;
  draft.userTypedAnchor = true;
  // 高亮已选中的自定义（移除其他 keys 的 sel）
  document.querySelectorAll('.anchor-key').forEach(c => c.classList.remove('sel'));
  inp.classList.add('anchor-input-active');
  anchorFeedbackSay('这 ' + (draft.planLength || 7) + ' 天都在「<b>' + escapeHtml(anchorText(v)) + '</b>」之后做。这个时刻很自然，做起来会更顺。');
  toast('已设置锚点：在「' + v + '」之后');
  updateStageConfirmBtn();
}

/* ---------- Stage 3：定锚点（一次，7 天通用）→ 开始实验 ---------- */

/* R-24：身份确认已从创建流程移除；锚点只在这里定一次，7 天通用 */
function startExperiment(){
  if (!draft.micro){ toast('今天的行动还没准备好'); return; }
  if (!draft.anchor){ toast('先选一个锚点时刻'); return; }
  createExperiment('');
}

async function createExperiment(identity){
  if (!draft.micro) { toast('先让 Transform 建议今天的改变'); return; }
  if (!draft.anchor) { toast('选一个锚点时刻'); return; }
  draft.identity = identity || '';
  const btn = $('confirmBtn');
  if (btn){ btn.classList.add('loading'); btn.disabled = true; }

  // 使用 Stage 1 已生成的计划（不再二次 AI 调用）
  const N = draft.planLength || draft.days.length || 7;
  const plan = (draft.days && draft.days.length)
    ? draft.days.slice(0, N).map((m, i) => ({ day: i + 1, micro: m.trim().slice(0, 60), sub: [], subDone: [] }))
    : (function(){ const p = [{day:1, micro:draft.micro, sub:[], subDone:[]}]; for (let d = 2; d <= N; d++) p.push({day:d, micro: ('继续完成「' + draft.micro + '」'), sub:[], subDone:[]}); return p; })();

  const goal = draft.goal || handoffScenario || '做到一件事';
  current = {
    id: 'a_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    input: (goal || '').trim() || draft.micro,
    createdAt: new Date().toISOString(),
    targetDays: N,
    currentDay: 1,
    plan,
    logs: [],
    status: 'active',
    streak: 0, totalDone: 0, bestStreak: 0,
    anchor: { after: draft.anchor },
    reminder: '',
    identity: identity,
    celebration: '',
    support: { people:[], tools:[], info:[] },
    source: 'punch',
    insight: handoffInsight || '',
    scenario: handoffScenario || '',
  };
  persistAction();
  draft = { goal:'', rawGoal:'', micro:'', steps:[], seconds:30, anchor:'', identity:'', days:[], planLength:7, targetDays:7, rationale:'', anchors:[], focus:'', focusReason:'', isComplex:false };
  renderPunchStepsBar();   // 已有进行中实验 → 清空步骤条，进入清单
  renderPunch();
}

/* ===================== 初始化 ===================== */
(function init(){
  punchStep = 0;
  punchMaxReached = calcMaxReachedFromDraft();
  renderPunchStepsBar();
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  // 从 think.html 跳转：携带洞察
  handoffInsight = (params.get('insight') || '').trim();
  handoffNature = (params.get('nature') || '').trim();
  handoffScenario = (params.get('scenario') || '').trim();
  // 路由优先级：
  // 1. ?id=xxx → 精确加载该实验
  // 2. 洞察 handoff → 创建态（带入认知起点）
  // 3. 有进行中的实验 → 默认直接进「今日行为」（A）——每日改变 = 每天做那一步，而不是每天定义主题
  // 4. 无任何进行中实验 → 创建态
  if (id){
    current = loadActions().find(a => a.id === id) || null;
    // 已归档的实验不进入打卡流（在「证据」中管理）
    if (current && current.status !== 'archived' && !current.archived){ renderPunchStepsBar(); renderPunch(); return; }
    renderCreate();
    return;
  }
  if (handoffInsight){
    renderCreate();
    return;
  }
  const actives = loadActions().filter(a => a.status === 'active' && !a.archived);
  if (actives.length){
    actives.sort((x, y) => String(y.createdAt || '').localeCompare(String(x.createdAt || '')));
    current = actives[0];
    renderPunchStepsBar();
    renderPunch();
    return;
  }
  // 无进行中实验 → 创建态
  renderCreate();
})();
</script>
