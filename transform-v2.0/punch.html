<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>每日进步 · Transform</title>
<style>
  :root {
    --bg: #F8F7F3;
    --surface: #FFFFFF;
    --surface-2: #F2F1EC;
    --ink: #151B19;
    --ink-2: #3D4A45;
    --ink-3: #7A8A83;
    --line: #E6E9E7;
    --line-2: #DDE2DF;
    --green: #0E6B50;
    --green-deep: #0A5A42;
    --green-2: #158A68;
    --green-3: #1D9E75;
    --green-soft: #E8F4EE;
    --green-light: #C8EBD9;
    --green-50: #F0F9F4;
    --amber: #C87A2A;
    --amber-soft: #FDF3E6;
    --amber-2: #EAA052;
    --coral: #C05B3C;
    --coral-soft: #F9EBE5;
    --violet: #5B4AA8;
    --violet-soft: #EEECFA;
    --radius-xl: 32px;
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow-1: 0 1px 2px rgba(21,27,25,.04);
    --shadow-2: 0 4px 12px rgba(21,27,25,.06), 0 16px 40px rgba(21,27,25,.08);
    --shadow-3: 0 8px 24px rgba(21,27,25,.08), 0 32px 64px rgba(21,27,25,.12);
    --ease: cubic-bezier(.16,1,.3,1);
  }
  [data-theme="dark"] {
    --bg: #0C100F;
    --surface: #161C1A;
    --surface-2: #1E2523;
    --ink: #EEF4F1;
    --ink-2: #A7B6B0;
    --ink-3: #6A7A74;
    --line: #252E2C;
    --line-2: #2F3A37;
    --green: #34D29E;
    --green-2: #2BBB8A;
    --green-3: #1D9E75;
    --green-soft: #132A24;
    --green-light: #1E4A3E;
    --green-50: #0F1F1B;
    --amber: #EAA052;
    --amber-soft: #2E2417;
    --coral: #D9714F;
    --coral-soft: #2E1E18;
    --violet: #A99BE8;
    --violet-soft: #23203A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh;
  }
  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 0 20px 110px; }

  /* 完整版伴我改变入口（底部小链接） */
  .full-link-bar {
    text-align: center; margin-top: 24px; padding: 16px 0 0;
    border-top: 1px dashed var(--line);
  }
  .full-link-bar a {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13.5px; font-weight: 700; color: var(--amber);
    text-decoration: none; padding: 8px 16px; border-radius: 999px;
    transition: all .2s;
  }
  .full-link-bar a:hover { background: var(--amber-soft); }

  /* ===== 顶栏 ===== */
  .topbar { display: flex; align-items: center; gap: 10px; padding: 16px 0; flex-wrap: wrap; }
  /* ===== 全局导航（所有页面互跳） ===== */
  .gnav {
    display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0;
    padding: 4px; border-radius: 999px; background: var(--surface-2);
    justify-content: center; flex-wrap: wrap;
  }
  .gnav .gn-item {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 12px; border-radius: 999px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-2);
    text-decoration: none; white-space: nowrap; transition: all .2s;
    flex-shrink: 0;
  }
  .gnav .gn-item:hover { color: var(--green); background: var(--green-soft); }
  .gnav .gn-item.on { background: var(--green); color: #fff; font-weight: 700; }
  /* 主题切换按钮双 span（t-light 默认显示，t-dark 仅深色时显示） */
  .t-dark { display: none; }
  [data-theme="dark"] .t-light { display: none; }
  [data-theme="dark"] .t-dark { display: inline; }
  @media (max-width: 720px) {
    .topbar { gap: 6px; }
    .topbar .back { order: 1; }
    .topbar .spacer { display: none; }
    .gnav { order: 3; width: 100%; flex: none; padding: 6px; gap: 4px; }
    .gnav .gn-item { flex: 1 1 calc(50% - 4px); padding: 9px 10px; font-size: 12.5px; justify-content: center; white-space: nowrap; }
    .topbar .theme-toggle, .topbar .arch-btn, .topbar button { order: 2; padding: 8px 12px; font-size: 12.5px; }
  }
  .back {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); text-decoration: none;
    font-size: 14px; font-weight: 600; padding: 9px 14px; border-radius: 999px; transition: all .2s;
  }
  .back:hover { background: var(--surface-2); color: var(--ink); }
  .topbar .spacer { flex: 1; }
  .topbar button {
    display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13.5px;
    padding: 9px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .topbar button:hover { color: var(--ink); border-color: var(--line-2); }
  .arch-btn { background: linear-gradient(135deg, #0A5A42, #0E6B50) !important; color: #fff !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(14,107,80,.22); }
  .arch-btn:hover { color: #fff !important; border-color: transparent !important; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(14,107,80,.32); }
  /* 高特异性：覆盖 .topbar button */
  .topbar button.arch-btn,
  .topbar button.arch-btn:hover { background: linear-gradient(135deg, #0A5A42, #0E6B50) !important; color: #fff !important; border-color: transparent !important; box-shadow: 0 4px 12px rgba(14,107,80,.22); }

  /* ===== 极简打卡态（think 同款） ===== */
  .cta-done {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 18px; border: none; border-radius: 14px;
    background: var(--green-3); color: #fff; font-size: 18px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease); box-shadow: 0 8px 24px rgba(29,158,117,.28);
  }
  .cta-done:hover { transform: translateY(-2px); background: var(--green-2); box-shadow: 0 12px 32px rgba(29,158,117,.36); }
  .cta-done:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .cta-miss {
    display: block; width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px;
    background: transparent; border: 1.5px dashed var(--line-2); color: var(--ink-3); font-size: 14px;
    cursor: pointer; font-family: inherit; transition: all .2s;
  }
  .cta-miss:hover { border-color: var(--amber); color: var(--amber); }
  .tf-hint {
    margin-top: 14px; padding: 12px 14px; background: var(--surface-2); border-radius: 12px;
    font-size: 13.5px; color: var(--ink-2); line-height: 1.6; text-align: center;
  }
  .tf-hint b, .tf-hint strong { color: var(--green); font-weight: 800; }

  /* ===== 今日反馈卡 ===== */
  .today-feedback { margin-top: 14px; }
  .today-feedback.hidden { display: none; }
  .tf-card {
    background: linear-gradient(135deg, var(--green-soft) 0%, var(--green-50) 100%);
    border: 1.5px solid var(--green-light); border-radius: var(--radius-lg);
    padding: 24px 22px 16px; text-align: center;
    box-shadow: 0 8px 28px rgba(29,158,117,.14);
    animation: tf-slide .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes tf-slide { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .tf-crown { font-size: 40px; line-height: 1; margin-bottom: 6px; animation: tf-bounce 1.4s ease infinite; }
  @keyframes tf-bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .tf-title { font-size: 21px; font-weight: 800; color: var(--green); margin-bottom: 8px; }
  .tf-body { font-size: 15px; color: var(--ink); line-height: 1.7; margin-bottom: 14px; }
  .tf-stats { display: flex; justify-content: center; gap: 22px; padding: 12px 0; border-top: 1px dashed var(--green-light); border-bottom: 1px dashed var(--green-light); }
  .tf-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tf-stat span { font-size: 11px; color: var(--ink-3); }
  .tf-stat b { font-size: 24px; font-weight: 800; color: var(--green); line-height: 1; }
  .tf-stat em { font-size: 10px; color: var(--ink-3); font-style: normal; }
  .tf-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 10px; }
  .tf-section {
    text-align: left;
    background: var(--green-50); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .tf-section-label {
    font-size: 12px; font-weight: 700; color: var(--green-deep);
    letter-spacing: .4px; margin-bottom: 4px;
  }
  .tf-section-body {
    font-size: 14px; color: var(--ink); line-height: 1.7;
  }
  .tf-progress {
    text-align: left; margin: 14px 0 12px;
  }
  .tf-progress-label {
    font-size: 12px; font-weight: 700; color: var(--ink-2);
    margin-bottom: 6px;
  }
  .tf-progress-bar {
    height: 10px; border-radius: 999px; background: var(--green-50);
    overflow: hidden; position: relative;
  }
  .tf-progress-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--green), var(--green-3));
    transition: width .6s ease;
  }
  .tf-progress-text {
    font-size: 12px; color: var(--ink-3); margin-top: 4px;
  }
  .tf-actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .tf-upgrade { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--green-light); text-align: center; }
  .tu-q { font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
  .tu-link { display: inline-block; font-size: 13.5px; font-weight: 700; color: var(--green-deep); text-decoration: none; border-bottom: 1.5px solid var(--green); padding-bottom: 1px; }
  .tu-link:hover { color: var(--green); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 22px; border-radius: 999px; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; border: none; transition: all .25s var(--ease);
  }
  .btn-ghost { background: var(--surface); color: var(--green); border: 1.5px solid var(--green-light); }
  .btn-ghost:hover { border-color: var(--green); background: var(--green-50); }
  .btn-primary { background: var(--green-3); color: #fff; }
  .btn-primary:hover { background: var(--green-2); }
  .btn-amber { background: var(--amber); color: #fff; }
  .btn-amber:hover { filter: brightness(1.06); }

  /* ===== 没做到面板 ===== */
  .block-box { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 18px; display: none; }
  .block-box h3 { font-size: 15px; font-weight: 800; margin-bottom: 12px; }
  .reason-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .reason {
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 12px; font-size: 13.5px; color: var(--ink); cursor: pointer; font-family: inherit;
    text-align: left; line-height: 1.5; transition: all .2s;
  }
  .reason b { display: block; font-size: 15px; }
  .reason:hover { border-color: var(--amber); background: var(--amber-soft); }
  .ai-result { margin-top: 12px; background: var(--green-soft); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13.5px; line-height: 1.7; }

  /* ===== 执行态 v3：周进度条 + 徽章 + AI 反馈对话（think 同款） ===== */
  .pw-week { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
  .pw-bar { flex: 1; height: 8px; border-radius: 999px; background: rgba(255,255,255,.25); overflow: hidden; }
  .pw-fill { height: 100%; border-radius: 999px; background: #fff; transition: width .5s ease; }
  .pw-label { font-size: 12px; opacity: .9; white-space: nowrap; }
  .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.35);
    color: #fff; font-size: 12px; font-weight: 700; letter-spacing: .3px;
  }
  .badge.locked { opacity: .45; }

  .ai-msg { display: flex; gap: 10px; margin-top: 14px; animation: bubble-in .3s ease; }
  .ai-avatar {
    width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--green), var(--green-3));
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px;
  }
  .ai-bubble {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px;
    padding: 12px 14px; font-size: 13.5px; line-height: 1.7; color: var(--ink);
  }
  .ai-bubble .ab-celebrate { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--green-deep); margin-bottom: 4px; }
  .confirm-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  .cta-ok {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px;
    background: var(--green); color: #fff; border: none; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: all .2s; box-shadow: 0 6px 18px rgba(14,107,80,.28);
  }
  .cta-ok:hover { background: var(--green-deep); transform: translateY(-1px); }
  .cta-ghost-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 999px;
    background: var(--surface); color: var(--ink-2); border: 1.5px solid var(--line-2);
    font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .cta-ghost-btn:hover { background: var(--green-soft); color: var(--green-deep); border-color: var(--green); }
  @keyframes bubble-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .today-prompt { margin-top: 12px; background: var(--amber-soft); border-left: 3px solid var(--amber); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.6; color: var(--ink); }
  .today-prompt b { color: var(--amber); }

  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== 创建态（think 同款风格） ===== */
  .create-hero {
    background: linear-gradient(135deg, #0A5A42, var(--green-3));
    border-radius: var(--radius-lg); padding: 30px 26px; color: #fff; margin-top: 8px;
  }
  .create-hero .ch-eyebrow { font-size: 12.5px; opacity: .85; letter-spacing: .5px; margin-bottom: 10px; }
  .create-hero h1 { font-size: 24px; font-weight: 800; line-height: 1.4; margin-bottom: 8px; }
  .create-hero p { font-size: 14px; opacity: .92; line-height: 1.7; margin-bottom: 18px; }
  .create-input {
    width: 100%; padding: 14px 16px; border-radius: 12px; border: none; font-size: 15px;
    font-family: inherit; color: var(--ink); outline: none; background: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  .create-input::placeholder { color: var(--ink-3); }
  .cta-start {
    display: block; width: 100%; margin-top: 12px; padding: 15px; border: none; border-radius: 12px;
    background: #fff; color: #0A5A42; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease);
  }
  .cta-start:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.18); }
  .cta-start:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  .ctx-card {
    background: var(--amber-soft); border: 1.5px solid rgba(200,122,42,.3); border-radius: var(--radius-md);
    padding: 14px 16px; margin-bottom: 14px;
  }
  .ctx-card .ctx-label { font-size: 11px; font-weight: 800; letter-spacing: 1px; color: var(--amber); margin-bottom: 6px; text-transform: uppercase; }
  .ctx-card .ctx-row { font-size: 13.5px; color: var(--ink); line-height: 1.7; }
  .ctx-card .ctx-row b { color: var(--amber); font-weight: 800; }

  .suggest-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    padding: 24px; margin-top: 16px;
  }
  .suggest-card .sc-tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800;
    letter-spacing: 1px; color: var(--green); margin-bottom: 12px; text-transform: uppercase;
  }
  .suggest-card .sc-title { font-size: 22px; font-weight: 800; line-height: 1.4; margin-bottom: 10px; color: var(--ink); letter-spacing: -.2px; }
  .sc-micro-card {
    background: linear-gradient(135deg, var(--green-50), var(--surface));
    border-left: 4px solid var(--green); border-radius: 12px;
    padding: 16px 18px; font-size: 17px; font-weight: 700; color: var(--ink);
    line-height: 1.5;
  }
  .suggest-card .sc-desc { font-size: 13.5px; color: var(--ink-2); line-height: 1.7; margin-bottom: 16px; }
  .sc-field { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin: 14px 0 8px; }
  .sc-rationale { background: var(--amber-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; color: var(--ink); margin: 6px 0 2px; }
  .sc-details {
    margin: 12px 0;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 14px;
    border: 1px solid var(--line);
  }
  .sc-details summary {
    font-size: 13.5px; font-weight: 700; color: var(--green-deep);
    cursor: pointer; user-select: none;
    list-style: none;
    display: flex; align-items: center; gap: 6px;
  }
  .sc-details summary::-webkit-details-marker { display: none; }
  .sc-details[open] summary { margin-bottom: 6px; }
  .sc-details summary:hover { color: var(--green); }
  .sc-row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .sc-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .sc-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px;
    border: 1.5px solid var(--line-2); background: var(--surface); color: var(--ink-2);
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all .2s;
  }
  .sc-chip:hover { border-color: var(--green); color: var(--green); background: var(--green-50); }
  .sc-chip.sel { background: var(--green); border-color: var(--green); color: #fff; }
  .sc-input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line-2);
    background: var(--surface); font-size: 14px; font-family: inherit; color: var(--ink); outline: none;
  }
  .sc-input:focus { border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(29,158,117,.1); }
  .plan-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px; }
  .plan-day { display: flex; align-items: baseline; gap: 12px; padding: 8px 12px; border-radius: 8px; background: var(--surface); font-size: 13.5px; line-height: 1.5; }
  .plan-day.today { background: var(--green-50); border-left: 3px solid var(--green); }
  .plan-day-label { flex-shrink: 0; font-weight: 700; color: var(--green-deep); min-width: 88px; font-size: 12px; letter-spacing: 0.3px; }
  .plan-day-text { color: var(--ink); flex: 1; word-break: break-word; overflow-wrap: anywhere; line-height: 1.45; }
  .sc-hint { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
  .sc-textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line-2); background: var(--surface); font-size: 13.5px; font-family: inherit; color: var(--ink); outline: none; resize: vertical; min-height: 56px; line-height: 1.5; box-sizing: border-box; }
  .sc-textarea:focus { border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(29,158,117,.1); }
  .sc-obstacle-result { background: var(--green-50); border-left: 3px solid var(--green); border-radius: 8px; padding: 10px 12px; margin-top: 8px; font-size: 13.5px; color: var(--ink); line-height: 1.6; }
  .sc-summary { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
  .sc-summary b { color: var(--green-deep); }
  .cta-confirm {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    margin-top: 16px; padding: 16px; border: none; border-radius: var(--radius-md);
    background: var(--green-3); color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; transition: all .25s var(--ease);
  }
  .cta-confirm:hover { transform: translateY(-2px); background: var(--green-2); }
  .cta-confirm:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* ===== Stage 2：checklist + 大按键 + 自定义锚点 ===== */

<script>
/* ===================== 数据层（与 act.html 完全互通） ===================== */
const LS_ACTIONS = 'trf_actions';
const LS_PROFILE = 'trf_profile';
const LS_AI = 'trf_ai_config_v1';
const BRAND_PROFILES = {
  'DeepSeek': { baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
  'OpenAI':   { baseUrl: 'https://api.openai.com/v1',  model: 'gpt-4o-mini' },
  'Gemini':   { baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai/', model: 'gemini-2.0-flash' }
};

let current = null; // 当前 Action

function $(id){ return document.getElementById(id); }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.remove('show'), ms || 2400);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('trf_theme', next); } catch(e){}
}
function getAI(){
  let cfg; try { cfg = JSON.parse(localStorage.getItem(LS_AI)) || {}; } catch(e){ cfg = {}; }
  const brand = cfg.brand || 'DeepSeek';
  const profile = BRAND_PROFILES[brand] || BRAND_PROFILES['DeepSeek'];
  return { brand, apiKey: cfg.apiKey || '', baseUrl: cfg.baseUrl || profile.baseUrl, model: cfg.model || profile.model };
}
function loadActions(){ try { return JSON.parse(localStorage.getItem(LS_ACTIONS)) || []; } catch(e){ return []; } }
function saveActions(list){ localStorage.setItem(LS_ACTIONS, JSON.stringify(list)); }
function loadProfile(){ try { return JSON.parse(localStorage.getItem(LS_PROFILE)) || { identityStatements: [] }; } catch(e){ return { identityStatements: [] }; } }
function saveProfile(p){ localStorage.setItem(LS_PROFILE, JSON.stringify(p)); }
function persistAction(){ const list = loadActions(); const i = list.findIndex(a => a.id === current.id); if (i >= 0) list[i] = current; else list.push(current); saveActions(list); }

async function aiCall(prompt, attempt = 1){
  const cfg = getAI();
  if (!cfg.apiKey) return { ok: false, kind: 'NO_KEY', msg: 'API Key 未配置（请到设置页填写）' };
  const url = cfg.baseUrl.replace(/\/$/, '') + '/chat/completions';
  const maxAttempts = 4;
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: cfg.model, messages: [{ role:'user', content: prompt }], temperature: 0.2, max_tokens: 2000 })
    });
    if (!res.ok){
      let errText = ''; try { errText = (await res.text()).slice(0, 200); } catch(e){}
      if (attempt < maxAttempts && [503,502,500,429].includes(res.status)){
        await new Promise(r => setTimeout(r, 250 * Math.pow(2, attempt)));
        return aiCall(prompt, attempt + 1);
      }
      console.error('[aiCall]', res.status, res.statusText, errText);
      // 友好提示
      let kind = 'HTTP_' + res.status, msg = res.status + ' ' + res.statusText;
      if (res.status === 401 || res.status === 403) msg = 'API Key 无效或权限不足（401/403）。检查设置里的 brand + apiKey';
      else if (res.status === 404) msg = 'API 地址或模型不存在（404）。检查 brand（DeepSeek/OpenAI/Gemini）';
      else if (res.status === 429) msg = '请求过快或余额不足（429）。稍后再试';
      return { ok: false, kind, msg, detail: errText };
    }
    return { ok: true, text: (await res.json()).choices[0].message.content };
  } catch(e){
    console.error('[aiCall] network/fetch error:', e);
    const hint = /fetch|network|CORS|SSL/i.test(String(e.message || e))
      ? '网络/CORS 失败：GitHub Pages 跨域调用被拦截。详见控制台'
      : ('调用失败：' + (e.message || e));
    return { ok: false, kind: 'NETWORK', msg: hint, detail: String(e) };
  }
}
function parseJSON(text){
  if (!text) return null;
  // 容错：去 markdown ```json ... ``` 包裹
  let s = String(text).replace(/^\s*```(?:json)?\s*/i, '').replace(/\s*```\s*$/i, '').trim();
  // 取第一个 { 到最后一个 } 的 JSON 块
  const first = s.indexOf('{'), last = s.lastIndexOf('}');
  if (first < 0 || last <= first) return null;
  try { return JSON.parse(s.slice(first, last + 1)); } catch(e){
    console.warn('[parseJSON] failed, raw text:\n', text);
    return null;
  }
}

// 适配器：老调用 r = await aiCall(prompt) 现在拿到 {ok, text/msg}，需要兼容老的字符串形式
function aiText(r){ return r && r.ok ? r.text : null; }
function aiErr(r){ return r && !r.ok ? r : null; }

/* ===================== 每日进步核心 ===================== */
function logCompletion(done, day, difficulty, note){
  const today = new Date(); today.setHours(0,0,0,0);
  const lastDone = (current.logs || []).filter(l => l.done).slice(-1)[0];
  if (done){
    current.logs.push({ day, date: new Date().toISOString(), done: true, difficulty: difficulty||null, note: note||'' });
    current.totalDone = (current.totalDone || 0) + 1;
    if (lastDone){
      const ld = new Date(lastDone.date); ld.setHours(0,0,0,0);
      const diff = Math.round((today - ld) / 86400000);
      if (diff === 1) current.streak = (current.streak || 0) + 1;
      else if (diff > 1) current.streak = 1;
    } else {
      current.streak = 1;
    }
    current.bestStreak = Math.max(current.bestStreak || 0, current.streak);
    current.currentDay = day + 1;
    if (current.currentDay > current.targetDays){
      current.status = 'graduated'; current.graduatedAt = new Date().toISOString();
    } else current.status = 'active';
    if (current.identity){
      const profile = loadProfile();
      profile.identityStatements = profile.identityStatements || [];
      const ex = profile.identityStatements.find(s => s.text === current.identity);
      if (ex){ ex.votes = (ex.votes||0) + 1; ex.date = new Date().toISOString(); ex.source = 'action'; }
      else profile.identityStatements.push({ text: current.identity, votes: 1, date: new Date().toISOString(), source: 'action' });
      saveProfile(profile);
    }
  } else {
    current.logs.push({ day, date: new Date().toISOString(), done: false, difficulty: difficulty||null, note: note||'' });
    current.streak = 0;
  }
  persistAction();
}

/* ===================== 极简打卡态（think 同款） ===================== */

    <div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:6px;opacity:.92;">
      <span>累计 <b style="font-size:16px;">${current.totalDone || 0}</b> 天</span>
      <span>已用行动证明 <b style="font-size:16px;">${votes}</b> 次</span>
    </div>
    ${renderWeekProgress()}
    ${renderBadges()}

  // 今日提示（按周确定 · 多样：锚点 / 情境 / 提醒 —— 福格 prompt 类型）
  const promptText = todayPrompt(micro, anchor, current);
  if (promptText){
    html += `<div class="today-prompt">${promptText}</div>`;
  }

  // 大做完了按钮（轻，无负担）
  html += `<button class="cta-done" id="doneBtn" onclick="markDone()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    做到了
  </button>
  <button class="cta-miss" onclick="showBlock()">今天没做到</button>

  <div class="block-box" id="blockBox">
    <h3>发生了什么？选一个最接近的（AI 会给你具体建议）</h3>
    <div class="reason-grid">
      <button class="reason" onclick="pickReason('忘了')"><b>忘了</b>压根没想起来</button>
      <button class="reason" onclick="pickReason('太麻烦')"><b>太麻烦</b>步骤太多不想动</button>

    </div>
    <div id="aiBlockResult"></div>
    <div class="btn" style="margin-top:12px;width:100%;" onclick="hideBlock()">← 返回</div>
  </div>

  <!-- 今日反馈（具体 + 意义 + 进度 + 确认闭环） -->
  <div class="today-feedback hidden" id="todayFeedbackWrap">
    <div class="tf-card">
      <div class="tf-crown" id="tfCrown">🎉</div>
      <div class="tf-title" id="tfTitle">第 X 天做到了！</div>

      <div class="tf-section">
        <div class="tf-section-label">✅ 今天完成</div>
        <div class="tf-section-body" id="tfDone"></div>
      </div>

      </div>

      <div class="tf-progress" id="tfProgress">
        <div class="tf-progress-label">本实验进度</div>
        <div class="tf-progress-bar"><div class="tf-progress-fill" id="tfProgressFill"></div></div>
        <div class="tf-progress-text" id="tfProgressText">0 / 7 天</div>
      </div>

        <div class="tf-stat"><span>连续</span><b id="tfStreak">0</b><em>天</em></div>

// 周进度条（本周做了 X/7）
function renderWeekProgress(){
  const total = current.targetDays || 7;
  const done = current.totalDone || 0;
  const inWeek = done % 7 || (done > 0 ? 7 : 0);
  const weekNum = Math.floor(done / 7) + 1;
  const pct = Math.min(100, Math.round((inWeek / 7) * 100));
  return `<div class="pw-week">
    <span class="pw-label">第 ${weekNum} 周 · 本周 ${inWeek}/7</span>
    <div class="pw-bar"><div class="pw-fill" style="width:${pct}%"></div></div>
  </div>`;
}

// 徽章：连续 / 累计里程碑
function renderBadges(){
  const streak = current.streak || 0;
  const total = current.totalDone || 0;
  const badges = [
    { got: streak >= 3,    label: '🔥 连续 3 天' },
    { got: streak >= 7,    label: '🏅 连续 7 天' },
    { got: total >= 7,     label: '📦 累计 7 天' },
    { got: total >= 21,    label: '🌟 累计 21 天' },
    { got: total >= 30,    label: '👑 累计 30 天' }
  ];
  const rows = badges.map(b => `<span class="badge${b.got ? '' : ' locked'}">${b.label}</span>`).join('');
  return `<div class="badge-row">${rows}</div>`;
}

// 今日提示（按周确定 · 多样 prompt 类型）
function todayPrompt(micro, anchor, cur){
  const done = cur.totalDone || 0;
  const weekNum = Math.floor(done / 7) + 1;
  const prompts = [
    { type: '锚点', text: '记住锚点：在「' + (anchor||'那个时刻') + '」之后，立刻做。不用想，直接做。' },
    { type: '情境', text: '情境提示：把要做的东西放在眼前（如把文件放桌面、水杯放枕边），让环境提醒你。' },
    { type: '微习惯', text: '今天只做这一件 30 秒的小事，做完了就赢了。' }
  ];
  const p = prompts[(weekNum - 1) % prompts.length];
  return '<b>' + p.type + '提示 · 第 ' + weekNum + ' 周：</b>' + p.text;
}

function countVotes(){
  const profile = loadProfile();
  if (!current || !current.identity) return 0;
  const stmt = (profile.identityStatements || []).filter(s => s.source === 'action' && s.text === current.identity)[0];
  return stmt ? stmt.votes : 0;
}

function markDone(){
  const today = current.plan.find(p => p.day === current.currentDay);
  if (today && today.sub && today.sub.length && !today.subDone.every(Boolean)){ toast('先把今天的几步都勾上'); return; }
  logCompletion(true, current.currentDay, null, '');
  if (current.status === 'graduated'){
    renderPunch();
    toast('全部完成！新的习惯和角色已生根 🎓');
    return;
  }
  renderPunch();
  showTodayFeedback();
}

function hideTodayFeedback(){
  const w = $('todayFeedbackWrap'); if (w) w.classList.add('hidden');
}

// 确认闭环：反馈已看，今天结束，进入明天
function confirmDone(){
  hideTodayFeedback();
  renderPunch();
  toast('闭环完成 · 明天的小事已就位');
}

async function showTodayFeedback(){
  if (!current) return;
  const w = $('todayFeedbackWrap'); if (!w) return;
  const day = current.currentDay - 1;
  const streak = current.streak || 0;
  const total = current.totalDone || 0;
  const todayPlan = current.plan[current.currentDay - 2] || current.plan[current.currentDay - 1];
  const micro = (todayPlan && todayPlan.micro) || current.input;
  const anchor = current.anchor && current.anchor.after;
  const steps = (todayPlan && todayPlan.steps) || [];
  const votes = countVotes();
  const isFirst = day <= 0;
  const targetDays = current.targetDays || 7;

  // 1. 标题
  $('tfCrown').textContent = isFirst ? '🚀' : ((day > 0 && day % 7 === 0) ? '🏆' : '🎉');
  $('tfTitle').textContent = isFirst ? '今天的行为实验开始了' : ('第 ' + day + ' 天做到了！');

  // 2. 今日完成（具体）
  const doneHtml = steps.length
    ? '在「' + (anchor || '那个时刻') + '」之后，<b>' + escapeHtml(micro) + '</b>。<br>完成的小步骤：' + steps.map(s => escapeHtml(s)).join(' · ')
    : '在「' + (anchor || '那个时刻') + '」之后，<b>' + escapeHtml(micro) + '</b>。';
  $('tfDone').innerHTML = doneHtml;

  // 3. 对改变的意义（AI 优先，否则本地拼接）
  const fallbackMeaning = (() => {
    const goal = current.input || '改变';
    const identity = current.identity || ('正在成为会完成的人');
    if (isFirst) return '这是「' + goal + '」的起点。从今天起，每一个完成都在为「' + identity + '」投票。';
    if (streak >= 3) return '已连续 ' + streak + ' 天。这个动作正从「刻意」变成「顺手」——这正是改变在发生的样子。';
    return '这是「' + goal + '」的第 ' + day + ' 天。每完成一次，都是在为「' + identity + '」投票。';
  })();
  $('tfBody').textContent = fallbackMeaning;

  // 4. 进度条
  const pct = Math.min(100, Math.round((total / targetDays) * 100));
  $('tfProgressFill').style.width = pct + '%';
  $('tfProgressText').textContent = '已完成 ' + total + ' / ' + targetDays + ' 天 · ' + pct + '%';

  // 5. 数据
  $('tfStreak').textContent = streak;
  $('tfTotal').textContent = total;
  $('tfVotes').textContent = '+1';

  w.classList.remove('hidden');
  w.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // 6. AI 反馈覆盖"对改变的意义"
  try {
    if (getAI().apiKey && micro) {
      const aiResp = await aiCall(
        '用户刚完成了一个「每日改变」实验的第 ' + day + ' 天。\n' +
        '今天具体做了：在「' + (anchor || '未指定') + '」之后，' + micro + '。\n' +
        '完成的小步骤：' + (steps.join('、') || '（无细分步骤）') + '。\n' +
        '用户的大目标：「' + (current.input || '') + '」，目标身份：「' + (current.identity || '待定') + '」。\n' +
        '当前状态：连续 ' + streak + ' 天，累计 ' + total + ' 天 / ' + targetDays + ' 天。\n' +
        '请写 2 句（≤ 80 字），讲清楚这件事对"成为' + (current.identity || '更好的自己') + '"的贡献：\n' +
        '1. 第一句：把今天做的事与用户的最终目标/身份连接起来（不是泛泛的"你真棒"）。\n' +
        '2. 第二句：如果连续 ≥ 3 天，说"从刻意到自然"的能力跃迁；如果第 1 天，说"第一票"；否则说"积累中的坚持"。\n' +
        '禁用"坚持"这个词，不要说教。'
      );
      const aiTextVal = aiText(aiResp);
      if (aiTextVal) $('tfBody').textContent = aiTextVal.trim().slice(0, 200);
      else if (aiErr(aiResp)) console.warn('AI meaning failed:', aiErr(aiResp).msg);
    }
  } catch(e){}
}

function localFailAdvice(reason){

  };

}

/* ---------- Stage 1：AI 拆解建议（长度 + 理由 + 每日行动） ---------- */
async function aiExperimentDraft(goal, lenHint){
  const lenRule = lenHint > 0
    ? `\n用户指定实验长度为 ${lenHint} 天，请用 planLength = ${lenHint}。`
    : `\n- 根据目标自动选择实验长度：\n  * 1 天：一次性动作（如「锁门前检查煤气」）。\n  * 3 天：短期习惯确认（如「专注 10 分钟做一件事」）。\n  * 7 天：真正要养成的习惯（如「每天早上一杯温水」）。\n  * 14-30 天：深度改变（如「成为 WorkBuddy 高手」）。`;
  const prompt = `用户的改变目标：「${goal}」\n认知起点：本质「${handoffNature || '未提供'}」洞察「${handoffInsight || '未提供'}」\n\n任务：构建一个行为实验草案。${lenRule}\n\n⚠️ 关键要求（避免"愚蠢的社交行为清单"）：\n- 不要把目标拆成"向同事问好/分享/邀请喝咖啡/午餐社交"这类通用社交行为——除非目标本身明确是社交。\n- 拆解的方向应是**元能力 + 具体微行动**：\n  · 学习/研究：学一个具体的知识点、读一段文档、练习一个具体技能\n  · 创作/产出：写一段话、做一个小东西、记录一个观察\n  · 复盘/反思：写下今天的发现、对比预期与结果\n  · 习惯固化：把一件大事缩小到 30 秒内、与已有的日常动作挂钩\n- micro（今天的行动）必须是**用户自己一个人、在 30 秒内、不靠他人**就能完成的。\n- steps 是 micro 的 2-3 步子动作，每步 ≤10 字，顺序明确。\n- anchors 选用户最容易触发的那一刻（起床后/打开电脑/吃完饭/睡前），用"在____之后"格式。\n- days 每天一个渐进动作，Day 1 = micro。\n\n严格按 JSON 输出：\n{"planLength":7,"rationale":"...","micro":"...","steps":["...","..."],"anchors":["在早震打开电脑之后","在午饭后","在晚上睡前"],"days":[{"day":1,"micro":"..."},...,{"day":N,"micro":"..."}]}`;
  for (let attempt = 0; attempt < 3; attempt++){
    const aiResp = await aiCall(prompt);
    if (aiErr(aiResp)) return { data: null, error: aiResp };
    const r = aiText(aiResp);
    const d = parseJSON(r);
    if (d && d.micro && d.micro.trim() && Array.isArray(d.days)){
      const N = [1,3,7,14,30].includes(parseInt(d.planLength)) ? parseInt(d.planLength) : d.days.length;
      return {
        data: {
          planLength: N,
          rationale: String(d.rationale || '').trim().slice(0, 120),
          micro: d.micro.trim().slice(0, 60),
          steps: Array.isArray(d.steps) ? d.steps.map(x => String(x).trim().slice(0, 20)).filter(Boolean).slice(0, 3) : [],
          anchors: Array.isArray(d.anchors) ? d.anchors.map(x => String(x).trim().slice(0, 30)).filter(Boolean).slice(0, 3) : [],
          days: d.days.map(x => String(x.micro || '').trim().slice(0, 60)).filter(Boolean).slice(0, N)
        },
        error: null
      };
    }
    // 失败：把原始响应带回去（最后一次）
    var lastErr = { kind: 'PARSE', msg: 'AI 返回的内容 3 次都解析失败', detail: r || '(空响应)' };
  }
  return { data: null, error: lastErr };
}

  draft.days = d.days;

async function confirmChange(){
  const identity = ($('identityInput').value || '').trim();
  if (!draft.micro) { toast('先让 Transform 建议今天的改变'); return; }
  if (!draft.anchor) { toast('选一个锚点时刻'); return; }
  if (!identity) { toast('写下你期待成为的人（每一次完成都在为它投票）'); return; }
  const btn = $('confirmBtn');
  btn.classList.add('loading'); btn.disabled = true;

  // 使用 Stage 1 已生成的计划（不再二次 AI 调用）
  const N = draft.planLength || draft.days.length || 7;
  const plan = (draft.days && draft.days.length)
    ? draft.days.slice(0, N).map((m, i) => ({ day: i + 1, micro: m.trim().slice(0, 60), sub: [], subDone: [] }))
    : (function(){ const p = [{day:1, micro:draft.micro, sub:[], subDone:[]}]; for (let d = 2; d <= N; d++) p.push({day:d, micro: ('继续完成「' + draft.micro + '」'), sub:[], subDone:[]}); return p; })();

  const goal = draft.goal || handoffScenario || '行为改变';
  current = {
    id: 'a_' + Date.now() + '_' + Math.floor(Math.random()*1000),
    input: (goal || '').trim() || draft.micro,
    createdAt: new Date().toISOString(),
    targetDays: N,
    currentDay: 1,
    plan,
    logs: [],
    status: 'active',
    streak: 0, totalDone: 0, bestStreak: 0,
    anchor: { after: draft.anchor },
    reminder: '',
    identity: identity,
    celebration: '',
    support: { people:[], tools:[], info:[] },
    source: 'punch',
    insight: handoffInsight || '',
    scenario: handoffScenario || '',
  };
  persistAction();
  draft = { goal:'', micro:'', steps:[], seconds:30, anchor:'', identity:'', days:[], planLength:7, targetDays:7, rationale:'', anchors:[] };
  renderPunch();
  // 第一次：引导完成今天的改变
  showTodayFeedback();
}

/* ===================== 初始化 ===================== */
(function init(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  // 从 think.html 跳转：携带洞察
  handoffInsight = (params.get('insight') || '').trim();
  handoffNature = (params.get('nature') || '').trim();
  handoffScenario = (params.get('scenario') || '').trim();
  // 1. URL ?insight= → 进入创建态并带入 handoff（从 think 来）
  // 2. URL ?id=xxx → 加载指定历史实验（修订或查看）
  // 3. 默认 → 进入创建态（开始一个新的行为实验）
  //    历史实验列在 hero 下方作为链接，不默认加载
  if (handoffInsight){
    renderCreate();
    return;
  }
  if (id){
    current = loadActions().find(a => a.id === id) || null;
    if (current && current.status === 'active'){ renderPunch(); return; }
    renderCreate();
    return;
  }
  // 默认创建态（不自动加载旧任务）
  renderCreate();
})();
</script>
