/* ============ 本地启发式引擎（免费、无 Key、永远可用，作云端降级） ============ */
const KW={
  control:[['自由','自主','选择','简单','清晰','安静','自定义','diy','掌控','不催','自助','灵活','轻松','一目了然','自己来'],
           ['推销','轰炸','复杂','强制','排队','套路','说教','催促','打扰','混乱','被迫','冗长']],
  deserved:[['高端','质感','设计','精选','身份','限量','仪式','心意','独特','高级','匠心','格调','小众','审美','高级感'],

        ['等待','无聊','失望','漫长','冷漠','无趣']]
};
function hash(str){let h=0;for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i);h|=0;}return Math.abs(h);}
function scorePillar(name,text){
  const [pos,neg]=KW[name];let s=5.4;
  pos.forEach(w=>{if(text.includes(w))s+=0.7;});
  neg.forEach(w=>{if(text.includes(w))s-=0.8;});
  const jitter=((hash(text+name)%100)/100-0.5)*1.1;
  s+=jitter;
  return Math.max(2.2,Math.min(9.3,+s.toFixed(1)));
}
function localScores(text){
  return {control:scorePillar('control',text),deserved:scorePillar('deserved',text),gratification:scorePillar('grat',text)};
}
function pillarWhy(name,sc){
  if(name==='control'){ if(sc>=7.5)return'自主权基本到位'; if(sc>=6)return'选择有但不够爽'; if(sc>=5)return'半推半就的自主'; return'被流程牵着走'; }
  if(name==='deserved'){ if(sc>=7.5)return'站队无压力'; if(sc>=6)return'面子差一口气'; if(sc>=5)return'配得感将就了'; return'不值得发圈'; }
  return (sc>=7.5)?'当下就开心':(sc>=6)?'爽点偏靠后':(sc>=5)?'惊喜不够密':'熬完才有点值';
}
function pickVerdict(sc,text){
  const arr=[['control','掌控感'],['deserved','配得感'],['gratification','满足感']];
  arr.sort((a,b)=>sc[a[0]]-sc[b[0]]);
  const weak=arr[0];const avg=(sc.control+sc.deserved+sc.gratification)/3;
  let head='';
  if(weak[0]==='control')head='它把选择权还给了年轻人吗？掌控感偏弱——少一点"为你安排"，多一点"你来决定"。';

  else head='少了点"此刻就开心"的瞬间。满足感偏弱——给一个低门槛的惊喜或反馈。';
  let tail = avg>=7.5?'Z含量在线，年轻人会买账。':avg>=5.5?'有底子，但偏科明显，修订后空间很大。':'离 Z 世代还差一口气，先补最弱的支柱。';
  return head+tail;
}
function getNoun(t){ if(!t)return'产品'; const keys=['早餐','自助餐','餐厅','奶茶','咖啡','店','APP','小程序','课程','会员','礼盒','耳机','手机','游戏','护肤品','口红','球鞋','盲盒','手办','周边','社群','服务','品牌','活动'];
  for(const k of keys){ if(t.includes(k)) return k; } return'产品'; }
function pickQuickwin(sc,desc){
  const arr=[['control','产品翻译','把"默认推荐"改成"你来决定"，删掉默认勾选与催促文案。'],
             ['deserved','包装翻译','出一款年轻化特别版视觉，让TA愿意为它"站队"。'],

  arr.sort((a,b)=>sc[a[0]]-sc[b[0]]);
  return {step:arr[0][1],text:arr[0][2]};
}
function pickHeadline(sc,desc){
  const arr=[['control','掌控感'],['deserved','配得感'],['gratification','满足感']];
  arr.sort((a,b)=>sc[a[0]]-sc[b[0]]);
  const w=arr[0][1]; const noun=getNoun(desc);
  const avg=(sc.control+sc.deserved+sc.gratification)/3;
  if(avg<4) return `这${noun}，年轻人不会多停留一秒。`;
  if(w==='掌控感') return `这${noun}把年轻人当小孩一样安排。`;
  if(w==='配得感') return `这${noun}让年轻人觉得不配发朋友圈。`;
  return `这${noun}全程没给年轻人一点爽点。`;
}

/* ============ 对话提纲（3–4 轮，围绕 Z 世代需求） ============ */
const QUESTIONS=[
  {pillar:'control',   q:'Z世代最烦被安排。用的时候，是TA自己说了算，还是被流程推着走？'},
  {pillar:'deserved',  q:'TA会愿意为它"站队"吗？它让人觉得"我值得拥有"，还是"将就一下"？'},

  return ['收到，记下了。','懂了，继续。','好，我懂你的意思。','记下了，往下走。'][qi%4];
}

let _cloudClient=null,_cloudLoading=null;
function ensureCloud(){
  if(_cloudClient)return Promise.resolve(_cloudClient);
  if(_cloudLoading)return _cloudLoading;
  if(typeof WorkBuddyCloud!=='undefined'){ try{_cloudClient=WorkBuddyCloud.createWorkBuddyCloud({endpoint:CFG.endpoint,publishableKey:CFG.publishableKey});return Promise.resolve(_cloudClient);}catch(e){} }
  _cloudLoading=new Promise(resolve=>{

    s.onload=()=>{ try{ if(typeof WorkBuddyCloud!=='undefined')_cloudClient=WorkBuddyCloud.createWorkBuddyCloud({endpoint:CFG.endpoint,publishableKey:CFG.publishableKey}); }catch(e){} resolve(_cloudClient); };
    s.onerror=()=>resolve(null);

function parseJSON(t){ try{return JSON.parse(t);}catch(e){ const m=t.match(/\{[\s\S]*\}/); if(m){try{return JSON.parse(m[0]);}catch(_){}} return null; } }
const PBG_STEPS=['产品翻译','包装翻译','沟通翻译','渠道翻译','社群翻译'];
function normalizeStep(s){ if(!s)return'产品翻译'; for(const k of PBG_STEPS){ if(s.includes(k))return k; } return'产品翻译'; }
async function streamText(cloud,sys,user,model){
  let ans='';
  const body={model:model||'auto',messages:[{role:'system',content:sys},{role:'user',content:user}],stream:true};
  for await(const ch of cloud.llm.chat.completions.create(body)){ const d=ch.choices?.[0]?.delta?.content; if(d)ans+=d; }
  return ans;
}
function withTimeout(p,ms){ return Promise.race([p,new Promise(r=>setTimeout(()=>r(''),ms))]); }
async function diagnoseCloud(){
  const cloud=await ensureCloud(); if(!cloud)return null;
  try{
    const models=await cloud.llm.models.list();
    let model=models.find(m=>m.disabled!==true && m.supportsImages===true) || models.find(m=>m.disabled!==true);
    if(!model)return null;
    const transcript=S.answers.map(a=>`问：${a.q}\n答：${a.a}`).join('\n');
    const sys='你是代际翻译顾问，专看产品对Z世代（1995–2009出生）的吸引力。'+
      '按三支柱(掌控感/配得感/满足感)各打0-10分。'+
      'control_why/deserved_why/grat_why 为「为什么打这分」，必须犀利、挑剔、≤15个汉字、直接点出与Z世代的适配问题。'+
      'headline 为≤18个汉字一句话，极度直接、像朋友吐槽一样描述这个产品的Z含量（可犀利）。'+
      'verdict 为≤40字一句话判词。'+
      'quickwin 为极具体、针对该产品的一条速赢建议，≤30个汉字，直接给动作，不要解释、不要括号补充、不要"针对…"套话。'+
      'step 必须且只能是以下五个之一（不要改写、不要加前缀）：产品翻译 / 包装翻译 / 沟通翻译 / 渠道翻译 / 社群翻译。'+
      '只输出JSON，不要解释，不要 markdown 代码块。';
    const userParts=[{type:'text',text:`产品/服务描述：${S.desc||'（无文字描述）'}\n\n对话记录：\n${transcript}\n\n请输出JSON：{control,deserved,gratification,control_why,deserved_why,grat_why,headline,verdict,quickwin,step}`}];
    if(S.photoData && model.supportsImages===true) userParts.unshift({type:'image_url',image_url:{url:S.photoData}});
    let ans=await streamText(cloud,sys,userParts,model.id);
    const o=parseJSON(ans); if(!o||typeof o.control==='undefined')return null;
    const clamp=v=>Math.max(2.2,Math.min(9.3,+v||5));
    return {control:clamp(o.control),deserved:clamp(o.deserved),gratification:clamp(o.gratification),
      control_why:o.control_why||pillarWhy('control',clamp(o.control)),
      deserved_why:o.deserved_why||pillarWhy('deserved',clamp(o.deserved)),
      grat_why:o.grat_why||pillarWhy('gratification',clamp(o.gratification)),
      headline:o.headline||'',verdict:o.verdict||'',quickwin:o.quickwin||'',step:normalizeStep(o.step),ai:true};
  }catch(e){ return null; }
}

/* ============ 屏幕 ============ */
function renderHome(){
  resetAll(); setSteps(1);
  $('#screen').innerHTML=`
  <div class="screen">
    <h1 class="hero">拍一张，<br>测测它的 Z 含量</h1>
    <p class="sub">上传任意产品 / 服务 / 品牌，AI 免费帮你看「Z 含量」三柱仪表 + 犀利点评 + 可分享卡。无需任何 Key。</p>
    <div class="card">
      <button class="bigbtn" onclick="pickCam()">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L19 6h0a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
        拍照测一测
      </button>
      <button class="bigbtn ghost" onclick="pickLib()">从相册选择</button>
      <button class="bigbtn ghost" onclick="demo()">看个演示（不用拍照）</button>
      <p class="sm">AI 由我们免费提供 · 不填 Key 也能跑（无网络时自动用本地趣味读数）</p>
    </div>
  </div>`;
}
function pickCam(){$('#fileCam').click();}
function pickLib(){$('#fileLib').click();}
function onFile(f){
  if(!f)return;S.photoName=f.name||'photo';S.photo=URL.createObjectURL(f);
  const rd=new FileReader();rd.onload=e=>S.photoData=e.target.result;rd.readAsDataURL(f);
  renderDescribe();
}
function demo(){S.photo=null;S.photoData=null;S.photoName='';S.desc='一家开了50年的本地自助早餐，上百种食物，和休闲客混在一起，吵且杂。';renderDescribe(true);}

function renderDescribe(isDemo){
  setSteps(2);
  $('#screen').innerHTML=`
  <div class="screen">
    <span class="flag">AI 免费诊断 · 4 轮对话</span>
    ${S.photo?`<img class="prev" src="${S.photo}">`:`<div class="card" style="text-align:center;color:var(--mut);font-size:13px;margin-bottom:14px">演示模式 · 无照片也能测</div>`}
    <label class="lbl">一句话描述它（给 AI 更多语境，分数更准）</label>
    <textarea id="desc" placeholder="例：传统自助餐，上百种食物，和休闲客混在一起，吵且杂">${esc(S.desc)}</textarea>
    <button class="next" onclick="goChat()">开始诊断 →</button>
    ${isDemo?'<p class="sm">已填入示例文案，直接点「开始诊断」</p>':''}
  </div>`;
}
function goChat(){
  S.desc=$('#desc').value.trim()||S.desc||'';
  S.qi=0;S.answers=[];
  setSteps(3);
  $('#screen').innerHTML=`<div class="screen"><div class="chat" id="chat"></div>
    <div class="chatinput"><input id="ans" placeholder="随便说两句…" autocomplete="off"><button onclick="sendAns()">发送</button></div></div>`;
  pushBot(QUESTIONS[0].q);
}
async function sendAns(){
  const v=$('#ans').value.trim(); if(!v)return;
  pushMe(v); S.answers.push({q:QUESTIONS[S.qi].q,a:v}); $('#ans').value='';
  botTyping();
  const reaction=await reactAsync(S.qi,QUESTIONS[S.qi].q,v);
  const t=document.querySelector('.typing'); if(t)t.remove();
  pushBot(reaction);
  if(S.qi<QUESTIONS.length-1){ S.qi++; setTimeout(()=>pushBot(QUESTIONS[S.qi].q),450); }
  else { setTimeout(computeAndShow,650); }
}
function pushBot(t){$('#chat').insertAdjacentHTML('beforeend',`<div class="bub bot">${esc(t)}</div>`);scrollC();}
function pushMe(t){$('#chat').insertAdjacentHTML('beforeend',`<div class="bub me">${esc(t)}</div>`);scrollC();}
function botTyping(){const c=$('#chat');if(!c)return;c.insertAdjacentHTML('beforeend',`<div class="bub bot typing"><i></i><i></i><i></i></div>`);scrollC();}
function scrollC(){const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;}

function computeAndShow(){
  botTyping();
  const combined=[S.desc,...S.answers.map(a=>a.a)].filter(Boolean).join(' ');
  diagnoseCloud().then(res=>{
    if(res&&res.control){
      S.scores={control:res.control,deserved:res.deserved,gratification:res.gratification};
      S.control_why=res.control_why;S.deserved_why=res.deserved_why;S.grat_why=res.grat_why;
      S.headline=res.headline||pickHeadline(S.scores,S.desc);
      S.verdict=res.verdict||pickVerdict(S.scores,combined);S.quickwin=res.quickwin||pickQuickwin(S.scores,S.desc).text;
      S.step=res.step||'产品翻译';S.ai=true;
    }else{
      const sc=localScores(combined);
      S.scores=sc;
      S.control_why=pillarWhy('control',sc.control);S.deserved_why=pillarWhy('deserved',sc.deserved);S.grat_why=pillarWhy('gratification',sc.gratification);
      S.headline=pickHeadline(sc,S.desc);
      S.verdict=pickVerdict(sc,combined);const qw=pickQuickwin(sc,S.desc);S.step=qw.step;S.quickwin=qw.text;S.ai=false;
    }
    const t=document.querySelector('.typing');if(t)t.remove();
    renderResult();
  });
}

function renderResult(){
  setSteps(4);
  const sc=S.scores;const avg=((sc.control+sc.deserved+sc.gratification)/3).toFixed(1);
  const C=251.2, circ=C*Math.PI;
  const pils=[
    ['掌控感','control','var(--c-control)',sc.control,S.control_why],
    ['配得感','deserved','var(--c-deserved)',sc.deserved,S.deserved_why],
    ['满足感','gratification','var(--c-grat)',sc.gratification,S.grat_why]
  ].map(([n,k,c,v,why])=>`<div class="pil"><div class="top"><span>${n}</span><span class="v">${v.toFixed(1)}</span></div>
    <div class="bar"><i style="background:${c}" data-w="${(v/10*100).toFixed(0)}"></i></div>
    <div class="why">↳ ${esc(why)}</div></div>`).join('');
  $('#screen').innerHTML=`
  <div class="screen">
    <button class="homebtn" onclick="renderHome()">← 回到首页，重新测一张</button>
    <span class="flag ${S.ai?'':'off'}">${S.ai?'AI 诊断 · 免费':'本地趣味读数'}</span>
    <div class="gauge">
      <div class="ring">
        <svg width="148" height="148"><circle cx="74" cy="74" r="64" fill="none" stroke="var(--line)" stroke-width="12"/>
          <circle cx="74" cy="74" r="64" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${circ}" stroke-dashoffset="${circ}" id="ring"/></svg>
        <div class="num"><b id="avg">0.0</b><span>Z 含量 / 10</span></div>
      </div>
      <div class="headline">${esc(S.headline)}</div>
    </div>
    <div class="card"><div class="pillars">${pils}</div></div>
    <div class="verdict">${esc(S.verdict)}</div>
    <div class="qw"><span class="tag">速赢攻略</span><div class="b">${esc(S.quickwin)}</div></div>
    <button class="sharebtn" onclick="drawCard()">生成分享卡 ↓</button>
    <a class="cta" href="${PRO_URL}" target="_blank" rel="noopener">解锁完整转型专案 →</a>
    <button class="retest" onclick="renderDescribe()">改一条描述，复测 ↺</button>
  </div>`;
  requestAnimationFrame(()=>{const r=$('#ring');if(r)r.style.strokeDashoffset=circ*(1-avg/10);});
  animateNum($('#avg'),+avg);
  setTimeout(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'),80);
}
function animateNum(el,to){let t=0;const id=setInterval(()=>{t+=0.2;if(t>=to){t=to;clearInterval(id);}el.textContent=t.toFixed(1);},20);}

/* ============ 分享卡（INS 风格 canvas → PNG，含大图/直接判词/速赢攻略/双二维码） ============ */
function pathRound(ctx,X,Y,w,h,r){ctx.beginPath();ctx.moveTo(X+r,Y);ctx.arcTo(X+w,Y,X+w,Y+h,r);ctx.arcTo(X+w,Y+h,X,Y+h,r);ctx.arcTo(X,Y+h,X,Y,r);ctx.arcTo(X,Y,X+w,Y,r);ctx.closePath();}
function wrapLines(ctx,text,maxW){
  const chars=[...String(text)]; let line='',res=[];
  for(const ch of chars){ if(line && ctx.measureText(line+ch).width>maxW){ res.push(line); line=ch; } else line+=ch; }
  if(line)res.push(line);
  return res;
}
function makeQR(url){ try{ const qr=qrcode(0,'M'); qr.addData(url); qr.make(); return qr.createDataURL(6,4); }catch(e){ return null; } }
function drawCard(){
  const sc=S.scores; const avg=((sc.control+sc.deserved+sc.gratification)/3).toFixed(1);
  const W=1080,H=1560,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const px=48,py=48,pw=W-96,ph=580,pr=32;
  // background
  x.fillStyle='#FFFFFF'; x.fillRect(0,0,W,H);
  // photo placeholder
  const pg=x.createLinearGradient(0,py,W,py+ph); pg.addColorStop(0,'#0CA678'); pg.addColorStop(1,'#09835E');
  x.fillStyle=pg; pathRound(x,px,py,pw,ph,pr); x.fill();
  // QR data urls
  const qrApp=makeQR(APP_URL), qrPro=makeQR(PRO_URL);
  const imgs={photo:null,qrApp:null,qrPro:null}; let pending=0;
  const load=(src,key)=>{ if(!src)return; pending++; const im=new Image(); im.onload=()=>{imgs[key]=im;ready();}; im.onerror=ready; im.src=src; };
  const ready=()=>{ if(--pending<=0) paint(); };
  load(S.photoData,'photo'); load(qrApp,'qrApp'); load(qrPro,'qrPro');
  if(pending===0) paint();

  function paint(){
    // photo
    if(imgs.photo){ x.save(); pathRound(x,px,py,pw,ph,pr); x.clip(); x.drawImage(imgs.photo,px,py,pw,ph); x.restore(); }
    // scrim for headline legibility
    const sg=x.createLinearGradient(0,py+ph*0.40,0,py+ph); sg.addColorStop(0,'rgba(0,0,0,0)'); sg.addColorStop(1,'rgba(0,0,0,0.62)');
    x.save(); pathRound(x,px,py,pw,ph,pr); x.clip(); x.fillStyle=sg; x.fillRect(px,py,pw,ph); x.restore();
    // tag pill
    x.fillStyle='rgba(255,255,255,0.94)'; pathRound(x,px+28,py+28,268,54,27); x.fill();
    x.fillStyle='#0CA678'; x.font='800 27px -apple-system,"PingFang SC",sans-serif'; x.textAlign='left'; x.fillText('Z 含量诊断',px+48,py+64);
    // headline over photo (the direct one-liner)
    x.fillStyle='#FFFFFF'; x.font='800 46px -apple-system,"PingFang SC",sans-serif'; x.textAlign='left';
    const hlines=wrapLines(x,S.headline||S.verdict||'',pw-56,58).slice(0,2);
    const hY=py+ph-44-(hlines.length-1)*58;
    hlines.forEach((ln,i)=>x.fillText(ln,px+28,hY+i*58));
    // ---- content below photo ----
    let y=py+ph+66; // ~662
    // score big + three pillar chips
    x.textAlign='left'; x.fillStyle='#0CA678'; x.font='800 96px -apple-system,sans-serif'; x.fillText(avg,px,y+72);
    x.fillStyle='#8A8A8F'; x.font='600 24px -apple-system,"PingFang SC",sans-serif'; x.fillText('Z 含量 / 10',px+ ((''+avg).length>3?262:206),y+34);
    const chips=[['掌控感',sc.control,'#3B82F6'],['配得感',sc.deserved,'#7C5CFC'],['满足感',sc.gratification,'#FF8A5B']];
    let cy=y-18;
    chips.forEach(([n,v,c])=>{
      x.textAlign='right'; x.fillStyle=c; x.font='800 32px -apple-system,sans-serif'; x.fillText(v.toFixed(1),W-px,cy+18);
      x.fillStyle='#18181B'; x.font='600 25px -apple-system,"PingFang SC",sans-serif'; x.fillText(n,W-px-78,cy+18);
      cy+=46;
    });
    // pillars detailed
    let py2=y+150;
    const rows=[['掌控感',sc.control,'#3B82F6',S.control_why],['配得感',sc.deserved,'#7C5CFC',S.deserved_why],['满足感',sc.gratification,'#FF8A5B',S.grat_why]];
    rows.forEach(([n,v,c,why])=>{
      x.textAlign='left'; x.fillStyle='#18181B'; x.font='700 28px -apple-system,"PingFang SC",sans-serif'; x.fillText(n,px,py2);
      x.textAlign='right'; x.fillStyle=c; x.font='800 30px -apple-system,sans-serif'; x.fillText(v.toFixed(1),W-px,py2);
      const bx=px,by=py2+16,bw=W-2*px,bh=14;
      x.fillStyle='#ECEAE6'; pathRound(x,bx,by,bw,bh,7); x.fill();
      x.fillStyle=c; pathRound(x,bx,by,bw*(v/10),bh,7); x.fill();
      x.textAlign='left'; x.fillStyle='#8A8A8F'; x.font='500 22px -apple-system,"PingFang SC",sans-serif';
      x.fillText('↳ '+why,bx,py2+54);
      py2+=94;
    });
    // 速赢攻略 block
    const qy=py2+24;
    x.fillStyle='#E7F6EF'; pathRound(x,px,qy,W-2*px,156,24); x.fill();
    x.textAlign='left'; x.fillStyle='#0CA678'; x.font='800 27px -apple-system,"PingFang SC",sans-serif'; x.fillText('速赢攻略',px+28,qy+48);
    x.fillStyle='#18181B'; x.font='600 25px -apple-system,"PingFang SC",sans-serif';
    wrapLines(x,S.quickwin,W-2*px-56).slice(0,2).forEach((ln,i)=>x.fillText(ln,px+28,qy+92+i*34));
    // QR row
    const qrY=qy+156+22, qrS=150;
    const drawQR=(key,qx,cap)=>{ if(imgs[key]){ x.fillStyle='#FFFFFF'; pathRound(x,qx,qrY,qrS,qrS,16); x.fill(); x.drawImage(imgs[key],qx,qrY,qrS,qrS); }
      else { x.fillStyle='#F2F2F2'; pathRound(x,qx,qrY,qrS,qrS,16); x.fill(); }
      x.fillStyle='#18181B'; x.font='700 23px -apple-system,"PingFang SC",sans-serif'; x.textAlign='center'; x.fillText(cap,qx+qrS/2,qrY+qrS+34); };
    drawQR('qrApp',px,'测你的一张');
    drawQR('qrPro',W-px-qrS,'看完整转型专案');
    x.textAlign='left';
    // download
    const a=document.createElement('a');a.download='Z含量-'+new Date().toISOString().slice(0,10)+'.png';a.href=cv.toDataURL('image/png');a.click();
  }
}
