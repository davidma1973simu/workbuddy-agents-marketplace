function hash(str){let h=0;for(let i=0;i<str.length;i++){h=(h<<5)-h+str.charCodeAt(i);h|=0;}return Math.abs(h);}
function scorePillar(name,text){
  const [pos,neg]=(EN?KW_EN:KW)[name];let s=4.6;
  const hay=EN?String(text||'').toLowerCase():String(text||'');
  pos.forEach(w=>{if(hay.includes(w))s+=0.7;});
  neg.forEach(w=>{if(hay.includes(w))s-=0.8;});
  const jitter=((hash(text+name)%100)/100-0.5)*1.1;
  s+=jitter;
  return Math.max(1,Math.min(10,+s.toFixed(1)));
}
function localScores(text){
  return {control:scorePillar('control',text),deserved:scorePillar('deserved',text),gratification:scorePillar('grat',text)};
}
function pillarWhy(name,sc){
  if(EN){
    if(name==='control'){ if(sc>=7.5)return'They call every shot'; if(sc>=6)return'Choice, but not enough'; if(sc>=5)return'Half-pushed autonomy'; if(sc>=3)return'Someone else decides'; return'Fully arranged for them'; }
    if(name==='deserved'){ if(sc>=7.5)return'No pressure to stand behind it'; if(sc>=6)return'One notch short of proud'; if(sc>=5)return'They settle for it'; if(sc>=3)return'Nothing to post'; return'Wouldn\'t want it seen'; }
    return (sc>=7.5)?'Good right there':(sc>=6)?'Payoff comes late':(sc>=5)?'Not enough small wins':(sc>=3)?'Only worth it later':'Not one good second';
  }
  if(name==='control'){ if(sc>=7.5)return'自主权基本到位'; if(sc>=6)return'选择有但不够爽'; if(sc>=5)return'半推半就的自主'; if(sc>=3)return'被流程牵着走'; return'全程别人替你安排'; }
  if(name==='deserved'){ if(sc>=7.5)return'站队无压力'; if(sc>=6)return'面子差一口气'; if(sc>=5)return'配得感将就了'; if(sc>=3)return'不值得发圈'; return'拿不出手，也不想被看见'; }
  return (sc>=7.5)?'当下就开心':(sc>=6)?'爽点偏靠后':(sc>=5)?'惊喜不够密':(sc>=3)?'熬完才有点值':'一秒都没爽过';
}
function pickVerdict(sc,text){
  const noun=getNoun(text);
  const arr=[['control',EN?'control':'掌控感'],['deserved',EN?'identity':'配得感'],['gratification',EN?'delight':'满足感']];
  arr.sort((a,b)=>sc[a[0]]-sc[b[0]]);
  const weak=arr[0];
  const avg=(sc.control+sc.deserved+sc.gratification)/3;
  if(EN){
    const head = weak[0]==='control' ? `Weakest is control: every step of this ${noun} was decided for them.`
               : weak[0]==='deserved' ? `Weakest is identity: hold this ${noun} and you can't say "this is mine".`
               : `Weakest is delight: this ${noun} ends without one moment that lands.`;
    const tail = avg>=7.5?'All three hold — push further.':avg>=5?'Middle ground: fix the weakest pillar only.':'Fix the weakest pillar first, not all three.';
    return head+tail;
  }
  const head = weak[0]==='control' ? `最弱是掌控：${noun}里每一步都被人替你安排好了。`
             : weak[0]==='deserved' ? `最弱是配得：${noun}拿在手上，说不出一句"这是我的"。`
             : `最弱是满足：${noun}用完了，没有一个当下就成立的瞬间。`;
  const tail = avg>=7.5?'三柱都在线，可以往上加码。':avg>=5?'中间地带，只改最弱的那一柱就够。':'先只改最弱的那一柱，别同时动三处。';
  return head+tail;
}
function getNoun(t){
  if(!t)return EN?'product':'产品';
  const keys=EN?['cup','mug','watch','keyboard','headphone','phone','bottle','bowl','shirt','shoe','bag','burger','coffee','tea','breakfast','buffet','hotel','course','app','chair','lamp','box']
               :['早餐','自助餐','餐厅','奶茶','咖啡','店','APP','小程序','课程','会员','礼盒','耳机','手机','游戏','护肤品','口红','球鞋','手表','腕表','盲盒','手办','周边','社群','服务','品牌','活动','杯'];
  const hay=EN?String(t).toLowerCase():t;
  for(const k of keys){ if(hay.indexOf(k)>=0) return k; }
  return EN?'thing':'产品';
}
function pickQuickwin(sc,desc){
  const noun=getNoun(desc);
  const arr=EN
    ? [['control','Product',`Delete the pre-ticked defaults and the upsell line on the ${noun}: let people choose once, then suggest.`],
       ['deserved','Packaging',`Re-skin the ${noun} in one matte colour with a single mark that can be shown; drop the promo stickers.`],
       ['gratification','Community',`Add one 30-second beat inside the ${noun} that gives feedback on the spot, so people want to photograph it.`]]
    : [['control','产品翻译',`把${noun}的默认勾选和推荐话术删掉，改成让人先自己选一次，选完再给建议。`],
       ['deserved','包装翻译',`给${noun}换一套能拍的外观：单色哑光底＋一个可露出的标识，去掉满屏促销字。`],
       ['gratification','社群翻译',`在${noun}的过程里加一个 30 秒内就有反馈的小动作，让人当场想拍一张。`]];
  arr.sort((a,b)=>sc[a[0]]-sc[b[0]]);
  return {step:arr[0][1],text:arr[0][2]};
}
function pickHeadline(sc,desc){
  const arr=[['control',0],['deserved',1],['gratification',2]];
  arr.sort((a,b)=>sc[a[0]]-sc[b[0]]);
  const w=arr[0][0]; const noun=getNoun(desc);
  const avg=(sc.control+sc.deserved+sc.gratification)/3;
  if(EN){
    if(avg<4) return `Fifty years on, this ${noun} hasn't changed.`;
    if(w==='control') return `Every step of this ${noun} is decided for you.`;
    if(w==='deserved') return `This ${noun} stops at "good enough".`;
    return `Good, but you won't remember it.`;

  if(w==='control') return `这${noun}，每一步都替 TA 想好了。`;
  if(w==='deserved') return `这${noun}，还停在"够用就好"。`;
  return `这${noun}，好是好，就是记不住。`;
}

      :`产品/服务描述：${S.desc||'（无文字描述）'}\n小Z看到的：${S.look||'（无）'}\n\n对话记录：\n${transcript}\n\n请输出JSON：{control,control_band,deserved,deserved_band,gratification,gratification_band,control_why,deserved_why,grat_why,headline,verdict,quickwin,step}`}];
    if(S.photoData) userParts.unshift({type:'image_url',image_url:{url:S.photoData}});
    let ans=await streamText(cloud,sys,userParts,'auto',{temperature:0});
    const o=parseJSON(ans); if(!o||typeof o.control==='undefined')return null;
    /* 分数＝档位＋微调（±0.4）：同一档内两次打分最多差 0.8，稳定落在 0.9 之内 */
    const BANDS=[1,3,5,7,9,10];
    const nearestBand=v=>{
      const n=parseFloat(String(v).replace(/[^\d.]/g,''));
      if(isNaN(n))return null;
      return BANDS.reduce((a,b)=>Math.abs(b-n)<Math.abs(a-n)?b:a);
    };
    const banded=(score,bandKey)=>{
      const n=parseFloat(String(score).replace(/[^\d.]/g,''));
      let s=isNaN(n)?5:n;
      let b=nearestBand(o[bandKey]);
      if(b===null) b=BANDS.reduce((a,c)=>Math.abs(c-s)<Math.abs(a-s)?c:a);
      s=Math.max(b-0.4,Math.min(b+0.4,s));
      s=Math.max(1,Math.min(10,Math.round(s*10)/10));
      return s;
    };
    /* 两道硬护栏：压掉「同一句话被读成两档」的跳档，同一输入不会一次 7 一次 9、一次 1 一次 3 */
    const ansText=S.answers.map(a=>a.a||'').join(' ');
    /* 中英两套证据词表：区间锁的逻辑不动，只换触发词 */
    const RX = EN ? {
      strongAutonomy:/my call|i decide|i set|all mine|fully mine|change whatever|no one tells|everything myself|reconfigur|built it myself/i,
      shameWords:/embarrass|ashamed|hide|hiding|wouldn'?t want anyone|too ugly|cover it|tuck it|awkward to show/i,
      negControl:/follow(ed|ing)? the crowd|herded|ushered|pushed through|no one asked|no choice|handed to me|company gave|forced|only option|had to take|just took what/i,
      selfWords:/i chose|i picked|i decided|myself|my own/i,
      negGrat:/no surprise|forgettable|nothing memorable|no impression|just ate|unpleasant|too much hassle/i,
      askWords:/asked where|where did you get|recommend|how do i|followed my|copy me|asked me|wanted one/i,
      strongGrat:/recorded|replayed|again and again|every time i|shared it with|recommended it|told my friends/i,
      modWords:/swap|replac|switch|modul|keycap|customi[sz]|rebuild|reconfigur|assemble/i,
      choiceWords:/sugar|ice|sweetness|size|flavou?r|colou?r|pick my|choose my/i,
      shopWords:/shelf|store|shop|counter|bought|ordered|picked one|off the rack/i,
      fadeWords:/two days|lost it|wore off|faded|nothing special|just okay|wears off|got bored/i
    } : {
      strongAutonomy:/全按我的来|想怎么改|随便改|没人规定|我说了算|自己全定|全都自己|想换就换|我自己定/,
      shameWords:/不好意思|丢人|藏着|不敢|怕被看见|羞耻|遮一下|掩饰|难为情|拿不出手/,
      negControl:/跟着人流|被人流|催着|被安排|没人问|没问我|没得选|别人定|公司发|送的|只能这样/,
      selfWords:/自己|我定|我挑|我选|我勾/,
      negGrat:/没有惊喜|没印象|没什么印象|完全没有|一点都不|全程埋头|很难受|太麻烦/,
      askWords:/问我在哪买|求推荐|跟着买|跟着换|问我怎么|要我帮|被问|来问我|学我/,
      strongGrat:/专门录|录了音|录下来|反复用|反复看|反复玩|反复听|反复敲|每次用|每次喝|每次穿|每次玩|分享给|发给朋友|安利/,
      modWords:/可换|能换|自己换|换了三套|自己改|改配置|换轴|键帽|自己装|可拆|可重配|自定义/,
      choiceWords:/甜度|冰量|三分糖|去冰|口味|尺寸|规格|配色|自己选|自选|自己勾/,
      shopWords:/货架|专柜|柜台|店里|买了|下单|挑了一块|挑的/,
      fadeWords:/两天就没|就没感觉|久了就没|第二次就没|没什么特别|就那样|一般般/
    };
    const strongAutonomy=RX.strongAutonomy.test(ansText);
    const shameWords=RX.shameWords.test(ansText);
    const negControl=RX.negControl.test(ansText);
    const selfWords=RX.selfWords.test(ansText);
    const negGrat=RX.negGrat.test(ansText);
    const askWords=RX.askWords.test(ansText);
    const strongGrat=RX.strongGrat.test(ansText);
    const modWords=RX.modWords.test(ansText);
    const choiceWords=RX.choiceWords.test(ansText);
    const shopWords=RX.shopWords.test(ansText);
    const fadeWords=RX.fadeWords.test(ansText);
    /* 区间锁定：9 档要么有明确证据、要么不给；同一句证据永远落同一个区间 */
    const guard=(s,kind)=>{
      if(kind==='control'){
        if(negControl&&!selfWords) return Math.min(s,1.4);
        if(strongAutonomy) return Math.max(8.6,Math.min(9.4,s));
        if(modWords) return Math.max(6.6,Math.min(7.4,s));
        if(choiceWords) return Math.max(4.6,Math.min(5.4,s));
        if(shopWords) return Math.min(s,3.9);
        return Math.min(s,7.4);
      }
      if(kind==='deserved'){
        if(shameWords) return Math.min(s,1.4);
        if(askWords) return Math.max(8.6,Math.min(9.4,s));
        return Math.max(3,Math.min(7.9,s));
      }
      if(negGrat) return Math.min(s,1.4);
      if(strongGrat) return Math.max(8.6,Math.min(9.4,s));
      if(fadeWords) return Math.max(4.6,Math.min(5.4,s));
      return Math.min(s,7.9);
    };
    const c1=guard(banded(o.control,'control_band'),'control');
    const d1=guard(banded(o.deserved,'deserved_band'),'deserved');
    const g1=guard(banded(o.gratification,'gratification_band'),'grat');
    return {control:c1,deserved:d1,gratification:g1,
      control_why:o.control_why||pillarWhy('control',c1),
      deserved_why:o.deserved_why||pillarWhy('deserved',d1),
      grat_why:o.grat_why||pillarWhy('gratification',g1),
      headline:o.headline||'',verdict:o.verdict||'',quickwin:o.quickwin||'',step:normalizeStep(o.step),ai:true};
  }catch(e){ window.__cloudErr='diag:'+(e&&(e.error&&e.error.code||e.message)); return null; }
}

/* 上传即压缩：手机原图 3~5MB 直接送模型会拖到 20 秒以上并超时降级，压到 1280px 后约 150~250KB */
function normImage(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const raw=fr.result, img=new Image();
      img.onload=()=>{
        try{
          const max=1280, s=Math.min(1,max/Math.max(img.width,img.height));
          const w=Math.max(1,Math.round(img.width*s)), h=Math.max(1,Math.round(img.height*s));
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          const out=cv.toDataURL('image/jpeg',0.85);
          res(out.length<raw.length?out:raw);
        }catch(e){ res(raw); }
      };
      img.onerror=()=>res(raw);
      img.src=raw;
    };
    fr.readAsDataURL(file);
  });
}
function onFile(f){

/* ============ 分享卡（INS 风格 canvas → PNG，含大图/直接判词/速赢攻略/双二维码） ============ */
function pathRound(ctx,X,Y,w,h,r){ctx.beginPath();ctx.moveTo(X+r,Y);ctx.arcTo(X+w,Y,X+w,Y+h,r);ctx.arcTo(X+w,Y+h,X,Y+h,r);ctx.arcTo(X,Y+h,X,Y,r);ctx.arcTo(X,Y,X+w,Y,r);ctx.closePath();}
function wrapLines(ctx,text,maxW){
  const s=String(text||'');
  /* 中文按字断行；有空格的语言按词断行，否则英文会被切开 */
  if(/\s/.test(s)){
    const words=s.split(/\s+/), res=[]; let line='';
    for(const w of words){
      const test=line?line+' '+w:w;
      if(line && ctx.measureText(test).width>maxW){ res.push(line); line=w; } else line=test;
    }
    if(line)res.push(line);
    return res;
  }
  const chars=[...s]; let line='',res=[];
  for(const ch of chars){ if(line && ctx.measureText(line+ch).width>maxW){ res.push(line); line=ch; } else line+=ch; }
  if(line)res.push(line);
  return res;
}
function makeQR(url){ try{ const qr=qrcode(0,'M'); qr.addData(url); qr.make(); return qr.createDataURL(6,4); }catch(e){ return null; } }
/* 等比裁切铺满，避免照片被拉变形 */
function drawCover(x,img,X,Y,w,h){
  const ir=img.width/img.height, r=w/h; let sw,sh,sx,sy;
  if(ir>r){ sh=img.height; sw=sh*r; sx=(img.width-sw)/2; sy=0; }
  else { sw=img.width; sh=sw/r; sx=0; sy=(img.height-sh)/2; }
  x.drawImage(img,sx,sy,sw,sh,X,Y,w,h);
}
function drawCard(){
  const sc=S.scores; const avg=((sc.control+sc.deserved+sc.gratification)/3).toFixed(1);
  const W=1080,H=1560,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const px=48,py=48,pw=W-96,ph=580,pr=32;
  // background
  x.fillStyle='#FFFFFF'; x.fillRect(0,0,W,H);
  // photo placeholder
  const pg=x.createLinearGradient(0,py,W,py+ph); pg.addColorStop(0,'#0CA678'); pg.addColorStop(1,'#09835E');
  x.fillStyle=pg; pathRound(x,px,py,pw,ph,pr); x.fill();
  // QR data urls
  const qrApp=makeQR(APP_URL), qrPro=makeQR(PRO_URL);
  const imgs={photo:null,qrApp:null,qrPro:null}; let pending=0;
  const load=(src,key)=>{ if(!src)return; pending++; const im=new Image(); im.onload=()=>{imgs[key]=im;ready();}; im.onerror=ready; im.src=src; };
  const ready=()=>{ if(--pending<=0) paint(); };
  load(S.photoData,'photo'); load(qrApp,'qrApp'); load(qrPro,'qrPro');
  if(pending===0) paint();

  function paint(){
    // photo
    if(imgs.photo){ x.save(); pathRound(x,px,py,pw,ph,pr); x.clip(); drawCover(x,imgs.photo,px,py,pw,ph); x.restore(); }
    // scrim for headline legibility
    const sg=x.createLinearGradient(0,py+ph*0.30,0,py+ph); sg.addColorStop(0,'rgba(0,0,0,0)'); sg.addColorStop(1,'rgba(0,0,0,0.78)');
    x.save(); pathRound(x,px,py,pw,ph,pr); x.clip(); x.fillStyle=sg; x.fillRect(px,py,pw,ph); x.restore();
    // tag pill（宽度跟着文案走，中英都贴边）
    const tagTxt=t('cardTag');
    x.font='800 27px -apple-system,"PingFang SC",sans-serif';
    const tagW=x.measureText(tagTxt).width;
    x.fillStyle='rgba(255,255,255,0.94)'; pathRound(x,px+28,py+28,tagW+44,54,27); x.fill();
    x.fillStyle='#0CA678'; x.textAlign='left'; x.fillText(tagTxt,px+50,py+64);
    // headline over photo (the direct one-liner)
    const hFont=EN?44:46, hLH=EN?52:58, hMax=EN?3:2;
    x.fillStyle='#FFFFFF'; x.font='800 '+hFont+'px -apple-system,"PingFang SC",sans-serif'; x.textAlign='left';
    const hlines=wrapLines(x,S.headline||S.verdict||'',pw-56).slice(0,hMax);
    const hY=py+ph-44-(hlines.length-1)*hLH;
    hlines.forEach((ln,i)=>x.fillText(ln,px+28,hY+i*hLH));
    // ---- content below photo ----
    let y=py+ph+66; // ~662
    // score big + label
    x.textAlign='left'; x.fillStyle='#0CA678'; x.font='800 96px -apple-system,sans-serif'; x.fillText(avg,px,y+72);
    const sw=x.measureText(avg).width;
    x.fillStyle='#8A8A8F'; x.font='600 24px -apple-system,"PingFang SC",sans-serif'; x.fillText(t('cardScore'),px+sw+22,y+34);
    // 右侧只放「最弱的一项」，不再重复三柱明细
    const _weak=[[t('p1'),sc.control],[t('p2'),sc.deserved],[t('p3'),sc.gratification]].sort((a,b)=>a[1]-b[1])[0];
    x.textAlign='right'; x.fillStyle='#8A8A8F'; x.font='600 24px -apple-system,"PingFang SC",sans-serif';
    x.fillText(t('cardWeak')+_weak[0],W-px-96,y+28);
    x.fillStyle='#18181B'; x.font='800 44px -apple-system,sans-serif'; x.fillText(_weak[1].toFixed(1),W-px,y+34);
    // pillars detailed
    let py2=y+150;
    const rows=[[t('p1'),sc.control,'#3B82F6',S.control_why],[t('p2'),sc.deserved,'#7C5CFC',S.deserved_why],[t('p3'),sc.gratification,'#FF8A5B',S.grat_why]];
    rows.forEach(([n,v,c,why])=>{
      x.textAlign='left'; x.fillStyle='#18181B'; x.font='700 28px -apple-system,"PingFang SC",sans-serif'; x.fillText(n,px,py2);
      x.textAlign='right'; x.fillStyle=c; x.font='800 30px -apple-system,sans-serif'; x.fillText(v.toFixed(1),W-px,py2);
      const bx=px,by=py2+16,bw=W-2*px,bh=14;
      x.fillStyle='#ECEAE6'; pathRound(x,bx,by,bw,bh,7); x.fill();
      x.fillStyle=c; pathRound(x,bx,by,bw*(v/10),bh,7); x.fill();
      x.textAlign='left'; x.fillStyle='#8A8A8F'; x.font='500 22px -apple-system,"PingFang SC",sans-serif';
      x.fillText('↳ '+why,bx,py2+54);
      py2+=94;
    });
    // 速赢攻略 block
    const qy=py2+24;
    x.fillStyle='#E7F6EF'; pathRound(x,px,qy,W-2*px,156,24); x.fill();
    x.textAlign='left'; x.fillStyle='#0CA678'; x.font='800 27px -apple-system,"PingFang SC",sans-serif'; x.fillText(t('cardWin'),px+28,qy+48);
    x.fillStyle='#18181B'; x.font='600 25px -apple-system,"PingFang SC",sans-serif';
    wrapLines(x,S.quickwin,W-2*px-56).slice(0,2).forEach((ln,i)=>x.fillText(ln,px+28,qy+92+i*34));
    // QR row
    const qrY=qy+156+22, qrS=150;
    const drawQR=(key,qx,cap)=>{ if(imgs[key]){ x.fillStyle='#FFFFFF'; pathRound(x,qx,qrY,qrS,qrS,16); x.fill(); x.drawImage(imgs[key],qx,qrY,qrS,qrS); }
      else { x.fillStyle='#F2F2F2'; pathRound(x,qx,qrY,qrS,qrS,16); x.fill(); }
      x.fillStyle='#18181B'; x.font='700 23px -apple-system,"PingFang SC",sans-serif'; x.textAlign='center'; x.fillText(cap,qx+qrS/2,qrY+qrS+34); };
    drawQR('qrApp',px,t('qrApp'));
    drawQR('qrPro',W-px-qrS,t('qrPro'));
    x.textAlign='left';
    // download
    const a=document.createElement('a');a.download=t('fileName')+new Date().toISOString().slice(0,10)+'.png';a.href=cv.toDataURL('image/png');a.click();
  }
}

if(/[?&]diag=1/.test(location.search)){ setTimeout(async()=>{
  const out=[]; const c=await ensureCloud();
  out.push('cloud='+(c?'yes':'null')+' err='+(window.__cloudErr||'-'));
  if(c){ try{ const t=await withTimeout(streamText(c,'只回一个字：好','连通测试'),15000); out.push('text="'+(t||'').slice(0,40)+'"'); }catch(e){ out.push('call_err:'+(e&&(e.error&&e.error.code||e.message))); } }
  out.push('origin='+location.origin);
  $('#screen').innerHTML='<pre style="white-space:pre-wrap;font:12px/1.6 monospace;background:#fff;padding:14px;border-radius:12px">'+out.join('\n')+'</pre>';
},600); }

if(/[?&]demo=1/.test(location.search)) setTimeout(runDemo,260);

if('serviceWorker' in navigator){window.addEventListener('load',()=>{try{navigator.serviceWorker.register(window.__SW_PATH||'./sw.js').catch(()=>{});}catch(e){}});}
